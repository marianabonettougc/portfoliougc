<meta http-equiv="Cache-Control" content="no-cache">
<script>
// Atualiza sozinho: se existir uma versão mais nova do painel publicada, recarrega a página nova
window.VERSAO_PAINEL = "202610081717";
fetch("../js/versao.json?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((j) => {
  if (j.versao && j.versao !== window.VERSAO_PAINEL) {
    const u = new URL(location.href);
    if (u.searchParams.get("v") !== j.versao) { u.searchParams.set("v", j.versao); location.replace(u.toString()); }
  }
}).catch(() => {});
</script>

<script>
// PRIMEIRA COISA: conferir a sessão. Sem sessão, vai para o login.
// A página só aparece depois dessa conferência (antes ela fica escondida).
window.sessaoPronta = (async function () {
  const irProLogin = () => { location.replace("../login/"); return null; };
  if (!window.banco) return irProLogin();
  try {
    const { data } = await window.banco.auth.getSession();
    const sessao = data && data.session;
    if (!sessao) return irProLogin();
    if (sessao.user && sessao.user.email !== window.BANCO_EMAIL_DONA) {
      await window.banco.auth.signOut();
      return irProLogin();
    }
    return sessao;
  } catch (e) {
    return irProLogin();
  }
})();
</script>
