              {f.nf.arquivo && <div style={{fontSize:13, color:"var(--graphite-soft)", marginTop:4}}><Icon name="attach_file" size={13}/> {f.nf.arquivo}</div>}
            </Field>
          </div>
        )}
        <div style={{fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"var(--graphite-soft)", margin:"14px 0 8px"}}>Controle de pagamento</div>
        <div className="field-row">
          <Field label="Status">
            <select value={f.pagamento.status} onChange={e=>setNested("pagamento","status",e.target.value)}>
              <option>Em aberto</option><option>Pago</option>
            </select>
          </Field>
          <Field label="Forma de pagamento">
            <select value={f.pagamento.forma} onChange={e=>setNested("pagamento","forma",e.target.value)}>
              {PAYMENT_METHODS.map(p=><option key={p}>{p}</option>)}
            </select>
          </Field>
        </div>
        <div className="field-row">
          <Field label="Data prevista"><input type="date" value={f.pagamento.dataPrevista} onChange={e=>setNested("pagamento","dataPrevista",e.target.value)}/></Field>
          <Field label="Data do pagamento"><input type="date" value={f.pagamento.dataPagamento} onChange={e=>setNested("pagamento","dataPagamento",e.target.value)}/></Field>
        </div>
        <Field label="Comprovante de pagamento">
          <input type="file" onChange={e=>setNested("pagamento","comprovante", e.target.files[0]?e.target.files[0].name:"")}/>
          {f.pagamento.comprovante && <div style={{fontSize:13, color:"var(--graphite-soft)", marginTop:4}}><Icon name="attach_file" size={13}/> {f.pagamento.comprovante}</div>}
        </Field>
      </Collapsible>

      <Collapsible title="Direitos de Uso — Tráfego Pago" icon="campaign" defaultOpen={false} badge={f.trafegoPago.ativo && <Badge tone="wine" style={{marginLeft:6}}>ativo</Badge>}>
        <div className="row-item" style={{marginBottom: f.trafegoPago.ativo ? 12 : 0}}>
          <strong style={{fontSize:15}}>Adicionar tráfego pago (ads)</strong>
          <Toggle on={f.trafegoPago.ativo} onClick={()=>setNested("trafegoPago","ativo",!f.trafegoPago.ativo)}/>
        </div>
        {f.trafegoPago.ativo && (
          <div>
            <div className="field" style={{marginBottom:14}}>
              <label>Período de uso em ads</label>
              <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                {TRAFEGO_PERIODOS.map(p=>(
                  <button type="button" key={p.key} onClick={()=>setPeriodo(p.key)}
                    style={{padding:"7px 14px", borderRadius:999, border:"1.5px solid "+(f.trafegoPago.periodo===p.key?"var(--butter)":"var(--line)"), background: f.trafegoPago.periodo===p.key?"var(--butter-soft)":"#fff", fontSize:13.5, cursor:"pointer"}}>
                    {p.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="field-row">
              <Field label="Data de início"><input type="date" value={f.trafegoPago.dataInicio} onChange={e=>{ setNested("trafegoPago","dataInicio",e.target.value); setNested("trafegoPago","dataFim", calcDataFim(e.target.value, f.trafegoPago.periodo)); }}/></Field>
              <Field label="Data de término"><input type="date" value={f.trafegoPago.dataFim} onChange={e=>setNested("trafegoPago","dataFim",e.target.value)} disabled={f.trafegoPago.periodo!=="perm" ? false : false}/></Field>
            </div>
            <Field label="Valor adicional por tráfego pago"><input type="number" value={f.trafegoPago.valorAdicional} onChange={e=>setNested("trafegoPago","valorAdicional",e.target.value)} placeholder="0,00"/></Field>

            <div className="field" style={{marginBottom:14}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
                <label style={{marginBottom:0}}>Tabela de preços para renovação</label>
                <button type="button" className="btn btn-ghost btn-sm" onClick={()=>{
                  const base = Number(f.trafegoPago.valorAdicional||0);
                  setNested("trafegoPago","precos",{ "3m": base||"", "6m": base?(base*2).toFixed(2):"", "12m": base?(base*4*0.9).toFixed(2):"" });
                }}><Icon name="auto_awesome" size={13}/>Sugerir automaticamente</button>
              </div>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10}}>
                <Field label="3 meses"><input type="number" value={f.trafegoPago.precos["3m"]} onChange={e=>setNested("trafegoPago","precos",{...f.trafegoPago.precos,"3m":e.target.value})} placeholder="0,00"/></Field>
                <Field label="6 meses"><input type="number" value={f.trafegoPago.precos["6m"]} onChange={e=>setNested("trafegoPago","precos",{...f.trafegoPago.precos,"6m":e.target.value})} placeholder="0,00"/></Field>
                <Field label="12 meses (10% off)"><input type="number" value={f.trafegoPago.precos["12m"]} onChange={e=>setNested("trafegoPago","precos",{...f.trafegoPago.precos,"12m":e.target.value})} placeholder="0,00"/></Field>
              </div>
            </div>

            <div className="field" style={{marginBottom:14}}>
              <label>Plataformas autorizadas</label>
              <div style={{display:"flex", gap:12, flexWrap:"wrap"}}>
                {TRAFEGO_PLATAFORMAS.map(p=>(
                  <label key={p} style={{display:"flex", alignItems:"center", gap:6, fontSize:14.5, cursor:"pointer"}}>
                    <input type="checkbox" checked={f.trafegoPago.plataformas.includes(p)} onChange={()=>togglePlataforma(p)}/>{p}
                  </label>
                ))}
              </div>
            </div>
            <Field label="Vincular contrato (opcional)">
              <select value={f.trafegoPago.contrato} onChange={e=>setNested("trafegoPago","contrato",e.target.value)}>
                <option>Nenhum</option>
              </select>
            </Field>
            <div style={{background:"var(--card-bg)", border:"1px solid var(--line)", borderRadius:12, padding:"12px 14px", fontSize:14.5, marginBottom:12}}>
              <div style={{display:"flex", justifyContent:"space-between", padding:"3px 0"}}><span>Orgânico:</span><strong>{fmtMoneyCur(orgVal, f.moeda)}</strong></div>
              <div style={{display:"flex", justifyContent:"space-between", padding:"3px 0"}}><span>Tráfego ({TRAFEGO_PERIODOS.find(p=>p.key===f.trafegoPago.periodo)?.label}):</span><strong>{fmtMoneyCur(trafVal, f.moeda)}</strong></div>
              <div style={{display:"flex", justifyContent:"space-between", padding:"5px 0 0", borderTop:"1px solid var(--line)", marginTop:4, color:"var(--wine)", fontWeight:700}}><span>TOTAL:</span><span>{fmtMoneyCur(orgVal+trafVal, f.moeda)}</span></div>
            </div>
            <div style={{display:"flex", gap:8, alignItems:"flex-start", fontSize:13, color:"var(--graphite-soft)", background:"var(--card-bg)", borderRadius:10, padding:"10px 12px"}}>
              <Icon name="notifications" size={16}/>
              <span>Você receberá alertas 30 dias, 7 dias antes do vencimento e após o vencimento (oportunidade de renovação).</span>
            </div>
          </div>
        )}
      </Collapsible>

      <Field label="Observações"><textarea rows="3" value={f.observacoes} onChange={e=>set("observacoes",e.target.value)} placeholder="Detalhes do job, briefing, links..."/></Field>

      <button className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={()=>{
        if(!f.marca){ alert("Informe a marca."); return; }
        onSave({...f, id: f.id || uid(), criadoEm: f.criadoEm || todayISO()});
      }}>{initial ? "Salvar alterações" : "Criar UGC / Publi"}</button>

      {nichoModal && <NichoModal state={state} updateState={updateState} onClose={()=>setNichoModal(false)}/>}
      {distribModal && <DistribuirPlannerModal marca={f.marca} prazoEntrega={f.prazoEntrega} entregaveis={f.entregaveis} onClose={()=>setDistribModal(false)} onConfirm={confirmarDistribuicao}/>}
    </Modal>
  );
}

function JobCard({j, onEdit, onDelete, onMarkPaid, onDuplicate, draggable, onDragStart}){
  const hoje = todayISO();
  const isHoje = j.prazoEntrega===hoje;
  const totalV = (j.entregaveis?.videos||[]).length, totalF = (j.entregaveis?.fotos||[]).length;
  const pago = j.pagamento && j.pagamento.status==="Pago";
  return (
    <div className="kanban-card" draggable={draggable} onDragStart={draggable ? (e)=>onDragStart(e, j.id) : undefined}>
      <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:4}}>
        {j.categoria && <Badge tone={FINALIDADE_TONE[j.categoria]||"gray"}>{j.categoria}</Badge>}
        {j.recorrente && <span title="Job recorrente" style={{display:"inline-flex"}}><Icon name="repeat" size={15} style={{color:"var(--wine)"}}/></span>}
      </div>
      <div style={{display:"flex", alignItems:"center", gap:6}}>
        <strong style={{fontSize:14}}>{j.marca}</strong>
      </div>
      <div style={{fontSize:13, color:"var(--graphite-soft)", margin:"4px 0"}}>{j.tipo || "Conteúdo"}</div>
      <div style={{display:"flex", gap:10, fontSize:12.5, color:"var(--graphite-soft)", marginBottom:6}}>
        <span style={{display:"flex", alignItems:"center", gap:3}}><Icon name="videocam" size={13}/>{totalV}</span>
        <span style={{display:"flex", alignItems:"center", gap:3}}><Icon name="photo_camera" size={13}/>{totalF}</span>
        {j.prazoEntrega && <span style={{display:"flex", alignItems:"center", gap:3}}><Icon name="event" size={13}/>{j.prazoEntrega.slice(8,10)}/{j.prazoEntrega.slice(5,7)}</span>}
        {isHoje && <Badge tone="yellow">Hoje</Badge>}
      </div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
        <strong style={{fontSize:15}}>{j.tipoJob==="Permuta" ? "Permuta" : fmtMoneyCur(j.valor, j.moeda)}</strong>
        {j.tipoJob!=="Permuta" && <Badge tone={pago?"green":"yellow"}>{pago?"Pago":"A receber"}</Badge>}
      </div>
      <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
        {j.tipoJob!=="Permuta" && (
          pago ? (
            <button className="btn btn-ghost btn-sm" onClick={()=>onMarkPaid(j.id)}><Icon name="cancel" size={14}/>Desmarcar pago</button>
          ) : (
            <button className="btn btn-primary btn-sm" style={{background:"var(--moss)", color:"#fff"}} onClick={()=>onMarkPaid(j.id)}><Icon name="check_circle" size={14}/>Marcar pago</button>
          )
        )}
        <button className="btn btn-ghost btn-sm" onClick={()=>onEdit(j)}><Icon name="edit" size={14}/>Editar</button>
        {onDuplicate && <button className="icon-btn" style={{width:30,height:30}} onClick={()=>onDuplicate(j)}><Icon name="content_copy" size={14}/></button>}
        <button className="icon-btn" style={{width:30,height:30}} onClick={()=>onDelete(j.id)}><Icon name="delete" size={14}/></button>
      </div>
    </div>
  );
}

function Jobs({state, updateState}){
  // "Nova campanha" no Dashboard abre o formulário de novo job direto
  const [modal,setModal] = useState(()=>{ if(window.__abrirNovoJob){ window.__abrirNovoJob = false; return true; } return false; });
  const [editing,setEditing] = useState(null);
  const [query,setQuery] = useState("");
  const [view,setView] = useState("Lista");
  const [tab,setTab] = useState("Ativos");
  const [dragOverCol,setDragOverCol] = useState(null);
  const [showFilter,setShowFilter] = useState(false);
  const [filterStatus,setFilterStatus] = useState("Todos");
  const [confirmPagoId,setConfirmPagoId] = useState(null);

  function persistJob(job){
    const exists = state.jobs.some(j=>j.id===job.id);
    const list = exists ? state.jobs.map(j=>j.id===job.id?job:j) : [...state.jobs, job];
    const followups = syncFollowups(state.followups, job);
    const transacoes = syncTransacaoFromJob(state.transacoes, job);
    updateState({...state, jobs:list, followups, transacoes});
  }
  function save(job){
    persistJob(job);
    setModal(false); setEditing(null);
  }
  function remove(id){
    updateState({...state, jobs: state.jobs.filter(j=>j.id!==id), transacoes: state.transacoes.filter(t=>t.jobId!==id)});
  }
  function setStatus(id, status){
    const job = state.jobs.find(j=>j.id===id);
    if(!job) return;
    const updated = {...job, status};
    const jobs = state.jobs.map(j=>j.id===id?updated:j);
    const followups = syncFollowups(state.followups, updated);
    const transacoes = syncTransacaoFromJob(state.transacoes, updated);
    updateState({...state, jobs, followups, transacoes});
  }
  function markPaid(id){
    setConfirmPagoId(id);
  }
  function confirmarTogglePago(){
    const id = confirmPagoId;
    setConfirmPagoId(null);
    const job = state.jobs.find(j=>j.id===id);
    if(!job) return;
    const jaPago = job.pagamento && job.pagamento.status==="Pago";
    const updated = {...job, pagamento:{...(job.pagamento||{}), status: jaPago ? "Em aberto" : "Pago", dataPagamento: jaPago ? "" : (job.pagamento && job.pagamento.dataPagamento ? job.pagamento.dataPagamento : todayISO())}};
    const jobs = state.jobs.map(j=>j.id===id?updated:j);
    const transacoes = syncTransacaoFromJob(state.transacoes, updated);
    updateState({...state, jobs, transacoes});
  }
  function duplicate(job){
    const clone = { ...job, id:uid(), marca: job.marca+" (cópia)", status:"Lead", criadoEm:todayISO(), dataEntregaReal:"",
      pagamento:{...(job.pagamento||{}), status:"Em aberto", dataPagamento:""},
      entregaveis: resetEntregaveisConcluido(job.entregaveis || emptyEntregaveis())
    };
    const transacoes = syncTransacaoFromJob(state.transacoes, clone);
    updateState({...state, jobs:[...state.jobs, clone], transacoes});
  }

  let list = state.jobs;
  if(tab==="Ativos") list = list.filter(j=>j.status!=="Cancelado" && !isHistorico(j));
  if(tab==="Histórico") list = list.filter(j=>isHistorico(j));
  if(query) list = list.filter(j => (j.marca+(j.tipo||"")+(j.observacoes||"")+(j.nicho||"")).toLowerCase().includes(query.toLowerCase()));
  if(filterStatus!=="Todos") list = list.filter(j=>j.status===filterStatus);

  const ativosCount = state.jobs.filter(j=>j.status!=="Cancelado" && !isHistorico(j)).length;
  const historicoCount = state.jobs.filter(j=>isHistorico(j)).length;

  function onDragStart(e, id){ e.dataTransfer.setData("text/plain", id); }
  function onDrop(e, status){
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    setStatus(id, status);
    setDragOverCol(null);
  }

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">UGC's &amp; Publis</h1>
          <p className="page-sub">Gerencie seus trabalhos com marcas</p>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal(true)}><Icon name="add" size={17}/>Novo Job</button>
      </div>

      <div className="search" style={{marginBottom:14}}>
        <Icon name="search"/>
        <input placeholder="Buscar por marca, tipo de conteúdo, detalhes do job ou nicho..." value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10}}>
        <div className="tabs">
          <div className={"tab "+(tab==="Ativos"?"active":"")} onClick={()=>setTab("Ativos")}>Ativos ({ativosCount})</div>
          <div className={"tab "+(tab==="Organize"?"active":"")} onClick={()=>setTab("Organize")}>Organize</div>
          <div className={"tab "+(tab==="Histórico"?"active":"")} onClick={()=>setTab("Histórico")}>Histórico ({historicoCount})</div>
        </div>
        {tab==="Ativos" && (
          <div className="tabs">
            {["Lista","Grade"].map(t=><div key={t} className={"tab "+(view===t?"active":"")} onClick={()=>setView(t)}>{t}</div>)}
          </div>
        )}
      </div>

      {tab!=="Organize" && (
        <div style={{marginBottom:16}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowFilter(v=>!v)}><Icon name="tune" size={15}/>Filtrar</button>
          {showFilter && (
            <div style={{marginTop:10, display:"flex", gap:10, alignItems:"center"}}>
              <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{maxWidth:220}}>
                <option>Todos</option>
                {JOB_STATUS.map(s=><option key={s}>{s}</option>)}
              </select>
              {filterStatus!=="Todos" && <button className="btn btn-ghost btn-sm" onClick={()=>setFilterStatus("Todos")}>Limpar</button>}
            </div>
          )}
        </div>
      )}

      {tab==="Organize" ? (
        <div style={{display:"flex", gap:14, overflowX:"auto", paddingBottom:10}}>
          {JOB_STATUS.map(col=>{
            const colJobs = state.jobs.filter(j=>j.status===col && !isHistorico(j) && (!query || (j.marca+(j.tipo||"")).toLowerCase().includes(query.toLowerCase())));
            return (
              <div key={col} onDragOver={(e)=>{e.preventDefault(); setDragOverCol(col);}} onDrop={(e)=>onDrop(e,col)}
                style={{minWidth:260, flexShrink:0, background:"var(--sand)", borderRadius:16, padding:12, borderTop:"3px solid "+KANBAN_COLORS[col], outline: dragOverCol===col ? "2px dashed var(--butter)":"none"}}>
                <div style={{display:"flex", alignItems:"center", gap:6, fontSize:13.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".03em", color:"var(--graphite-soft)", margin:"2px 6px 10px"}}>
                  <span style={{width:8,height:8,borderRadius:"50%", background:KANBAN_COLORS[col]}}></span>{col} <span style={{marginLeft:"auto"}}>{colJobs.length}</span>
                </div>
                {colJobs.length===0 && <div style={{border:"1.5px dashed var(--line)", borderRadius:12, padding:"20px 10px", textAlign:"center", fontSize:13, color:"var(--graphite-soft)"}}>Arraste jobs para cá</div>}
                {colJobs.map(j=>(
                  <JobCard key={j.id} j={j} onEdit={setEditing} onDelete={remove} onMarkPaid={markPaid} onDuplicate={duplicate} draggable onDragStart={onDragStart}/>
                ))}
              </div>
            );
          })}
        </div>
      ) : list.length===0 ? (
        tab==="Histórico" ? (
          <div className="empty">
            <Icon name="archive"/>
            <div className="empty-title">Nenhum job no histórico ainda.</div>
            <div className="empty-sub">Jobs finalizados com pagamento confirmado aparecem aqui automaticamente.</div>
          </div>
        ) : (
          <EmptyState icon="videocam" title="Nenhum job por aqui" sub="Crie seu primeiro job para começar a acompanhar." cta="Novo Job" onClick={()=>setModal(true)}/>
        )
      ) : view==="Lista" ? (
        <div>
          {list.map(j=>(
            <div className="row-item" key={j.id}>
              <div style={{flex:1, minWidth:180}}>
                <div style={{display:"flex", alignItems:"center", gap:6}}>
                  <strong>{j.marca}</strong>
                  {j.recorrente && <span title="Job recorrente" style={{display:"inline-flex"}}><Icon name="repeat" size={14} style={{color:"var(--wine)"}}/></span>}
                </div>
                <div style={{fontSize:14.5, color:"var(--graphite-soft)"}}>{j.tipo} {j.nicho && "· "+j.nicho} {j.tipoJob==="Permuta" && "· Permuta"}</div>
              </div>
              <div style={{fontSize:15, color:"var(--graphite-soft)", minWidth:110}}>
                {j.prazoEntrega ? new Date(j.prazoEntrega+"T00:00:00").toLocaleDateString('pt-BR') : "sem prazo"}
              </div>
              <div style={{fontWeight:700, minWidth:100}}>{j.tipoJob==="Permuta" ? "Permuta" : fmtMoneyCur(j.valor, j.moeda)}</div>
              <Badge tone={jobStatusTone(j.status)}>{j.status}</Badge>
              <div style={{display:"flex", gap:6}}>
                {j.tipoJob!=="Permuta" && (
                  (j.pagamento && j.pagamento.status==="Pago") ? (
                    <button className="icon-btn" title="Desmarcar pago" onClick={()=>markPaid(j.id)}><Icon name="cancel" size={17}/></button>
                  ) : (
                    <button className="icon-btn" title="Marcar pago" onClick={()=>markPaid(j.id)}><Icon name="check_circle" size={17} style={{color:"var(--moss)"}}/></button>
                  )
                )}
                <button className="icon-btn" onClick={()=>setEditing(j)}><Icon name="edit" size={18}/></button>
                <button className="icon-btn" onClick={()=>duplicate(j)}><Icon name="content_copy" size={17}/></button>
                <button className="icon-btn" onClick={()=>remove(j.id)}><Icon name="delete" size={18}/></button>
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div className="grid grid-3">
          {list.map(j=><JobCard key={j.id} j={j} onEdit={setEditing} onDelete={remove} onMarkPaid={markPaid} onDuplicate={duplicate} draggable={false}/>)}
        </div>
      )}

      {modal && <JobModal state={state} updateState={updateState} onClose={()=>setModal(false)} onSave={save} onAutosave={persistJob}/>}
      {editing && <JobModal state={state} updateState={updateState} initial={editing} onClose={()=>setEditing(null)} onSave={save} onAutosave={persistJob}/>}
      {confirmPagoId && (() => {
        const job = state.jobs.find(j=>j.id===confirmPagoId);
        const jaPago = job && job.pagamento && job.pagamento.status==="Pago";
        return (
          <Modal title={jaPago ? "Desmarcar pagamento" : "Confirmar pagamento"} onClose={()=>setConfirmPagoId(null)}>
            <p style={{fontSize:14.5, marginTop:-4}}>
              {jaPago ? `Desmarcar "${job.marca}" como pago? Ele voltará para "Em aberto".` : `Confirmar que "${job ? job.marca : ""}" foi pago?`}
            </p>
            <div style={{display:"flex", gap:10, justifyContent:"flex-end", marginTop:10}}>
              <button className="btn btn-ghost" onClick={()=>setConfirmPagoId(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={confirmarTogglePago}>
                <Icon name={jaPago?"cancel":"check_circle"} size={16}/>{jaPago ? "Desmarcar" : "Confirmar pago"}
              </button>
            </div>
          </Modal>
        );
      })()}
    </div>
  );
}

/* ================= TRÁFEGO PAGO (visão geral) ================= */

  const [periodo,setPeriodo] = useState("3m");
  const dataFimFmt = job.trafegoPago.dataFim ? new Date(job.trafegoPago.dataFim+"T00:00:00").toLocaleDateString('pt-BR') : "—";
  const nomeConteudo = `${job.tipo||"conteúdo"} ${job.marca}`;
  const periodoAnteriorLabel = TRAFEGO_PERIODOS.find(p=>p.key===job.trafegoPago.periodo)?.label || "—";

  function buildMessage(){
    return `Oi ${job.marca}!

Tudo bem? Espero que sim!

Vi que o período de uso em tráfego pago do conteúdo "${nomeConteudo}" está chegando ao fim em ${dataFimFmt}.

O conteúdo teve bons resultados? Gostaria de renovar a licença de uso para continuar utilizando nos anúncios?

Valores para renovação:
• 3 meses: ${fmtMoneyCur(precos["3m"]||0, job.moeda)}
• 6 meses: ${fmtMoneyCur(precos["6m"]||0, job.moeda)}
• 12 meses: ${fmtMoneyCur(precos["12m"]||0, job.moeda)} (10% de desconto!)

Me avisa se tiver interesse!

Beijos`;
  }
  const [mensagem,setMensagem] = useState(buildMessage());
  const [copyState,setCopyState] = useState("idle");
  async function handleCopy(){
    const ok = await copyToClipboard(mensagem);
    setCopyState(ok ? "ok" : "fail");
    setTimeout(()=>setCopyState("idle"), 2500);
  }

  return (
    <Modal title="Proposta de Renovação" onClose={onClose}>
      <div style={{background:"var(--sand)", borderRadius:12, padding:"12px 14px", fontSize:15, marginBottom:16, lineHeight:1.7}}>
        <div><strong>Job:</strong> {nomeConteudo}</div>
        <div><strong>Período anterior:</strong> {periodoAnteriorLabel}</div>
        <div><strong>Valor anterior:</strong> {fmtMoneyCur(job.trafegoPago.valorAdicional, job.moeda)}</div>
      </div>
      <div style={{fontSize:13.5, fontWeight:600, color:"var(--graphite-soft)", marginBottom:8}}>Nova proposta</div>
      {[["3m","3 meses"],["6m","6 meses"],["12m","12 meses"]].map(([key,label])=>(
        <label key={key} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 14px", border:"1.5px solid "+(periodo===key?"var(--butter)":"var(--line)"), background: periodo===key?"var(--butter-soft)":"#fff", borderRadius:10, marginBottom:8, cursor:"pointer"}} onClick={()=>setPeriodo(key)}>
          <span style={{display:"flex", alignItems:"center", gap:8, fontSize:15}}>
            <input type="radio" checked={periodo===key} onChange={()=>setPeriodo(key)}/>{label} — {fmtMoneyCur(precos[key]||0, job.moeda)}
          </span>
          {key==="12m" && <Badge tone="yellow">10% off</Badge>}
        </label>
      ))}
      <Field label="Mensagem (editável)"><textarea rows="10" value={mensagem} onChange={e=>setMensagem(e.target.value)} style={{fontFamily:"Poppins", fontSize:14.5}}/></Field>
      {copyState==="fail" && <p style={{fontSize:13, color:"var(--wine)", marginTop:-8}}>Não copiou automaticamente — selecione o texto acima e copie manualmente.</p>}
      <div style={{display:"flex", gap:10, justifyContent:"flex-end"}}>
        <button className="btn btn-ghost" onClick={handleCopy}><Icon name={copyState==="ok"?"check":"content_copy"} size={15}/>{copyState==="ok"?"Copiado!":"Copiar mensagem"}</button>
        <button className="btn btn-primary" onClick={()=>onRegister(periodo, precos[periodo])}><Icon name="autorenew" size={16}/>Registrar renovação</button>
      </div>
    </Modal>
  );
}

function FollowUps({state, updateState}){
  const [tab,setTab] = useState("Pendentes");
  const [messageFor,setMessageFor] = useState(null);
  const hoje = new Date();

  function buildMessage(f){
    return `Oi ${f.marca}! Tudo bem?

Passando pra saber se rolou de usar o conteúdo que entreguei${f.tipo?" ("+f.tipo+")":""}. Adoraria saber o que vocês acharam do resultado!

Se tiver algum feedback ou quiser fechar mais alguma coisa, me chama 💛`;
  }

  function marcarFeito(id){
    updateState({...state, followups: state.followups.map(f=>f.id===id?{...f, status:"Feito", concluidoEm:todayISO()}:f)});
  }
  function reabrir(id){
    updateState({...state, followups: state.followups.map(f=>f.id===id?{...f, status:"Pendente", concluidoEm:""}:f)});
  }

  const pendentes = state.followups.filter(f=>f.status==="Pendente").sort((a,b)=>new Date(a.dataEntrega)-new Date(b.dataEntrega));
  const feitos = state.followups.filter(f=>f.status==="Feito").sort((a,b)=>new Date(b.concluidoEm||b.criadoEm)-new Date(a.concluidoEm||a.criadoEm));
  const shown = tab==="Pendentes" ? pendentes : feitos;

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title" style={{display:"flex", alignItems:"center", gap:10}}><Icon name="call" size={30}/>Follow-ups</h1>
          <p className="page-sub">Mantenha o relacionamento com as marcas após cada entrega.</p>
        </div>
      </div>

      <div className="tabs" style={{marginBottom:18}}>
        <div className={"tab "+(tab==="Pendentes"?"active":"")} onClick={()=>setTab("Pendentes")}>Pendentes ({pendentes.length})</div>
        <div className={"tab "+(tab==="Feitos"?"active":"")} onClick={()=>setTab("Feitos")}>Feitos ({feitos.length})</div>
      </div>

      {shown.length===0 ? (
        <div className="empty">
          <Icon name="call"/>
          <div className="empty-title">{tab==="Pendentes" ? "Nenhum follow-up pendente" : "Nenhum follow-up concluído ainda"}</div>
          <div className="empty-sub">{tab==="Pendentes" ? "Eles são criados automaticamente quando você marca um job como entregue." : "Follow-ups marcados como feitos aparecem aqui."}</div>
        </div>
      ) : shown.map(f=>{
        const dias = Math.round((hoje - new Date(f.dataEntrega+"T00:00:00"))/(1000*60*60*24));
        return (
          <div className="row-item" key={f.id} style={{flexDirection:"column", alignItems:"stretch", gap:8}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:10}}>
              <div>
                <strong style={{fontSize:16}}>{f.marca}</strong>
                <div style={{fontSize:13.5, color:"var(--graphite-soft)", marginTop:2}}>
                  {f.tipo && f.tipo+" · "}Entregue em {new Date(f.dataEntrega+"T00:00:00").toLocaleDateString('pt-BR')}
                  {tab==="Pendentes" && dias>=0 && ` · há ${dias} dia(s)`}
                </div>
              </div>
              <Badge tone={tab==="Pendentes" ? (dias>7?"wine":"yellow") : "green"}>{tab==="Pendentes" ? (dias>7?"Atenção":"Pendente"):"Feito"}</Badge>
            </div>
            {tab==="Pendentes" && (
              <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                <button className="btn btn-ghost btn-sm" onClick={()=>setMessageFor(f)}><Icon name="content_copy" size={14}/>Copiar mensagem</button>
                <button className="btn btn-primary btn-sm" onClick={()=>marcarFeito(f.id)}><Icon name="check_circle" size={14}/>Marcar como feito</button>
              </div>
            )}
            {tab==="Feitos" && (
              <div>
                <button className="btn btn-ghost btn-sm" onClick={()=>reabrir(f.id)}><Icon name="restart_alt" size={14}/>Reabrir</button>
              </div>
            )}
          </div>
        );
      })}
      {messageFor && <MessageModal title={`Mensagem para ${messageFor.marca}`} text={buildMessage(messageFor)} onClose={()=>setMessageFor(null)}/>}
    </div>
  );
}

function TrafegoPago({state, updateState}){
  const hoje = new Date();
  const [filtro,setFiltro] = useState("Todos");
  const [renewalJob,setRenewalJob] = useState(null);
  const [viewingJob,setViewingJob] = useState(null);
  const [confirmPerdidoJob,setConfirmPerdidoJob] = useState(null);

  function statusOf(j){
    if(j.trafegoPago.perdido) return "Perdidos";
    const fim = new Date(j.trafegoPago.dataFim+"T00:00:00");
    const diff = (fim-hoje)/(1000*60*60*24);
    if(diff<0) return "Vencidos";
    if(diff<=30) return "Vencendo";
    return "Ativos";
  }

  const comTrafego = state.jobs.filter(j=>j.trafegoPago && j.trafegoPago.ativo && j.trafegoPago.dataFim);
  const grupos = {Ativos:[], Vencendo:[], Vencidos:[], Perdidos:[]};
  comTrafego.forEach(j=>grupos[statusOf(j)].push(j));
  const semPerdidos = [...grupos.Ativos, ...grupos.Vencendo, ...grupos.Vencidos];
  const shown = filtro==="Todos" ? semPerdidos : grupos[filtro];

  function marcarPerdido(job){
    setConfirmPerdidoJob(job);
  }
  function confirmarPerdido(){
    const job = confirmPerdidoJob;
    setConfirmPerdidoJob(null);
    updateState({...state, jobs: state.jobs.map(j=>j.id===job.id?{...j, trafegoPago:{...j.trafegoPago, perdido:true, perdidoEm:todayISO()}}:j)});
  }
  function reativar(job){
    updateState({...state, jobs: state.jobs.map(j=>j.id===job.id?{...j, trafegoPago:{...j.trafegoPago, perdido:false, perdidoEm:""}}:j)});
  }
  function registrarRenovacao(job, periodoKey, preco){
    const novaDataInicio = todayISO();
    const novaDataFim = calcDataFim(novaDataInicio, periodoKey);
    updateState({...state, jobs: state.jobs.map(j=>j.id===job.id?{...j, trafegoPago:{...j.trafegoPago, periodo:periodoKey, dataInicio:novaDataInicio, dataFim:novaDataFim, valorAdicional:preco, perdido:false, perdidoEm:""}}:j)});
    setRenewalJob(null);
  }
  function persistJobTraf(job){
    const followups = syncFollowups(state.followups, job);
    const transacoes = syncTransacaoFromJob(state.transacoes, job);
    updateState({...state, jobs: state.jobs.map(j=>j.id===job.id?job:j), followups, transacoes});
  }
  function saveJob(job){
    persistJobTraf(job);
    setViewingJob(null);
  }

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">Tráfego Pago</h1>
          <p className="page-sub">Gerencie direitos de uso em ads e oportunidades de renovação</p>
        </div>
      </div>
      <div className="grid grid-3" style={{marginBottom:16}}>
        <StatCard label="Ativos" value={grupos.Ativos.length} icon="check_circle"/>
        <StatCard label="Vencendo (30d)" value={grupos.Vencendo.length} icon="hourglass_top"/>
        <StatCard label="Vencidos" value={grupos.Vencidos.length} icon="error"/>
      </div>
      <div className="tabs" style={{marginBottom:16, flexWrap:"wrap"}}>
        {["Todos","Ativos","Vencendo","Vencidos","Perdidos"].map(t=>
          <div key={t} className={"tab "+(filtro===t?"active":"")} onClick={()=>setFiltro(t)}>
            {t==="Perdidos" ? "Não renovados" : t} ({t==="Todos" ? semPerdidos.length : grupos[t].length})
          </div>
        )}
      </div>

      {filtro==="Vencidos" && grupos.Vencidos.length>0 && (
        <div style={{marginBottom:18}}>
          <div style={{display:"flex", alignItems:"center", gap:6, fontWeight:600, fontSize:14, color:"var(--wine)", marginBottom:10}}>
            <Icon name="attach_money" size={18}/>Vencidos — Oportunidades de renovação
          </div>
        </div>
      )}

      {shown.length===0 ? (
        <EmptyState icon={filtro==="Perdidos" ? "archive" : "campaign"} title={filtro==="Perdidos" ? "Nenhum tráfego não renovado" : "Nenhum registro"} sub={filtro==="Perdidos" ? "Clientes que optarem por não renovar aparecem aqui." : "Adicione direitos de tráfego pago ao criar/editar um job."} />
      ) : shown.map(j=>{
        const st = statusOf(j);
        return (
          <div className="row-item" key={j.id} style={{flexDirection:"column", alignItems:"stretch", gap:8}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap"}}>
              <div style={{flex:1, minWidth:180}}>
                <strong>{j.marca} — {j.tipo || "conteúdo"}</strong>
                <div style={{fontSize:13.5, color:"var(--graphite-soft)", marginTop:2}}>
                  Período: {TRAFEGO_PERIODOS.find(p=>p.key===j.trafegoPago.periodo)?.label} ({j.trafegoPago.dataInicio ? new Date(j.trafegoPago.dataInicio+"T00:00:00").toLocaleDateString('pt-BR') : "?"} — {j.trafegoPago.dataFim ? new Date(j.trafegoPago.dataFim+"T00:00:00").toLocaleDateString('pt-BR') : "?"})
                </div>
                {st==="Vencidos" && <div style={{fontSize:13.5, color:"var(--wine)", marginTop:2}}>Vencido há {Math.round((hoje - new Date(j.trafegoPago.dataFim+"T00:00:00"))/(1000*60*60*24))} dia(s)</div>}
                {j.trafegoPago.perdido && j.trafegoPago.perdidoEm && <div style={{fontSize:13.5, color:"var(--graphite-soft)", marginTop:2}}>Marcado como não renovado em {new Date(j.trafegoPago.perdidoEm+"T00:00:00").toLocaleDateString('pt-BR')}</div>}
                <div style={{fontSize:14.5, marginTop:4}}><strong>{fmtMoneyCur(j.trafegoPago.valorAdicional, j.moeda)}</strong> · {(j.trafegoPago.plataformas||[]).join(", ") || "sem plataformas"}</div>
              </div>
              <Badge tone={st==="Vencidos"?"wine":st==="Vencendo"?"yellow":st==="Perdidos"?"gray":"green"}>{st==="Perdidos"?"Não renovado":st}</Badge>
            </div>
            <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
              {(st==="Vencendo" || st==="Vencidos") && !j.trafegoPago.perdido && (
                <button className="btn btn-primary btn-sm" onClick={()=>setRenewalJob(j)}><Icon name="mail" size={14}/>Oferecer renovação</button>
              )}
              <button className="btn btn-ghost btn-sm" onClick={()=>setViewingJob(j)}>Ver job</button>
              {j.trafegoPago.perdido ? (
                <button className="btn btn-ghost btn-sm" onClick={()=>reativar(j)}><Icon name="restart_alt" size={14}/>Reativar</button>
              ) : (
                <button className="btn btn-ghost btn-sm" onClick={()=>marcarPerdido(j)}><Icon name="close" size={14}/>Não renovou</button>
              )}
            </div>
          </div>
        );
      })}

      {comTrafego.length>0 && (
        <div style={{display:"flex", gap:8, alignItems:"flex-start", fontSize:13.5, color:"var(--graphite-soft)", marginTop:16}}>
          <Icon name="notifications" size={16}/>
          <span>Você receberá alertas 30 dias, 7 dias antes do vencimento e após o vencimento (oportunidade de renovação).</span>
        </div>
      )}

      {renewalJob && <RenewalModal job={renewalJob} onClose={()=>setRenewalJob(null)} onRegister={(periodo,preco)=>registrarRenovacao(renewalJob, periodo, preco)}/>}
      {viewingJob && <JobModal state={state} updateState={updateState} initial={viewingJob} onClose={()=>setViewingJob(null)} onSave={saveJob} onAutosave={persistJobTraf}/>}
      {confirmPerdidoJob && (
        <Modal title="Marcar como não renovado" onClose={()=>setConfirmPerdidoJob(null)}>
          <p style={{fontSize:14.5, marginTop:-4}}>Marcar "{confirmPerdidoJob.marca}" como cancelado/perdido? O cliente não renovou o tráfego pago.</p>
          <div style={{display:"flex", gap:10, justifyContent:"flex-end", marginTop:10}}>
            <button className="btn btn-ghost" onClick={()=>setConfirmPerdidoJob(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={confirmarPerdido}><Icon name="close" size={15}/>Marcar como não renovado</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Financeiro({state, updateState, go, pessoal}){
  const [modal,setModal] = useState(false);
  const [editing,setEditing] = useState(null);
  const now = new Date();
  const [month,setMonth] = useState(now.getMonth());
  const [year,setYear] = useState(now.getFullYear());
  const [filter,setFilter] = useState("Todos");
  const [pageTab,setPageTab] = useState("Transações");
  const [periodMode,setPeriodMode] = useState("mes");
  const [periodStart,setPeriodStart] = useState(todayISO());
  const [periodEnd,setPeriodEnd] = useState(todayISO());

  function save(t){
    const exists = state.transacoes.some(x=>x.id===t.id);
    const list = exists ? state.transacoes.map(x=>x.id===t.id?t:x) : [...state.transacoes, t];
    updateState({...state, transacoes:list});
    setModal(false); setEditing(null);
  }
  function remove(id){ updateState({...state, transacoes: state.transacoes.filter(t=>t.id!==id)}); }
  function toggleStatus(id){
    updateState({...state, transacoes: state.transacoes.map(t=>t.id===id?{...t, status: t.status==="Confirmado"?"Pendente":"Confirmado"}:t)});
  }
  function gerarRecorrentes(){
    const processed = processRecurringJobs(state);
    updateState(processed);
  }

  const inRange = (t) => {
    if(periodMode==="periodo") return t.data >= periodStart && t.data <= periodEnd;
    const d = new Date(t.data+"T00:00:00");
    return d.getMonth()===month && d.getFullYear()===year;
  };
  const monthTx = state.transacoes.filter(inRange);
  const previsto = monthTx.filter(t=>t.tipo==="receita").reduce((a,b)=>a+Number(b.valor||0),0);
  const recebido = monthTx.filter(t=>t.tipo==="receita" && t.status==="Confirmado").reduce((a,b)=>a+Number(b.valor||0),0);
  const pendente = monthTx.filter(t=>t.tipo==="receita" && t.status==="Pendente").reduce((a,b)=>a+Number(b.valor||0),0);
  const despesas = monthTx.filter(t=>t.tipo==="despesa").reduce((a,b)=>a+Number(b.valor||0),0);
  const lucro = recebido - despesas;

  let shown = monthTx;
  if(filter==="A receber") shown = monthTx.filter(t=>t.tipo==="receita" && t.status==="Pendente");
  if(filter==="Confirmadas") shown = monthTx.filter(t=>t.status==="Confirmado");

  const confirmadas = shown.filter(t=>t.status==="Confirmado");
  const pendentesList = shown.filter(t=>t.status==="Pendente");

  function TxRow(t){
    return (
      <div className="row-item" key={t.id}>
        <div style={{flex:1}}>

              <Icon name="work" size={12}/>Job <Icon name="open_in_new" size={11}/>

          <div><strong>{t.descricao}</strong></div>
          <div style={{fontSize:13.5, color:"var(--graphite-soft)"}}>{new Date(t.data+"T00:00:00").toLocaleDateString('pt-BR')}</div>
        </div>
        <Badge tone={t.status==="Confirmado" ? "green" : "yellow"}>{t.status==="Confirmado" ? "Recebido" : "Pendente"}</Badge>
        <div style={{fontWeight:700, color: t.tipo==="despesa" ? "var(--wine)" : "var(--moss)", minWidth:100, textAlign:"right"}}>{t.tipo==="despesa" ? "- " : "+ "}{fmtMoneyCur(t.valor, t.moeda)}</div>
        <div style={{display:"flex", gap:6}}>
          <button className="icon-btn" title={t.status==="Confirmado" ? "Marcar como pendente" : "Marcar como recebido"} onClick={()=>toggleStatus(t.id)}>
            <Icon name="check_circle" size={18} style={{color: t.status==="Confirmado" ? "var(--moss)" : "var(--line)"}}/>

    );

        {(pessoal ? ["Transações","Histórico Financeiro","Previsão","Evolução"] : ["Transações","Histórico Financeiro","Previsão","Evolução","Performance","Contabilidade"]).map(t=>
          <div key={t} className={"tab "+(pageTab===t?"active":"")} onClick={()=>setPageTab(t)}>{t}</div>
        )}

      {pageTab==="Transações" && (
        <div>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10}}>
            <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"center"}}>
              <div className="tabs">
                <div className={"tab "+(periodMode==="mes"?"active":"")} onClick={()=>setPeriodMode("mes")}>Por mês</div>
                <div className={"tab "+(periodMode==="periodo"?"active":"")} onClick={()=>setPeriodMode("periodo")}>Período</div>
              </div>
              {periodMode==="mes" ? (
                <>
                  <select value={month} onChange={e=>setMonth(Number(e.target.value))} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}>
                    {monthNames.map((m,i)=><option value={i} key={m}>{m}</option>)}
                  </select>
                  <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}>
                    {[year-1,year,year+1].map(y=><option key={y} value={y}>{y}</option>)}
                  </select>
                </>
              ) : (
                <>
                  <input type="date" value={periodStart} onChange={e=>setPeriodStart(e.target.value)} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}/>
                  <span style={{color:"var(--graphite-soft)"}}>até</span>
                  <input type="date" value={periodEnd} onChange={e=>setPeriodEnd(e.target.value)} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}/>
                </>
              )}
            </div>
            {!pessoal && <button className="btn btn-ghost" onClick={gerarRecorrentes}><Icon name="autorenew" size={16}/>Gerar recorrentes</button>}
          </div>

          <div className="grid" style={{gridTemplateColumns:"repeat(5,1fr)", gap:16, marginBottom:18}}>
            {[
              ["Previsto", previsto, "trending_up", "#E7E1F3", "#6B4E8A"],
              ["Recebido", recebido, "check_circle", "#DCEBDD", "#2F6B3E"],
              ["Pendente", pendente, "hourglass_top", "#F6E3C6", "#8A5A20"],
              ["Despesas", despesas, "trending_down", "#f6e0dc", "#b8473a"],
              ["Lucro Líquido", lucro, "account_balance_wallet", "#DCEBDD", "#2F6B3E"]
            ].map(([label,val,icon,bg,fg])=>(
              <div key={label} className="card" style={{padding:16}}>
                <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10}}>
                  <span style={{width:30,height:30, borderRadius:9, background:bg, color:fg, display:"flex", alignItems:"center", justifyContent:"center"}}><Icon name={icon} size={16}/></span>
                  <span style={{fontSize:13, color:"var(--graphite-soft)"}}>{label}</span>
                </div>
                <div style={{fontFamily:"Poppins", fontSize:22, fontWeight:700, color: label==="Recebido"||label==="Lucro Líquido" ? "#2F6B3E" : "var(--graphite)"}}>{fmtMoney(val)}</div>
              </div>
            ))}
          </div>

          <div className="card">
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
              <h3 style={{margin:0}}>Transações</h3>
              <div className="tabs">
                {["Todos","A receber","Confirmadas"].map(t=><div key={t} className={"tab "+(filter===t?"active":"")} onClick={()=>setFilter(t)}>{t}</div>)}
              </div>
            </div>
            {shown.length===0 ? (
              <p style={{color:"var(--graphite-soft)", fontSize:14, textAlign:"center", padding:"20px 0"}}>Nenhum registro neste período.</p>
            ) : (
              <div>
                {confirmadas.length>0 && (
                  <div style={{marginBottom: pendentesList.length>0 ? 18 : 0}}>
                    <div style={{display:"flex", alignItems:"center", gap:6, fontSize:12.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".04em", color:"var(--moss)", marginBottom:8}}>
                      <Icon name="check_circle" size={15}/>Confirmadas ({confirmadas.length})
                    </div>
                    {confirmadas.map(TxRow)}
                  </div>
                )}
                {pendentesList.length>0 && (
                  <div>
                    <div style={{display:"flex", alignItems:"center", gap:6, fontSize:12.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".04em", color:"var(--butter)", marginBottom:8}}>
                      <Icon name="hourglass_top" size={15}/>Pendentes ({pendentesList.length})
                    </div>
                    {pendentesList.map(TxRow)}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      {pageTab==="Histórico Financeiro" && (()=>{
        const totalReceita = state.transacoes.filter(t=>t.tipo==="receita" && t.status==="Confirmado").reduce((a,b)=>a+Number(b.valor||0),0);
        const totalPendente = state.transacoes.filter(t=>t.tipo==="receita" && t.status==="Pendente").reduce((a,b)=>a+Number(b.valor||0),0);
        const totalDespesas = state.transacoes.filter(t=>t.tipo==="despesa").reduce((a,b)=>a+Number(b.valor||0),0);
        const lucroTotal = totalReceita - totalDespesas;

        const hoje = new Date();
        const meses12 = [];
        for(let i=11;i>=0;i--){
          const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
          meses12.push({label: monthNames[d.getMonth()].slice(0,3)+"/"+String(d.getFullYear()).slice(2), full: monthNames[d.getMonth()]+" "+d.getFullYear(), y:d.getFullYear(), m:d.getMonth()});
        }
        const porMes = meses12.map(mo=>{
          const txMes = state.transacoes.filter(t=>{ const d=new Date(t.data+"T00:00:00"); return d.getMonth()===mo.m && d.getFullYear()===mo.y; });
          const recebido = txMes.filter(t=>t.tipo==="receita" && t.status==="Confirmado").reduce((a,b)=>a+Number(b.valor||0),0);
          const pendente = txMes.filter(t=>t.tipo==="receita" && t.status==="Pendente").reduce((a,b)=>a+Number(b.valor||0),0);
          const desp = txMes.filter(t=>t.tipo==="despesa").reduce((a,b)=>a+Number(b.valor||0),0);
          return {...mo, recebido, pendente, desp, liquido: recebido-desp};
        });
        const maxVal = Math.max(1, ...porMes.map(m=>Math.max(m.recebido,m.pendente,m.desp)));
        const mesesComDados = porMes.filter(m=>m.recebido>0||m.pendente>0||m.desp>0);

        return (
          <div>
            <div className="grid" style={{gridTemplateColumns:"repeat(4,1fr)", gap:16, marginBottom:18}}>
              {[
                ["Total Receita", totalReceita, "var(--moss)"],
                ["Pendente", totalPendente, "var(--butter)"],
                ["Total Despesas", totalDespesas, "var(--wine)"],
                ["Lucro Líquido", lucroTotal, "var(--moss)"]
              ].map(([label,val,color])=>(
                <div key={label} className="card" style={{padding:16}}>
                  <div style={{fontSize:13, color:"var(--graphite-soft)", marginBottom:6}}>{label}</div>
                  <div style={{fontFamily:"Poppins", fontSize:22, fontWeight:700, color}}>{fmtMoney(val)}</div>
                </div>
              ))}
            </div>

            <div className="card" style={{marginBottom:18}}>
              <h3 style={{marginTop:0, display:"flex", alignItems:"center", gap:8}}><Icon name="bar_chart"/>Histórico Financeiro</h3>
              {mesesComDados.length===0 ? (
                <p style={{color:"var(--graphite-soft)", fontSize:14, textAlign:"center", padding:"30px 0"}}>Nenhum registro nos últimos 12 meses.</p>
              ) : (
                <div>
                  <div style={{display:"flex", alignItems:"flex-end", gap:8, height:180, padding:"10px 0"}}>
                    {porMes.map(mo=>(
                      <div key={mo.label} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2}}>
                        <div style={{display:"flex", alignItems:"flex-end", gap:2, height:150}}>
                          <div title={"Recebido: "+fmtMoney(mo.recebido)} style={{width:6, height:Math.max(2,(mo.recebido/maxVal)*150), background:"var(--moss)", borderRadius:2}}></div>
                          <div title={"Pendente: "+fmtMoney(mo.pendente)} style={{width:6, height:Math.max(2,(mo.pendente/maxVal)*150), background:"var(--butter)", borderRadius:2}}></div>
                          <div title={"Despesas: "+fmtMoney(mo.desp)} style={{width:6, height:Math.max(2,(mo.desp/maxVal)*150), background:"var(--wine)", borderRadius:2}}></div>
                        </div>
                        <div style={{fontSize:10, color:"var(--graphite-soft)"}}>{mo.label}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{display:"flex", gap:16, justifyContent:"center", fontSize:12.5, marginTop:10}}>
                    <span style={{display:"flex", alignItems:"center", gap:5}}><span style={{width:8,height:8,borderRadius:"50%", background:"var(--moss)", display:"inline-block"}}></span>Recebido</span>
                    <span style={{display:"flex", alignItems:"center", gap:5}}><span style={{width:8,height:8,borderRadius:"50%", background:"var(--butter)", display:"inline-block"}}></span>Pendente</span>
                    <span style={{display:"flex", alignItems:"center", gap:5}}><span style={{width:8,height:8,borderRadius:"50%", background:"var(--wine)", display:"inline-block"}}></span>Despesas</span>
                  </div>
                </div>
              )}
            </div>

            <div className="card">
              <h3 style={{marginTop:0, display:"flex", alignItems:"center", gap:8}}><Icon name="trending_up"/>Mês</h3>
              {mesesComDados.length===0 ? (
                <p style={{color:"var(--graphite-soft)", fontSize:14, textAlign:"center", padding:"10px 0"}}>Nenhum registro ainda.</p>
              ) : (
                <div>
                  <div style={{display:"flex", padding:"8px 4px", borderBottom:"1px solid var(--line)", fontSize:12.5, fontWeight:700, color:"var(--graphite-soft)", textTransform:"uppercase"}}>
                    <div style={{flex:1}}>Mês</div><div style={{width:110, textAlign:"right"}}>Recebido</div><div style={{width:110, textAlign:"right"}}>Pendente</div><div style={{width:110, textAlign:"right"}}>Despesas</div><div style={{width:110, textAlign:"right"}}>Líquido</div>
                  </div>
                  {[...mesesComDados].reverse().map(mo=>(
                    <div key={mo.label} style={{display:"flex", padding:"10px 4px", borderBottom:"1px solid var(--line)", fontSize:14}}>
                      <div style={{flex:1}}>{mo.full}</div>
                      <div style={{width:110, textAlign:"right", color:"var(--moss)"}}>{fmtMoney(mo.recebido)}</div>
                      <div style={{width:110, textAlign:"right", color:"var(--butter)"}}>{fmtMoney(mo.pendente)}</div>
                      <div style={{width:110, textAlign:"right", color:"var(--wine)"}}>{fmtMoney(mo.desp)}</div>
                      <div style={{width:110, textAlign:"right", fontWeight:700}}>{fmtMoney(mo.liquido)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {pageTab==="Previsão" && (()=>{
        const jobsRecorrentes = state.jobs.filter(j=>j.recorrente && j.recorrencia && j.tipoJob!=="Permuta" && Number(j.valor)>0);
        if(jobsRecorrentes.length===0){
          return (
            <div className="empty">
              <Icon name="autorenew"/>
              <div className="empty-title">Você ainda não tem despesas ou receitas recorrentes cadastradas.</div>
              <div className="empty-sub">Marque uma despesa ou job como recorrente para ver a previsão dos próximos meses aqui.</div>
            </div>
          );
        }
        const hoje = new Date();
        const meses = [];
        for(let i=0;i<6;i++){
          const d = new Date(hoje.getFullYear(), hoje.getMonth()+i, 1);
          meses.push({label: monthNames[d.getMonth()]+" "+d.getFullYear(), y:d.getFullYear(), m:d.getMonth()});
        }
        return (
          <div className="card">
            <h3 style={{marginTop:0}}>Previsão dos próximos meses</h3>
            <p style={{fontSize:14, color:"var(--graphite-soft)", marginTop:-6, marginBottom:16}}>Baseado nos jobs marcados como recorrentes.</p>
            <div className="grid grid-3">
              {meses.map(mo=>{
                const inicioMes = new Date(mo.y, mo.m, 1);
                const fimMes = new Date(mo.y, mo.m+1, 0);
                let total = 0;
                jobsRecorrentes.forEach(j=>{
                  let proxima = j.recorrencia.proximaCriacao ? new Date(j.recorrencia.proximaCriacao+"T00:00:00") : null;
                  const intervalo = Number(j.recorrencia.intervaloDias||30);
                  if(!proxima || !intervalo) return;
                  let guard = 0;
                  while(proxima <= fimMes && guard<60){
                    if(proxima >= inicioMes && proxima <= fimMes) total += Number(j.valor||0);
                    proxima = new Date(proxima); proxima.setDate(proxima.getDate()+intervalo);
                    guard++;
                  }
                });
                return (
                  <div key={mo.label} style={{background:"var(--warm-white)", border:"1px solid var(--line)", borderRadius:12, padding:16}}>
                    <div style={{fontSize:13, color:"var(--graphite-soft)", marginBottom:6}}>{mo.label}</div>
                    <div style={{fontFamily:"Poppins", fontSize:22, fontWeight:700}}>{fmtMoney(total)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {pageTab==="Evolução" && (()=>{
        const hoje = new Date();
        const meses = [];
        for(let i=5;i>=0;i--){
          const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
          meses.push({label: monthNames[d.getMonth()].slice(0,3), y:d.getFullYear(), m:d.getMonth()});
        }
        const data = meses.map(mo=>({
          label: mo.label,
          value: state.transacoes.filter(t=>{
            const d = new Date(t.data+"T00:00:00");
            return t.tipo==="receita" && t.status==="Confirmado" && d.getMonth()===mo.m && d.getFullYear()===mo.y;
          }).reduce((a,b)=>a+Number(b.valor||0),0)
        }));
        const mesesComReceita = data.filter(d=>d.value>0).length;
        if(mesesComReceita<2){
          return (
            <div className="empty">
              <Icon name="show_chart"/>
              <div className="empty-title">Ainda não há dados suficientes</div>
              <div className="empty-sub">Precisamos de pelo menos 2 meses com receita registrada pra mostrar sua evolução aqui.</div>
            </div>
          );
        }
        return (
          <div className="card">
            <h3 style={{marginTop:0}}>Evolução da receita (últimos 6 meses)</h3>
            <LineChart data={data} width={600} height={240}/>
          </div>
        );
      })()}

      {pageTab==="Performance" && !pessoal && <Performance state={state} updateState={updateState} embutido/>}
      {pageTab==="Contabilidade" && (()=>{
        const anoAtual = now.getFullYear();
        const faturamentoAno = state.transacoes.filter(t=>{
          const d = new Date(t.data+"T00:00:00");
          return t.tipo==="receita" && t.status==="Confirmado" && d.getFullYear()===anoAtual;
        }).reduce((a,b)=>a+Number(b.valor||0),0);
        const tetoMEI = 81000;
        const pct = Math.min(100, (faturamentoAno/tetoMEI)*100);
        const mesAtualIdx = now.getMonth();
        const projecaoAnual = mesAtualIdx>=0 ? (faturamentoAno/(mesAtualIdx+1))*12 : faturamentoAno;

        const dasPag = state.dasPagamentos || {};
        function dasKey(y,m){ return `${y}-${String(m+1).padStart(2,"0")}`; }
        let proximoDAS = null;
        for(let i=0;i<24;i++){
          const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
          const venc = new Date(d.getFullYear(), d.getMonth(), 20);
          if(dasPag[dasKey(d.getFullYear(),d.getMonth())]?.pago) continue;
          if(venc >= new Date(now.getFullYear(),now.getMonth(),now.getDate())){ proximoDAS = venc; break; }
        }
        const diasParaDAS = proximoDAS ? Math.max(0, Math.round((proximoDAS-now)/(1000*60*60*24))) : null;

        return (
          <div>
            <div className="grid grid-3" style={{marginBottom:18}}>
              <div className="card" style={{display:"flex", alignItems:"center", gap:12}}>
                <span className="stat-icon" style={{background:"var(--sand)", width:38, height:38}}><Icon name="storefront" size={19}/></span>
                <div><div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Status MEI</div><strong style={{fontSize:15, color: (state.contabilidade?.statusMei||"Ativo")==="Ativo" ? "var(--moss)" : "var(--graphite)"}}>{state.contabilidade?.statusMei || "Ativo"}</strong></div>
              </div>
              <div className="card" style={{display:"flex", alignItems:"center", gap:12}}>
                <span className="stat-icon" style={{background:"var(--sand)", width:38, height:38}}><Icon name="payments" size={19}/></span>
                <div><div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Próximo DAS</div><strong style={{fontSize:15}}>{proximoDAS ? `${monthNames[proximoDAS.getMonth()].slice(0,3)} - 20/${String(proximoDAS.getMonth()+1).padStart(2,"0")} (${diasParaDAS} dias)` : "Tudo em dia"}</strong></div>
              </div>
              <div className="card" style={{display:"flex", alignItems:"center", gap:12}}>
                <span className="stat-icon" style={{background:"var(--sand)", width:38, height:38}}><Icon name="description" size={19}/></span>
                <div><div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Documentos</div><strong style={{fontSize:15}}>{(state.documentosFiscais||[]).length} arquivo(s)</strong></div>
              </div>
            </div>

            <div className="grid" style={{gridTemplateColumns:"1.3fr 1fr", gap:16, marginBottom:18}}>
              <div className="card">
                <h3 style={{marginTop:0, display:"flex", alignItems:"center", gap:8}}><Icon name="account_balance"/>Limite MEI {anoAtual}</h3>
                <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:8}}>
                  <span>Faturamento: <strong>{fmtMoney(faturamentoAno)}</strong></span>
                  <span>Limite: <strong>{fmtMoney(tetoMEI)}</strong></span>
                </div>
                <div style={{height:10, background:"var(--sand)", borderRadius:999, marginBottom:8}}>
                  <div style={{height:10, width:Math.min(100,pct)+"%", background: pct>90 ? "var(--wine)" : "var(--butter)", borderRadius:999, transition:"width .3s"}}></div>
                </div>
                <div style={{display:"flex", justifyContent:"space-between", fontSize:13, color:"var(--graphite-soft)", marginBottom:10}}>
                  <span>{pct.toFixed(1)}% utilizado</span>
                  <span>Falta: {fmtMoney(Math.max(0,tetoMEI-faturamentoAno))}</span>
                </div>
                <div style={{fontSize:13, color:"var(--graphite-soft)"}}>Projeção anual: <strong style={{color:"var(--graphite)"}}>{fmtMoney(projecaoAnual)}</strong></div>
                {pct>=90 && (
                  <div style={{display:"flex", gap:8, alignItems:"flex-start", background:"var(--sand)", borderRadius:10, padding:"10px 12px", fontSize:13, marginTop:12}}>
                    <Icon name="warning" size={16} style={{color:"var(--wine)"}}/>
                    <span>Você está perto do teto anual do MEI. Considere planejar o excedente ou buscar orientação contábil.</span>
                  </div>
                )}
              </div>
              <FiscalRemindersCard state={state} updateState={updateState}/>
            </div>

            <FiscalDocumentsCard state={state} updateState={updateState}/>
          </div>
        );
      })()}

      {modal && <TransModal onClose={()=>setModal(false)} onSave={save}/>}
      {editing && <TransModal initial={editing} onClose={()=>setEditing(null)} onSave={save}/>}
    </div>
  );
}

function LembreteModal({onClose, onSave}){
  const [f,setF] = useState({titulo:"", data:"", descricao:""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return (
    <Modal title="Novo Lembrete" onClose={onClose}>
      <Field label="Título"><input value={f.titulo} onChange={e=>set("titulo",e.target.value)} placeholder="Ex: Entregar DASN"/></Field>
      <Field label="Data"><input type="date" value={f.data} onChange={e=>set("data",e.target.value)}/></Field>
      <Field label="Descrição"><textarea rows="4" value={f.descricao} onChange={e=>set("descricao",e.target.value)}/></Field>
      <button className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={()=>{
        if(!f.titulo.trim()){ alert("Dê um título ao lembrete."); return; }
        onSave({...f, id:uid(), feito:false});
      }}>Salvar</button>
    </Modal>
  );
}

function FiscalRemindersCard({state, updateState}){
  const [modal,setModal] = useState(false);
  const lembretes = state.lembretesFiscais || [];
  function add(l){ updateState({...state, lembretesFiscais:[...lembretes, l]}); setModal(false); }
  function remove(id){ updateState({...state, lembretesFiscais: lembretes.filter(l=>l.id!==id)}); }
  function toggle(id){ updateState({...state, lembretesFiscais: lembretes.map(l=>l.id===id?{...l,feito:!l.feito}:l)}); }
  return (
    <div className="card">
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
        <h3 style={{margin:0, display:"flex", alignItems:"center", gap:8}}><Icon name="notifications"/>Lembretes Fiscais</h3>
        <button className="btn btn-ghost btn-sm" onClick={()=>setModal(true)}><Icon name="add" size={14}/>Novo</button>
      </div>
      {lembretes.length===0 ? (
        <p style={{color:"var(--graphite-soft)", fontSize:14, textAlign:"center", padding:"14px 0"}}>Nenhum lembrete pendente</p>
      ) : lembretes.map(l=>(
        <div key={l.id} style={{display:"flex", alignItems:"flex-start", gap:8, padding:"8px 0", borderBottom:"1px solid var(--line)"}}>
          <Icon name="schedule" size={16} style={{color:"var(--butter)", marginTop:2, flexShrink:0}}/>
          <div style={{flex:1, cursor:"pointer"}} onClick={()=>toggle(l.id)}>
            <div style={{fontSize:14, fontWeight:600, textDecoration: l.feito?"line-through":"none", color: l.feito?"var(--graphite-soft)":"var(--graphite)"}}>{l.titulo}</div>
            {l.data && <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>{new Date(l.data+"T00:00:00").toLocaleDateString('pt-BR')}</div>}
          </div>
          <button className="icon-btn" style={{width:28,height:28}} onClick={()=>remove(l.id)}><Icon name="delete" size={14}/></button>
        </div>
      ))}
      {modal && <LembreteModal onClose={()=>setModal(false)} onSave={add}/>}
    </div>
  );
}

const DOC_CATEGORIAS = ["MEI","Impostos","Notas Fiscais","Contratos","Comprovantes","Banco","Outros"];

function DocumentoModal({onClose, onSave}){
  const [f,setF] = useState({nome:"", usarLink:true, arquivoNome:"", link:"", categoria:"Outros", mesRef:monthNames[new Date().getMonth()].slice(0,3), anoRef:new Date().getFullYear(), valor:"", descricao:"", importante:false});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

const DAS_VALOR = 70.60;

function DASGrid({state, updateState}){
  const anoAtual = new Date().getFullYear();
  const dasPag = state.dasPagamentos || {};
  const hoje = new Date();
  function key(m){ return `${anoAtual}-${String(m+1).padStart(2,"0")}`; }
  function valorDe(m){ const v = dasPag[key(m)]?.valor; return (v===undefined||v===null||v==="") ? DAS_VALOR : Number(v); }
  function toggle(m){
    const k = key(m);
    const atual = dasPag[k];
    const valorAtual = valorDe(m);
    updateState({...state, dasPagamentos:{...dasPag, [k]: atual?.pago ? {...atual, pago:false} : {...atual, pago:true, valor:valorAtual, dataPagamento:todayISO()}}});
  }
  function setValor(m, valor){
    const k = key(m);
    const atual = dasPag[k] || {};
    updateState({...state, dasPagamentos:{...dasPag, [k]: {...atual, valor}}});
  }
  const totalPago = Object.keys(dasPag).filter(k=>k.startsWith(String(anoAtual))&&dasPag[k].pago).reduce((a,k)=>a+Number(dasPag[k].valor!==undefined && dasPag[k].valor!==null && dasPag[k].valor!=="" ? dasPag[k].valor : DAS_VALOR), 0);
  let proxVenc = null;
  for(let m=0;m<12;m++){
    const venc = new Date(anoAtual, m, 20);
    if(!dasPag[key(m)]?.pago && venc>=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate())){ proxVenc = venc; break; }
  }

  return (
    <div>
      <div style={{display:"flex", gap:16, marginBottom:18, flexWrap:"wrap"}}>
        <div style={{flex:1, minWidth:200, background:"var(--warm-white)", border:"1px solid var(--line)", borderRadius:12, padding:14}}>
          <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Total Pago em {anoAtual}</div>
          <div style={{fontSize:18, fontWeight:700, color:"var(--moss)"}}>{fmtMoney(totalPago)}</div>
        </div>
        <div style={{flex:1, minWidth:200, background:"var(--warm-white)", border:"1px solid var(--line)", borderRadius:12, padding:14}}>
          <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Próximo Vencimento</div>
          <div style={{fontSize:18, fontWeight:700}}>{proxVenc ? proxVenc.toLocaleDateString('pt-BR') : "Tudo em dia"}</div>
        </div>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
        <strong style={{fontSize:15}}>DAS Mensal {anoAtual}</strong>
        <a href="https://www8.receita.fazenda.gov.br/SimplesNacional/aplicacoes/atspo/pgmei.app/identificacao" target="_blank" className="btn btn-ghost btn-sm"><Icon name="open_in_new" size={14}/>Portal do Empreendedor</a>
      </div>
      <div className="grid grid-3">
        {monthNames.map((m,i)=>{
          const venc = new Date(anoAtual,i,20);
          const pago = dasPag[key(i)]?.pago;
          const vencido = !pago && venc < new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
          const dataPag = dasPag[key(i)]?.dataPagamento;
          return (
            <div key={m} style={{background:"var(--warm-white)", border:"1px solid var(--line)", borderRadius:12, padding:14}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
                <strong style={{fontSize:14}}>{m.slice(0,3)}</strong>
                <Badge tone={pago?"green":vencido?"wine":"yellow"}>{pago?"Pago":vencido?"Vencido":"Pendente"}</Badge>
              </div>
              <div style={{display:"flex", alignItems:"center", gap:4, marginBottom:4}}>
                <span style={{fontSize:14, color:"var(--graphite-soft)"}}>R$</span>
                <input type="number" value={valorDe(i)} onChange={e=>setValor(i, e.target.value)}
                  style={{width:80, fontSize:16, fontWeight:700, border:"none", borderBottom:"1px solid var(--line)", background:"transparent", padding:"2px 4px"}}/>
              </div>
              <div style={{fontSize:12, color:"var(--graphite-soft)", marginBottom: dataPag ? 2 : 10}}>Vence: {String(venc.getDate()).padStart(2,"0")}/{String(venc.getMonth()+1).padStart(2,"0")}</div>
              {dataPag && <div style={{fontSize:12, color:"var(--moss)", marginBottom:10}}>Pago em: {new Date(dataPag+"T00:00:00").toLocaleDateString('pt-BR')}</div>}
              <button className={"btn btn-sm "+(pago?"btn-ghost":"btn-primary")} style={{width:"100%", justifyContent:"center"}} onClick={()=>toggle(i)}>
                {pago ? "Desfazer Pagamento" : "Marcar como Pago"}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LinksTab({state, updateState}){
  const [modal,setModal] = useState(false);
  const links = state.linksFiscais || [];
  function addSugeridos(){
    const novos = LINK_SUGERIDOS.filter(s=>!links.some(l=>l.titulo===s.titulo)).map(s=>({...s, id:uid(), favorito:false, ativo:true}));
    updateState({...state, linksFiscais:[...links, ...novos]});
  }
  function addLink(l){ updateState({...state, linksFiscais:[...links, l]}); setModal(false); }
  function remove(id){ updateState({...state, linksFiscais: links.filter(l=>l.id!==id)}); }
  function toggleFavorito(id){ updateState({...state, linksFiscais: links.map(l=>l.id===id?{...l,favorito:!l.favorito}:l)}); }

  const grupos = {};
  links.forEach(l=>{ (grupos[l.categoria||"Outros"] = grupos[l.categoria||"Outros"]||[]).push(l); });

  return (
    <div>
      <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={addSugeridos}>Adicionar Links Sugeridos</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}><Icon name="add" size={14}/>Novo Link</button>
      </div>
      {links.length===0 ? (
        <EmptyState icon="link" title="Nenhum link salvo" sub='Clique em "Adicionar Links Sugeridos" para começar!'/>

        <div key={cat} style={{marginBottom:18}}>

              <button className="icon-btn" onClick={()=>remove(l.id)}><Icon name="delete" size={17}/></button>
            </div>
          ))}
        </div>
      ))}
      {modal && <LinkModal onClose={()=>setModal(false)} onSave={addLink}/>}
    </div>
  );
}

function DualLineChart({data, width, height}){
  width = width || 600; height = height || 220;
  const padL = 40, padR = 14, padT = 14, padB = 26;
  const w = width - padL - padR, h = height - padT - padB;
  const maxRaw = Math.max(...data.map(d=>Math.max(d.recebido,d.pendente)), 1);
  const niceMax = Math.ceil(maxRaw*1.15) || 1;
  const ticks = [0, niceMax*0.25, niceMax*0.5, niceMax*0.75, niceMax];
  const n = data.length;
  const stepX = n>1 ? w/(n-1) : 0;
  function pts(field){
    return data.map((d,i)=>({ x: padL+i*stepX, y: padT+h-(d[field]/niceMax)*h }));
  }
  function smoothPath(points){
    if(points.length<2) return "";
    let d = `M ${points[0].x} ${points[0].y}`;
    for(let i=0;i<points.length-1;i++){
      const p0=points[i], p1=points[i+1]; const midX=(p0.x+p1.x)/2;
      d += ` C ${midX} ${p0.y}, ${midX} ${p1.y}, ${p1.x} ${p1.y}`;
    }
    return d;
  }
  const recebidoPts = pts("recebido"), pendentePts = pts("pendente");
  return (
    <div>
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{overflow:"visible"}}>
        {ticks.map((t,i)=>{
          const y = padT+h-(t/niceMax)*h;
          return (
            <g key={i}>
              <line x1={padL} y1={y} x2={width-padR} y2={y} stroke="var(--line)" strokeDasharray="3 4" strokeWidth="1"/>
              <text x={padL-8} y={y+4} fontSize="10.5" textAnchor="end" fill="var(--graphite-soft)">{fmtMoney(t).replace("R$","").trim()}</text>
            </g>
          );
        })}
        <path d={smoothPath(recebidoPts)} fill="none" stroke="var(--moss)" strokeWidth="2.5"/>
        <path d={smoothPath(pendentePts)} fill="none" stroke="var(--butter)" strokeWidth="2.5"/>
        {recebidoPts.map((p,i)=><circle key={"r"+i} cx={p.x} cy={p.y} r="3.5" fill="var(--card-bg)" stroke="var(--moss)" strokeWidth="2"/>)}
        {pendentePts.map((p,i)=><circle key={"p"+i} cx={p.x} cy={p.y} r="3.5" fill="var(--card-bg)" stroke="var(--butter)" strokeWidth="2"/>)}
        {data.map((d,i)=><text key={i} x={padL+i*stepX} y={height-6} fontSize="10.5" textAnchor="middle" fill="var(--graphite-soft)">{d.label}</text>)}
      </svg>
      <div style={{display:"flex", gap:16, justifyContent:"center", fontSize:12.5, marginTop:6}}>
        <span style={{display:"flex", alignItems:"center", gap:5}}><span style={{width:8,height:8,borderRadius:"50%", background:"var(--moss)", display:"inline-block"}}></span>Recebido</span>
        <span style={{display:"flex", alignItems:"center", gap:5}}><span style={{width:8,height:8,borderRadius:"50%", background:"var(--butter)", display:"inline-block"}}></span>Pendente</span>
