}

function HBarList({items, max}){
  return (
    <div>
      {items.map(([label,val],i)=>(
        <div key={label} style={{marginBottom: i<items.length-1?14:0}}>
          <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:6}}>
            <span>{label}</span><strong style={{color:"var(--moss)"}}>{fmtMoney(val)}</strong>
          </div>
          <div style={{height:6, background:"var(--sand)", borderRadius:999}}>
            <div style={{height:6, width:Math.max(3,(val/max)*100)+"%", background:"var(--wine)", borderRadius:999}}></div>
          </div>
        </div>
      ))}
    </div>
  );
}

function Performance({state, updateState, embutido}){
  const hoje = new Date();
  const [selMonth,setSelMonth] = useState(hoje.getMonth());
  const [selYear,setSelYear] = useState(hoje.getFullYear());
  const [metasModal,setMetasModal] = useState(false);

  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(selYear, selMonth-i, 1);
    months.push({label: monthNames[d.getMonth()].slice(0,3)+"/"+String(d.getFullYear()).slice(2), y:d.getFullYear(), m:d.getMonth()});
  }

  const txMes = state.transacoes.filter(t=>{ const d=new Date(t.data+"T00:00:00"); return d.getMonth()===selMonth && d.getFullYear()===selYear; });
  const receitaPrevista = txMes.filter(t=>t.tipo==="receita").reduce((a,b)=>a+Number(b.valor||0),0);
  const receitaRecebida = txMes.filter(t=>t.tipo==="receita"&&t.status==="Confirmado").reduce((a,b)=>a+Number(b.valor||0),0);
  const receitaPendente = txMes.filter(t=>t.tipo==="receita"&&t.status==="Pendente").reduce((a,b)=>a+Number(b.valor||0),0);
  const qtdPaga = txMes.filter(t=>t.tipo==="receita"&&t.status==="Confirmado").length;
  const ticketMedioPago = qtdPaga>0 ? receitaRecebida/qtdPaga : 0;

  const receitaPorMes = months.map(mo=>{
    const tx = state.transacoes.filter(t=>{ const d=new Date(t.data+"T00:00:00"); return t.tipo==="receita" && d.getMonth()===mo.m && d.getFullYear()===mo.y; });
    return {
      label: mo.label,
      recebido: tx.filter(t=>t.status==="Confirmado").reduce((a,b)=>a+Number(b.valor||0),0),
      pendente: tx.filter(t=>t.status==="Pendente").reduce((a,b)=>a+Number(b.valor||0),0)
    };
  });

  const jobsPorMes = months.map(mo=>{
    const total = state.jobs.filter(j=>{
      if(!j.criadoEm) return false;
      const d=new Date(j.criadoEm+"T00:00:00");
      return d.getMonth()===mo.m && d.getFullYear()===mo.y;
    }).length;
    return {...mo, total};
  });
  const maxJobs = Math.max(1, ...jobsPorMes.map(m=>m.total));
  const maxReceitaMes = Math.max(1, ...receitaPorMes.map(m=>m.recebido));

  const marcasCount = {};
  state.jobs.forEach(j=>{ if(j.marca && j.pagamento && j.pagamento.status==="Pago") marcasCount[j.marca] = (marcasCount[j.marca]||0) + Number(j.valor||0); });
  const topMarcas = Object.entries(marcasCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxMarca = Math.max(1, ...topMarcas.map(m=>m[1]));

  const tipoCount = {};
  state.jobs.forEach(j=>{ if(j.tipo && j.pagamento && j.pagamento.status==="Pago") tipoCount[j.tipo] = (tipoCount[j.tipo]||0) + Number(j.valor||0); });
  const topTipos = Object.entries(tipoCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxTipo = Math.max(1, ...topTipos.map(m=>m[1]));

  const entreguesMes = state.jobs.filter(j=>{
    if(!j.dataEntregaReal) return false;
    const d = new Date(j.dataEntregaReal+"T00:00:00");
    return d.getMonth()===selMonth && d.getFullYear()===selYear;
  }).length;
  const marcasAtendidas = new Set(state.jobs.filter(j=>{
    if(!j.criadoEm) return false;
    const d = new Date(j.criadoEm+"T00:00:00");
    return d.getMonth()===selMonth && d.getFullYear()===selYear;
  }).map(j=>j.marca)).size;
  const totalJobsMes = state.jobs.filter(j=>{
    if(!j.criadoEm) return false;
    const d = new Date(j.criadoEm+"T00:00:00");
    return d.getMonth()===selMonth && d.getFullYear()===selYear;
  }).length;
  const ticketMedioMes = totalJobsMes>0 ? state.jobs.filter(j=>{
    const d = new Date(j.criadoEm+"T00:00:00");
    return d.getMonth()===selMonth && d.getFullYear()===selYear;
  }).reduce((a,b)=>a+Number(b.valor||0),0)/totalJobsMes : 0;
  const mesAnteriorD = new Date(selYear, selMonth-1, 1);
  const receitaMesAnterior = state.transacoes.filter(t=>{
    const d = new Date(t.data+"T00:00:00");
    return t.tipo==="receita" && t.status==="Confirmado" && d.getMonth()===mesAnteriorD.getMonth() && d.getFullYear()===mesAnteriorD.getFullYear();
  }).reduce((a,b)=>a+Number(b.valor||0),0);
  const crescimento = receitaMesAnterior>0 ? Math.round(((receitaRecebida-receitaMesAnterior)/receitaMesAnterior)*100) : (receitaRecebida>0?100:0);

  const metaKey = `${selYear}-${String(selMonth+1).padStart(2,"0")}`;
  const meta = (state.metas||{})[metaKey];
  const jobsFechadosMetaMes = state.jobs.filter(j=>{
    if(!j.criadoEm) return false;
    const d = new Date(j.criadoEm+"T00:00:00");
    return d.getMonth()===selMonth && d.getFullYear()===selYear;
  }).length;

  return (
    <div>
      <div className="page-head">
        {embutido ? <div/> : <div>
          <h1 className="page-title">Performance</h1>
          <p className="page-sub">Acompanhe sua evolução como criadora</p>
        </div>}
        <div style={{display:"flex", gap:10}}>
          <select value={selMonth} onChange={e=>setSelMonth(Number(e.target.value))} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}>
            {monthNames.map((m,i)=><option key={m} value={i}>{m}</option>)}
          </select>
          <select value={selYear} onChange={e=>setSelYear(Number(e.target.value))} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}>
            {[selYear-1,selYear,selYear+1].map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>

      <div className="card" style={{marginBottom:18}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: meta?14:0}}>
          <h3 style={{margin:0, display:"flex", alignItems:"center", gap:8}}><Icon name="track_changes"/>Metas de {monthNames[selMonth]}</h3>
          <button className="btn btn-ghost btn-sm" onClick={()=>setMetasModal(true)}><Icon name="edit" size={14}/>Definir Metas</button>
        </div>
        {!meta ? (
          <p style={{textAlign:"center", color:"var(--graphite-soft)", fontSize:14, padding:"6px 0"}}>Defina suas metas mensais para acompanhar seu progresso</p>
        ) : (
          <div className="grid grid-2">
            {meta.marcas && (
              <div>
                <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:6}}>
                  <span>Marcas fechadas</span><strong>{jobsFechadosMetaMes} / {meta.marcas}</strong>
                </div>
                <div style={{height:10, background:"var(--sand)", borderRadius:999}}>
                  <div style={{height:10, width:Math.min(100,(jobsFechadosMetaMes/meta.marcas)*100)+"%", background:"var(--butter)", borderRadius:999}}></div>
                </div>
              </div>
            )}
            {meta.financeiro && (
              <div>
                <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:6}}>
                  <span>Meta financeira</span><strong>{fmtMoney(receitaRecebida)} / {fmtMoney(meta.financeiro)}</strong>
                </div>
                <div style={{height:10, background:"var(--sand)", borderRadius:999}}>
                  <div style={{height:10, width:Math.min(100,(receitaRecebida/meta.financeiro)*100)+"%", background:"var(--moss)", borderRadius:999}}></div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <h3 style={{margin:"0 0 12px"}}>Inteligência Financeira</h3>
      <div className="grid grid-4" style={{marginBottom:18}}>
        <StatCard label="Receita Prevista" value={fmtMoney(receitaPrevista)} icon="trending_up"/>
        <StatCard label="Receita Recebida" value={fmtMoney(receitaRecebida)} icon="check_circle"/>
        <StatCard label="Receita Pendente" value={fmtMoney(receitaPendente)} icon="hourglass_top"/>
        <StatCard label="Ticket Médio (Pago)" value={fmtMoney(ticketMedioPago)} icon="sell"/>
      </div>

      <div className="card" style={{marginBottom:18}}>
        <h3 style={{marginTop:0}}>Receita por Jobs (últimos 6 meses)</h3>
        <DualLineChart data={receitaPorMes} width={900} height={220}/>
      </div>

      <div className="grid grid-2" style={{marginBottom:18}}>
        <div className="card">
          <h3 style={{marginTop:0, display:"flex", alignItems:"center", gap:8}}><Icon name="apartment"/>Marcas que Mais Geraram Receita</h3>
          {topMarcas.length===0 ? <p style={{color:"var(--graphite-soft)", fontSize:14}}>Nenhum pagamento confirmado ainda.</p> : <HBarList items={topMarcas} max={maxMarca}/>}
        </div>
        <div className="card">
          <h3 style={{marginTop:0, display:"flex", alignItems:"center", gap:8}}><Icon name="videocam"/>Tipo de Conteúdo que Mais Gerou Receita</h3>
          {topTipos.length===0 ? <p style={{color:"var(--graphite-soft)", fontSize:14}}>Nenhum pagamento confirmado ainda.</p> : <HBarList items={topTipos} max={maxTipo}/>}
        </div>
      </div>

      <h3 style={{margin:"0 0 12px"}}>Visão Geral</h3>
      <div className="grid grid-3" style={{marginBottom:18}}>
        <StatCard label="Entregues (mês)" value={entreguesMes} icon="task_alt"/>
        <StatCard label="Marcas Atendidas" value={marcasAtendidas} icon="apartment"/>
        <StatCard label="Receita (mês)" value={fmtMoney(receitaRecebida)} icon="payments"/>
        <StatCard label="Total de Jobs" value={totalJobsMes} icon="work"/>
        <StatCard label="Ticket Médio" value={fmtMoney(ticketMedioMes)} icon="sell"/>
        <div className="card stat-card">
          <div className="stat-label"><Icon name="trending_up" size={16}/>Crescimento</div>
          <div className="stat-value" style={{color: crescimento>=0 ? "var(--moss)" : "var(--wine)"}}>{crescimento>=0?"+":""}{crescimento}%</div>
        </div>
      </div>

      <div className="grid grid-2">
        <div className="card">
          <h3 style={{marginTop:0}}>Jobs por Mês</h3>
          <div className="bar-chart">
            {jobsPorMes.map(m=>(
              <div className="bar-col" key={m.label}>
                <div className="bar" style={{height: (m.total/maxJobs*110)+"px"}}></div>
                <div className="bar-month">{m.label}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <h3 style={{marginTop:0}}>Receita por Mês</h3>
          <div className="bar-chart">
            {receitaPorMes.map(m=>(
              <div className="bar-col" key={m.label}>
                <div className="bar" style={{height: (m.recebido/maxReceitaMes*110)+"px", background:"var(--moss)"}}></div>
                <div className="bar-month">{m.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {metasModal && <MetasModal state={state} updateState={updateState} ano={selYear} mes={selMonth} onClose={()=>setMetasModal(false)}/>}
    </div>
  );
}

/* ================= SIMULADOR DE PREÇO ================= */
function Simulador(){
  const [f,setF] = useState({tipo:"",plataforma:"",duracao:"",qtd:1,direitos:"",prazo:"",nivel:""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const filled = !!f.tipo;

  function calcular(){
    let base = 150;
    const tipoMap = {"UGC":250,"Publi (1 reels)":400,"Publi (1 reels + story)":500,"Publi (1 reels + story + repost no tiktok)":650};
    const nivelMap = {"Iniciante":0.7,"Intermediário":1,"Avançado":1.5,"Referência":2.2};
    const direitosMap = {"7 dias":1,"30 dias":1.3,"90 dias":1.7,"180 dias":2.1,"12 meses":2.6,"Vitalício":3.5};
    const prazoMap = {"Padrão (7 dias)":1,"Urgente (48h)":1.4,"Expresso (24h)":1.7};
    base = (tipoMap[f.tipo]||250) * (nivelMap[f.nivel]||1) * (direitosMap[f.direitos]||1) * (prazoMap[f.prazo]||1);
    base = base * Number(f.qtd||1);
    return Math.max(250, base);
  }

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">Simulador de preço</h1>
          <p className="page-sub">Descubra quanto cobrar de forma profissional e estratégica</p>
        </div>
      </div>
      <div className="grid" style={{gridTemplateColumns:"1.2fr 1fr", gap:16}}>
        <div className="card">
          <h3 style={{marginTop:0}}>Configure seu job</h3>
          <div className="field-row">
            <Field label="Tipo de conteúdo">
              <select value={f.tipo} onChange={e=>set("tipo",e.target.value)}>
                <option value="">Selecione</option>
                {["UGC","Publi (1 reels)","Publi (1 reels + story)","Publi (1 reels + story + repost no tiktok)"].map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="Plataforma">
              <select value={f.plataforma} onChange={e=>set("plataforma",e.target.value)}>
                <option value="">Selecione</option>
                {["Instagram","TikTok","YouTube","Kwai"].map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
          </div>
          <div className="field-row">
            <Field label="Duração do vídeo">
              <select value={f.duracao} onChange={e=>set("duracao",e.target.value)}>
                <option value="">Selecione</option>
                {["15-30s","30-60s","1-3 min","3+ min"].map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="Quantidade de vídeos">
              <input type="number" min="1" value={f.qtd} onChange={e=>set("qtd",e.target.value)}/>
            </Field>
          </div>
          <div className="field-row">
            <Field label="Direitos de uso">
              <select value={f.direitos} onChange={e=>set("direitos",e.target.value)}>
                <option value="">Selecione</option>
                {["7 dias","30 dias","90 dias","180 dias","12 meses","Vitalício"].map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
            <Field label="Prazo de entrega">
              <select value={f.prazo} onChange={e=>set("prazo",e.target.value)}>
                <option value="">Selecione</option>
                {["Padrão (7 dias)","Urgente (48h)","Expresso (24h)"].map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Seu nível como criadora">
            <select value={f.nivel} onChange={e=>set("nivel",e.target.value)}>
              <option value="">Selecione</option>
              {["Iniciante","Intermediário","Avançado","Referência"].map(p=><option key={p}>{p}</option>)}
            </select>
          </Field>
        </div>
        <div className="card" style={{display:"flex", alignItems:"center", justifyContent:"center", textAlign:"center"}}>
          {!filled ? (
            <div>
              <Icon name="calculate" size={38}/>
              <div className="empty-title">Preencha os campos</div>
              <div className="empty-sub">Configure todos os detalhes do job para ver os valores recomendados</div>
            </div>
          ) : (
            <div>
              <div style={{fontSize:14.5, color:"var(--graphite-soft)", marginBottom:6}}>Valor recomendado</div>
              <div style={{fontFamily:"Poppins", fontSize:34, fontWeight:700}}>{fmtMoney(calcular())}</div>
              <div style={{fontSize:13.5, color:"var(--graphite-soft)", marginTop:8}}>Faixa sugerida: {fmtMoney(calcular()*0.85)} – {fmtMoney(calcular()*1.2)}</div>
              {!(f.plataforma && f.duracao && f.direitos && f.prazo && f.nivel) && (
                <div style={{fontSize:12.5, color:"var(--butter)", marginTop:12}}>Preencha os demais campos para refinar o valor.</div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ================= GENERIC LIST MODULES (Prospecção, Candidaturas, Portfólio, Roteiros) ================= */
function GenericModal({title, fields, onClose, onSave, initial}){
  const emptyObj = {}; fields.forEach(f=>emptyObj[f.key]=f.default||"");
  const [f,setF] = useState(initial || emptyObj);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return (
    <Modal title={title} onClose={onClose}>
      {fields.map(field=>(
        <Field label={field.label} key={field.key}>
          {field.type==="select" ? (
            <select value={f[field.key]} onChange={e=>set(field.key,e.target.value)}>
              {field.options.map(o=><option key={o}>{o}</option>)}
            </select>
          ) : field.type==="textarea" ? (
            <textarea rows="3" value={f[field.key]} onChange={e=>set(field.key,e.target.value)} placeholder={field.placeholder||""}/>
          ) : (
            <input type={field.type||"text"} value={f[field.key]} onChange={e=>set(field.key,e.target.value)} placeholder={field.placeholder||""}/>
          )}
        </Field>
      ))}
      <button className="btn btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={()=>{
        const reqOk = fields.filter(f=>f.required).every(f=>f.key && (f.key in (f))) ;
        onSave({...f, id:f.id||uid()});
      }}>Salvar</button>
    </Modal>
  );
}

function GenericList({title, sub, items, setItems, fields, icon, emptyTitle, emptySub, renderRow}){
  const [modal,setModal] = useState(false);
  const [editing,setEditing] = useState(null);
  const [query,setQuery] = useState("");

  function save(item){
    const exists = items.some(i=>i.id===item.id);
    const list = exists ? items.map(i=>i.id===item.id?item:i) : [...items, item];
    setItems(list);
    setModal(false); setEditing(null);
  }
  function remove(id){ setItems(items.filter(i=>i.id!==id)); }

  const shown = query ? items.filter(i=>JSON.stringify(i).toLowerCase().includes(query.toLowerCase())) : items;

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">{title}</h1>
          <p className="page-sub">{sub}</p>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal(true)}><Icon name="add" size={17}/>Adicionar</button>
      </div>
      <div className="search" style={{marginBottom:16}}>
        <Icon name="search"/>
        <input placeholder="Buscar..." value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      {shown.length===0 ? (
        <EmptyState icon={icon} title={emptyTitle} sub={emptySub} cta="Adicionar" onClick={()=>setModal(true)}/>
      ) : (
        <div>{shown.map(item=>renderRow(item, ()=>setEditing(item), ()=>remove(item.id)))}</div>
      )}
      {modal && <GenericModal title={"Novo " + title.toLowerCase().replace(/s$/,"")} fields={fields} onClose={()=>setModal(false)} onSave={save}/>}
      {editing && <GenericModal title={"Editar"} fields={fields} initial={editing} onClose={()=>setEditing(null)} onSave={save}/>}
    </div>
  );
}

function TemplatesTab({state, updateState}){

  const [copiedId,setCopiedId] = useState(null);
  const [failedId,setFailedId] = useState(null);
  const all = [...DEFAULT_TEMPLATES, ...(state.templates||[])];

  async function copiar(t){
    const ok = await copyToClipboard(t.texto);
    if(ok){ setCopiedId(t.id); setTimeout(()=>setCopiedId(null), 1800); }
    else{ setFailedId(t.id); setTimeout(()=>setFailedId(null), 3000); }
  }
  function remover(id){
    updateState({...state, templates:(state.templates||[]).filter(t=>t.id!==id)});
  }
  function salvar(t){
    updateState({...state, templates:[...(state.templates||[]), t]});
    setNovoModal(false);
  }

  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
        <span style={{fontWeight:600, fontSize:14, color:"var(--graphite-soft)"}}>Templates padrão</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>setNovoModal(true)}><Icon name="add" size={16}/>Novo template</button>
      </div>

function syncPlannerFromRoteiro(state, roteiro){
  let planner = [...state.planner];
  const existingIdx = planner.findIndex(p=>p.roteiroId===roteiro.id);
  if(!roteiro.dataPublicacao){
    if(existingIdx>=0) planner.splice(existingIdx,1);
    return planner;
  }
  const item = {
    id: existingIdx>=0 ? planner[existingIdx].id : uid(),
    roteiroId: roteiro.id,
    titulo: roteiro.titulo,
    plataforma: roteiro.plataforma || "Instagram",
    formato: "Reels",
    status: roteiro.etapa==="Pronto p/ Postar" ? "Entregue" : (roteiro.etapa==="Gravação"||roteiro.etapa==="Edição") ? "Gravado" : "Planejado",
    data: roteiro.dataPublicacao,
    marca: "",
    notas: "Sincronizado automaticamente do Roteiro",
    categoria: roteiro.finalidade || "Conteúdos"
  };
  if(existingIdx>=0) planner[existingIdx] = item; else planner.push(item);
  return planner;
}

function Roteiros({state, updateState, pendingAI, clearPendingAI}){
  const [modal,setModal] = useState(false);
  const [aiModal,setAiModal] = useState(false);
  const [importModal,setImportModal] = useState(false);
  const [editing,setEditing] = useState(null);
  const [query,setQuery] = useState("");
  const [view,setView] = useState("Lista");
  const [onlyImported,setOnlyImported] = useState(false);
  const [dragOverCol,setDragOverCol] = useState(null);

  useEffect(()=>{
    if(pendingAI){ setAiModal(true); clearPendingAI(); }
  },[pendingAI]);

  function save(item){
    const exists = state.roteiros.some(i=>i.id===item.id);
    const roteiros = exists ? state.roteiros.map(i=>i.id===item.id?item:i) : [...state.roteiros, item];
    const planner = syncPlannerFromRoteiro({...state, roteiros}, item);
    updateState({...state, roteiros, planner});
    setModal(false); setEditing(null);
  }
  function remove(id){
    updateState({...state, roteiros: state.roteiros.filter(i=>i.id!==id), planner: state.planner.filter(p=>p.roteiroId!==id)});
  }
  function onGenerated(roteiro){
    const roteiros = [...state.roteiros, roteiro];
    const planner = syncPlannerFromRoteiro({...state, roteiros}, roteiro);
    updateState({...state, roteiros, planner});
    setAiModal(false);
  }
  function onImport(bankItem){
    const conteudo = `GANCHO:\n${bankItem.gancho}\n\nDESENVOLVIMENTO:\n${bankItem.desenvolvimento}\n\nCTA:\n${bankItem.cta}`;
    const roteiro = {
      id:uid(), titulo:bankItem.titulo, plataforma:"Instagram", status:"Em aberto",
      finalidade: bankItem.tab==="Jobs" ? "Publi" : "Conteúdos", etapa:"Ideias", dataPublicacao:"",
      conteudo, dicas:bankItem.dicas, hashtags:bankItem.hashtags, duracao:bankItem.duracao,
      importadoDe:bankItem.titulo
    };
    const roteiros = [...state.roteiros, roteiro];
    updateState({...state, roteiros});
    setImportModal(false);
  }
  function setEtapa(id, etapa){
    const item = state.roteiros.find(r=>r.id===id);
    if(!item) return;
    const updated = {...item, etapa};
    const roteiros = state.roteiros.map(r=>r.id===id?updated:r);
    const planner = syncPlannerFromRoteiro({...state, roteiros}, updated);
    updateState({...state, roteiros, planner});
  }

  let shown = query ? state.roteiros.filter(i=>JSON.stringify(i).toLowerCase().includes(query.toLowerCase())) : state.roteiros;
  if(onlyImported) shown = shown.filter(i=>i.importadoDe);

  function onDragStart(e, id){ e.dataTransfer.setData("text/plain", id); }
  function onDrop(e, etapa){
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    setEtapa(id, etapa);
    setDragOverCol(null);
  }

  return (
    <div>
      <div className="page-head">

          <p className="page-sub">Crie e organize seus roteiros de UGC</p>
        </div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>

          <button className="btn btn-primary" onClick={()=>setAiModal(true)}><Icon name="auto_awesome" size={17}/>Criar com IA</button>
          <button className="btn btn-ghost" onClick={()=>setModal(true)}><Icon name="add" size={17}/>Manual</button>
        </div>
      </div>
      <div className="search" style={{marginBottom:16}}>
        <Icon name="search"/>
        <input placeholder="Buscar roteiro por título, conteúdo ou tag..." value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10}}>
        <div className="tabs">
          {["Lista","Quadro"].map(t=><div key={t} className={"tab "+(view===t?"active":"")} onClick={()=>setView(t)}>{t}</div>)}
        </div>
        {view==="Lista" && (
          <button className={"tab "+(onlyImported?"active":"")} style={{border:"none"}} onClick={()=>setOnlyImported(v=>!v)}>
            <Icon name="download" size={14}/> Importados ({state.roteiros.filter(r=>r.importadoDe).length})
          </button>
        )}
      </div>

      {view==="Quadro" ? (
        <div style={{display:"flex", gap:14, overflowX:"auto", paddingBottom:10}}>
          {ROTEIRO_ETAPAS.map(etapa=>{
            const colItems = state.roteiros.filter(r=>(r.etapa||"Ideias")===etapa && (!query || JSON.stringify(r).toLowerCase().includes(query.toLowerCase())));
            return (
              <div key={etapa} onDragOver={(e)=>{e.preventDefault(); setDragOverCol(etapa);}} onDrop={(e)=>onDrop(e,etapa)}
                style={{minWidth:250, flexShrink:0, background:"var(--sand)", borderRadius:16, padding:12, outline: dragOverCol===etapa ? "2px dashed var(--butter)":"none"}}>
                <div style={{fontSize:13.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".03em", color:"var(--graphite-soft)", margin:"2px 6px 10px", display:"flex", justifyContent:"space-between"}}>
                  {etapa} <span>{colItems.length}</span>
                </div>
                {colItems.length===0 && <div style={{border:"1.5px dashed var(--line)", borderRadius:12, padding:"20px 10px", textAlign:"center", fontSize:13, color:"var(--graphite-soft)"}}>Arraste roteiros para cá</div>}
                {colItems.map(item=>(
                  <div className="kanban-card" key={item.id} draggable onDragStart={(e)=>onDragStart(e,item.id)}>
                    <Badge tone={FINALIDADE_TONE[item.finalidade]||"gray"}>{item.finalidade||"Conteúdos"}</Badge>
                    <div style={{fontWeight:600, fontSize:14, margin:"6px 0 3px"}}>{item.titulo}</div>
                    <div style={{fontSize:12.5, color:"var(--graphite-soft)", marginBottom:8}}>{item.plataforma}{item.dataPublicacao && " · "+new Date(item.dataPublicacao+"T00:00:00").toLocaleDateString('pt-BR')}</div>
                    <div style={{display:"flex", gap:6}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setEditing(item)}>Editar</button>
                      <button className="icon-btn" style={{width:30,height:30}} onClick={()=>remove(item.id)}><Icon name="delete" size={14}/></button>
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      ) : shown.length===0 ? (
        <EmptyState icon="description" title="Nenhum roteiro encontrado" sub="Crie seu primeiro roteiro." cta="Criar com IA" onClick={()=>setAiModal(true)}/>
      ) : (
        <div>{shown.map(item=>(
          <div className="row-item" key={item.id} style={{alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex", gap:6, alignItems:"center", marginBottom:4}}>
                <Badge tone={FINALIDADE_TONE[item.finalidade]||"gray"}>{item.finalidade||"Conteúdos"}</Badge>

                <strong>{item.titulo}</strong>
              </div>
              <div style={{fontSize:13.5, color:"var(--graphite-soft)", marginBottom:6}}>{item.plataforma} · {item.etapa||"Ideias"}{item.dataPublicacao && " · "+new Date(item.dataPublicacao+"T00:00:00").toLocaleDateString('pt-BR')}</div>
              {item.conteudo && <div style={{fontSize:14.5, whiteSpace:"pre-wrap", color:"var(--graphite-soft)", maxHeight:80, overflow:"hidden"}}>{item.conteudo}</div>}
            </div>

              <button className="icon-btn" onClick={()=>setEditing(item)}><Icon name="edit" size={18}/></button>
              <button className="icon-btn" onClick={()=>remove(item.id)}><Icon name="delete" size={18}/></button>
            </div>
          </div>
        ))}</div>
      )}
      {modal && <RoteiroModal onClose={()=>setModal(false)} onSave={save}/>}
      {editing && <RoteiroModal initial={editing} onClose={()=>setEditing(null)} onSave={save}/>}
      {aiModal && <RoteiroAIModal onClose={()=>setAiModal(false)} onGenerated={onGenerated}/>}
      {importModal && <ImportRoteiroModal onClose={()=>setImportModal(false)} onImport={onImport}/>}
    </div>
  );
}

function OrgLinksList({state, updateState, stateKey, title, sub, itemLabel}){
  const [modal,setModal] = useState(false);
  const [editing,setEditing] = useState(null);
  const links = state[stateKey] || [];
  function add(l){ updateState({...state, [stateKey]:[...links, {...l, id:uid()}]}); setModal(false); }
  function save(l){ updateState({...state, [stateKey]: links.map(x=>x.id===l.id?l:x)}); setEditing(null); }
  function remove(id){ updateState({...state, [stateKey]: links.filter(l=>l.id!==id)}); }
  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16}}>
        <div>
          <strong style={{fontSize:16}}>{title}</strong>
          <div style={{fontSize:13.5, color:"var(--graphite-soft)"}}>{sub}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setModal(true)}><Icon name="add" size={14}/>Adicionar</button>
      </div>
      {links.length===0 ? (
        <EmptyState icon="folder" title="Nenhum link cadastrado." sub={`Adicione links para ${sub.toLowerCase()}!`}/>
      ) : links.map(l=>(
        <div className="row-item" key={l.id}>
          <div style={{flex:1}}>
            <strong>{l.titulo}</strong>
            {l.obs && <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>{l.obs}</div>}
          </div>
          <a href={l.url} target="_blank" className="btn btn-ghost btn-sm">Abrir</a>
          <button className="icon-btn" onClick={()=>setEditing(l)}><Icon name="edit" size={17}/></button>
          <button className="icon-btn" onClick={()=>remove(l.id)}><Icon name="delete" size={17}/></button>
        </div>
      ))}
      {modal && (
        <Modal title="Adicionar Link" onClose={()=>setModal(false)}>
          <LinkQuickForm onSave={add} itemLabel={itemLabel}/>
        </Modal>

      {editing && (
        <Modal title="Editar Link" onClose={()=>setEditing(null)}>
          <LinkQuickForm onSave={save} itemLabel={itemLabel} initial={editing}/>
        </Modal>

  );
}
function LinkQuickForm({onSave, itemLabel, initial}){

function AssinaturasTab({state, updateState}){
  const [editing,setEditing] = useState(null);
  const [outraModal,setOutraModal] = useState(false);
  const [editingPreset,setEditingPreset] = useState(null);
  const assinaturas = state.assinaturas || [];
  const presets = state.assinaturaPresets || ASSINATURA_PRESETS;
  const totalMes = assinaturas.reduce((a,b)=>a+Number(b.valor||0),0);
  const totalAno = totalMes*12;

  function addPreset(p){
    if(assinaturas.some(a=>a.nome===p.nome)) return;
    updateState({...state, assinaturas:[...assinaturas, {...p, id:uid()}]});
  }
  function addOutra(item){ updateState({...state, assinaturas:[...assinaturas, item]}); setOutraModal(false); }
  function save(a){ updateState({...state, assinaturas: assinaturas.map(x=>x.id===a.id?a:x)}); setEditing(null); }
  function remove(id){ updateState({...state, assinaturas: assinaturas.filter(a=>a.id!==id)}); }
  function savePreset(p){ updateState({...state, assinaturaPresets: presets.map(x=>x.nome===editingPreset.nome?p:x)}); setEditingPreset(null); }
  function removePreset(nome){ updateState({...state, assinaturaPresets: presets.filter(x=>x.nome!==nome)}); }

  return (
    <div>
      <div style={{display:"flex", gap:10, alignItems:"flex-start", background:"var(--sand)", borderRadius:14, padding:"14px 16px", marginBottom:16}}>
        <Icon name="auto_awesome" size={18} style={{color:"var(--butter)", marginTop:2}}/>
        <div>
          <strong style={{fontSize:14}}>Isso não é gasto, é investimento na sua carreira!</strong>
          <div style={{fontSize:13, color:"var(--graphite-soft)"}}>Ferramentas potencializam sua produtividade, qualidade e ganhos como criadora UGC.</div>
        </div>
      </div>

      <div className="grid grid-3" style={{marginBottom:20}}>
        <div className="card" style={{textAlign:"center"}}>
          <div style={{fontFamily:"Poppins", fontSize:28, fontWeight:700}}>{fmtMoney(totalMes)}</div>
          <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Investimento/mês</div>
        </div>
        <div className="card" style={{textAlign:"center"}}>
          <div style={{fontFamily:"Poppins", fontSize:28, fontWeight:700}}>{fmtMoney(totalAno)}</div>
          <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Investimento/ano</div>
        </div>
        <div className="card" style={{textAlign:"center"}}>
          <div style={{fontFamily:"Poppins", fontSize:28, fontWeight:700}}>{assinaturas.length}</div>
          <div style={{fontSize:12.5, color:"var(--graphite-soft)"}}>Ferramentas ativas</div>
        </div>
      </div>

      {assinaturas.length===0 ? (
        <p style={{textAlign:"center", color:"var(--graphite-soft)", fontSize:14, marginBottom:20}}>Nenhuma assinatura cadastrada. Adicione suas ferramentas abaixo!</p>
      ) : (
        <div style={{marginBottom:24}}>
          {assinaturas.map(a=>(
            <div className="row-item" key={a.id}>
              <span style={{width:32,height:32, borderRadius:9, background:a.cor||"var(--butter)", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, flexShrink:0}}>{a.letra||a.nome.slice(0,2).toUpperCase()}</span>
              <div style={{flex:1}}><strong>{a.nome}</strong></div>
              <strong>{fmtMoney(a.valor)}/mês</strong>
              <div style={{display:"flex", gap:6}}>
                <button className="icon-btn" onClick={()=>setEditing(a)}><Icon name="edit" size={17}/></button>
                <button className="icon-btn" onClick={()=>remove(a.id)}><Icon name="delete" size={17}/></button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"var(--graphite-soft)", marginBottom:10}}>Adicionar ferramenta</div>
      <div className="grid grid-4" style={{gap:10}}>
        {presets.map(p=>{
          const jaAdicionada = assinaturas.some(a=>a.nome===p.nome);
          return (
            <div key={p.nome} style={{position:"relative"}}>
              <button onClick={()=>addPreset(p)} disabled={jaAdicionada}
                style={{width:"100%", display:"flex", alignItems:"center", gap:10, padding:"12px 40px 12px 14px", borderRadius:12, border:"1px solid var(--line)", background: jaAdicionada?"var(--sand)":"var(--card-bg)", cursor: jaAdicionada?"default":"pointer", textAlign:"left", opacity: jaAdicionada?0.6:1}}>
                <span style={{width:30,height:30, borderRadius:8, background:p.cor, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, flexShrink:0}}>{p.letra}</span>
                <div>
                  <div style={{fontSize:13.5, fontWeight:600}}>{p.nome}</div>
                  <div style={{fontSize:12, color:"var(--graphite-soft)"}}>{fmtMoney(p.valor)}/mês{jaAdicionada && " · adicionada"}</div>
                </div>
              </button>
              <div style={{position:"absolute", top:6, right:6, display:"flex", gap:2}}>
                <button onClick={(e)=>{e.stopPropagation(); setEditingPreset(p);}} style={{width:22,height:22, border:"none", background:"transparent", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--graphite-soft)"}}><Icon name="edit" size={13}/></button>
                <button onClick={(e)=>{e.stopPropagation(); removePreset(p.nome);}} style={{width:22,height:22, border:"none", background:"transparent", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--graphite-soft)"}}><Icon name="close" size={13}/></button>
              </div>
            </div>
          );
        })}
        <button onClick={()=>setOutraModal(true)} style={{display:"flex", alignItems:"center", justifyContent:"center", gap:8, padding:"12px 14px", borderRadius:12, border:"1.5px dashed var(--line)", background:"transparent", cursor:"pointer", color:"var(--graphite-soft)", fontSize:13.5, fontWeight:600}}>
          <Icon name="add" size={16}/>Outra ferramenta
        </button>
      </div>

      {editing && <AssinaturaEditModal item={editing} onClose={()=>setEditing(null)} onSave={save}/>}
      {outraModal && <OutraFerramentaModal onClose={()=>setOutraModal(false)} onSave={addOutra}/>}
      {editingPreset && <PresetEditModal item={editingPreset} onClose={()=>setEditingPreset(null)} onSave={savePreset}/>}
    </div>
  );
}

function LiveModal({tipo, onClose, onSave, initial}){
  const [f,setF] = useState(initial || {data:todayISO(), inicio:"19:00", fim:"21:00", tema:"", viewers:"", produtos:[], metaVendas:"", roteiro:"", notas:""});
  const [prodInput,setProdInput] = useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  function duracao(){
    if(!f.inicio||!f.fim) return null;
    const [h1,m1] = f.inicio.split(":").map(Number), [h2,m2] = f.fim.split(":").map(Number);
    let mins = (h2*60+m2)-(h1*60+m1);
    if(mins<0) mins += 24*60;
    return (mins/60).toFixed(mins%60===0?0:1);
  }
  function addProduto(){ if(!prodInput.trim()) return; set("produtos",[...f.produtos, prodInput.trim()]); setProdInput(""); }
  const isRegistrar = tipo==="registrar";
  return (
    <Modal title={isRegistrar ? "Registrar Live" : "Agendar Live"} onClose={onClose}>
      <div style={{display:"grid", gridTemplateColumns:"1.2fr 1fr 1fr", gap:12}}>
        <Field label={<span>Data da Live <span style={{color:"var(--wine)"}}>*</span></span>}><input type="date" value={f.data} onChange={e=>set("data",e.target.value)}/></Field>
        <Field label="Início"><input type="time" value={f.inicio} onChange={e=>set("inicio",e.target.value)}/></Field>
        <Field label="Fim"><input type="time" value={f.fim} onChange={e=>set("fim",e.target.value)}/></Field>
      </div>
      <p style={{fontSize:13, color:"var(--graphite-soft)", marginTop:-10, marginBottom:14}}>Duração: {duracao()}h</p>
      <Field label="Tema"><input value={f.tema} onChange={e=>set("tema",e.target.value)}/></Field>
      {isRegistrar ? (
        <>
          <Field label="Viewers no Pico"><input type="number" value={f.viewers} onChange={e=>set("viewers",e.target.value)}/></Field>
          <div className="field">
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
              <label style={{margin:0}}>Produtos Vendidos</label>
              <div style={{display:"flex", gap:6}}>
                <input style={{width:140}} value={prodInput} onChange={e=>setProdInput(e.target.value)} placeholder="Nome do produto" onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addProduto();}}}/>
                <button type="button" className="btn btn-ghost btn-sm" onClick={addProduto}><Icon name="add" size={14}/>Adicionar</button>
              </div>
            </div>
            {f.produtos.length>0 && <div style={{display:"flex", flexWrap:"wrap", gap:6}}>{f.produtos.map((p,i)=><Badge key={i} tone="gray">{p}</Badge>)}</div>}
          </div>
          <Field label="Meta de vendas (opcional)"><input value={f.metaVendas} onChange={e=>set("metaVendas",e.target.value)}/></Field>
        </>
      ) : (
        <>
          <Field label="Meta de vendas (opcional)"><input value={f.metaVendas} onChange={e=>set("metaVendas",e.target.value)}/></Field>
          <Field label="Roteiro da live (opcional)"><textarea rows="3" value={f.roteiro} onChange={e=>set("roteiro",e.target.value)}/></Field>
        </>
      )}
      <Field label="Notas"><textarea rows="3" value={f.notas} onChange={e=>set("notas",e.target.value)}/></Field>

function TagManagerModal({title, tags, onSave, onClose}){
  const [list,setList] = useState([...tags]);
  const [novo,setNovo] = useState("");
  const [editIdx,setEditIdx] = useState(null);
  const [editVal,setEditVal] = useState("");
  function add(){ if(!novo.trim()) return; setList([...list, novo.trim()]); setNovo(""); }
  function remove(i){ setList(list.filter((_,idx)=>idx!==i)); }
  function startEdit(i){ setEditIdx(i); setEditVal(list[i]); }
  function saveEdit(){ setList(list.map((v,idx)=>idx===editIdx?editVal:v)); setEditIdx(null); }
  return (
    <Modal title={title} onClose={onClose}>
      {list.map((tag,i)=>(
        <div className="row-item" key={i}>
          {editIdx===i ? (
            <input style={{flex:1, padding:"8px 10px", border:"1px solid var(--line)", borderRadius:8}} value={editVal} onChange={e=>setEditVal(e.target.value)}/>
          ) : <span style={{flex:1}}>{tag}</span>}
          <div style={{display:"flex", gap:6}}>
            {editIdx===i ? (
              <button className="icon-btn" onClick={saveEdit}><Icon name="check" size={16}/></button>
            ) : (
              <button className="icon-btn" onClick={()=>startEdit(i)}><Icon name="edit" size={16}/></button>
            )}
            <button className="icon-btn" onClick={()=>remove(i)}><Icon name="delete" size={16}/></button>
          </div>
        </div>
      ))}
      <div style={{display:"flex", gap:8, marginTop:10, marginBottom:16}}>
        <input style={{flex:1}} placeholder="Adicionar novo" value={novo} onChange={e=>setNovo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") add();}}/>

function TTSAmostras({state, updateState, hoje}){
  const [modal,setModal] = useState(false);
  const [editing,setEditing] = useState(null);
  const [expandedId,setExpandedId] = useState(null);
  const [query,setQuery] = useState("");
  const [statusF,setStatusF] = useState("Todos status");
  const [prazoF,setPrazoF] = useState("Todos prazos");
  const amostras = state.tiktokAmostras || [];
  function add(a){ updateState({...state, tiktokAmostras:[...amostras, a]}); setModal(false); }
  function save(a){ updateState({...state, tiktokAmostras: amostras.map(x=>x.id===a.id?a:x)}); setEditing(null); }
  function remove(id){ updateState({...state, tiktokAmostras: amostras.filter(a=>a.id!==id)}); }
  function updateAmostra(a){ updateState({...state, tiktokAmostras: amostras.map(x=>x.id===a.id?a:x)}); }

  let shown = amostras;
  if(query) shown = shown.filter(a=>JSON.stringify(a).toLowerCase().includes(query.toLowerCase()));
  if(statusF!=="Todos status") shown = shown.filter(a=>a.status===statusF);
  if(prazoF==="Atrasadas") shown = shown.filter(a=>a.prazoPostagem && a.prazoPostagem<hoje && a.status!=="Postado");
  if(prazoF==="Pendentes") shown = shown.filter(a=>a.prazoPostagem && a.prazoPostagem>=hoje && a.status!=="Postado");

  return (
    <div>
      <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
        <div className="search" style={{flex:1, minWidth:220}}>
          <Icon name="search"/>
          <input placeholder="Buscar por produto, loja, tag..." value={query} onChange={e=>setQuery(e.target.value)}/>
        </div>
        <select value={statusF} onChange={e=>setStatusF(e.target.value)} style={{padding:"9px 12px", borderRadius:10, border:"1px solid var(--line)"}}>
          <option>Todos status</option>

function TTSAnalytics({amostras, campeoes, pendentes, atrasadas, gmvTotal, comissaoTotal}){
  const totalVendas = campeoes.reduce((s,c)=>s+Number(c.vendas||0),0) + amostras.reduce((s,a)=>s+(a.videos||[]).reduce((s2,v)=>s2+Number(v.vendas||0),0),0);

  const formatoCount = {};
  campeoes.forEach(c=>{ if(c.formato) formatoCount[c.formato] = (formatoCount[c.formato]||0)+Number(c.gmv||0); });
  amostras.forEach(a=>(a.videos||[]).forEach(v=>{ if(v.tipo) formatoCount[v.tipo] = (formatoCount[v.tipo]||0)+Number(v.gmv||0); }));
  const topFormato = Object.entries(formatoCount).sort((a,b)=>b[1]-a[1])[0];
  const maxFormato = Math.max(1, ...Object.values(formatoCount));

  const hoje = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){
    const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
    meses.push({label: monthNames[d.getMonth()].slice(0,3)+"/"+String(d.getFullYear()).slice(2), y:d.getFullYear(), m:d.getMonth()});
  }
  const gmvPorMes = meses.map(mo=>{
    const total = amostras.reduce((s,a)=>s+(a.videos||[]).filter(v=>{
      if(!v.data) return false;
      const d = new Date(v.data+"T00:00:00");
      return d.getMonth()===mo.m && d.getFullYear()===mo.y;
    }).reduce((s2,v)=>s2+Number(v.gmv||0),0), 0);
    return {...mo, total};
  });
  const maxGmvMes = Math.max(1, ...gmvPorMes.map(m=>m.total));
  const temDadosMes = gmvPorMes.some(m=>m.total>0);

  return (
    <div>
      <div className="grid grid-4" style={{marginBottom:16}}>
        <StatCard label="Amostras recebidas" value={amostras.length} icon="inventory_2"/>
        <div className="card stat-card"><div className="stat-label"><Icon name="schedule" size={16}/>Pendentes</div><div className="stat-value" style={{color:"var(--butter)"}}>{pendentes}</div></div>
        <div className="card stat-card"><div className="stat-label"><Icon name="warning" size={16}/>Atrasadas</div><div className="stat-value" style={{color:"var(--wine)"}}>{atrasadas}</div></div>
        <StatCard label="Vídeos criados" value={campeoes.reduce((s,c)=>s+Number(c.qtdVideos||0),0) + amostras.reduce((s,a)=>s+(a.videos||[]).length,0)} icon="videocam"/>
      </div>
      <div className="grid grid-4" style={{marginBottom:18}}>
        <StatCard label="Total vendas" value={totalVendas} icon="shopping_cart"/>
        <div className="card stat-card"><div className="stat-label"><Icon name="payments" size={16}/>Comissão total</div><div className="stat-value" style={{color:"var(--moss)"}}>{fmtMoney(comissaoTotal)}</div></div>
        <div className="card stat-card"><div className="stat-label"><Icon name="trending_up" size={16}/>GMV total</div><div className="stat-value" style={{color:"var(--moss)"}}>{fmtMoney(gmvTotal)}</div></div>
        <div className="card stat-card"><div className="stat-label"><Icon name="military_tech" size={16}/>Top formato</div><div className="stat-value" style={{fontSize:20}}>{topFormato ? topFormato[0] : "—"}</div></div>
      </div>
      <div className="grid grid-2" style={{marginBottom:18}}>
        <div className="card">
          <strong>GMV por mês</strong>
          {!temDadosMes ? (
            <p style={{textAlign:"center", color:"var(--graphite-soft)", fontSize:14, padding:"30px 0", margin:0}}>Sem dados ainda. Cadastre vídeos com GMV nas amostras para ver o gráfico aqui.</p>
          ) : (
            <div className="bar-chart">
              {gmvPorMes.map(m=>(
                <div className="bar-col" key={m.label}>
                  <div className="bar" style={{height: (m.total/maxGmvMes*110)+"px", background:"var(--moss)"}}></div>
                  <div className="bar-month">{m.label}</div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="card">
          <strong>Top formatos por GMV</strong>
          {Object.keys(formatoCount).length===0 ? (
            <p style={{textAlign:"center", color:"var(--graphite-soft)", fontSize:14, padding:"30px 0", margin:0}}>Sem dados ainda. Cadastre campeões ou vídeos com GMV para ver o gráfico aqui.</p>
          ) : (
            <div className="bar-chart">
              {Object.entries(formatoCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,val])=>(
                <div className="bar-col" key={label}>
                  <div className="bar" style={{height: (val/maxFormato*110)+"px"}}></div>
                  <div className="bar-month">{label}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Configuracoes({state, updateState}){
  const [name,setName] = useState(state.profile.name);
  const [prefs,setPrefs] = useState({push:true, diasUteis:false});
  const fileInputRef = useRef(null);
  const [importStatus,setImportStatus] = useState("idle");

  function exportarBackup(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `conectee-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importarBackup(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const dados = JSON.parse(ev.target.result);
        if(!window.confirm("Isso vai substituir todos os dados atuais pelos do backup. Continuar?")){ setImportStatus("idle"); return; }
        updateState({...initialState, ...dados});
        setImportStatus("ok");
        setTimeout(()=>setImportStatus("idle"), 3000);
      }catch(err){
        setImportStatus("fail");
        setTimeout(()=>setImportStatus("idle"), 4000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div>
      <div className="page-head">
        <div><h1 className="page-title">Configurações</h1><p className="page-sub">Gerencie sua conta</p></div>
      </div>
      <div className="card" style={{maxWidth:520, marginBottom:16}}>
        <h3 style={{marginTop:0}}>Seu perfil</h3>
        <Field label="Nome de exibição">
          <input value={name} onChange={e=>setName(e.target.value)} />
        </Field>
        <button className="btn btn-primary" onClick={()=>updateState({...state, profile:{...state.profile, name}})}>Salvar</button>
      </div>
      <div className="card" style={{maxWidth:520, marginBottom:16}}>
        <h3 style={{marginTop:0, display:"flex", alignItems:"center", gap:8}}><Icon name="backup" size={18}/>Backup dos seus dados</h3>
        <p style={{fontSize:14, color:"var(--graphite-soft)", marginTop:-6, marginBottom:16}}>
          Baixe uma cópia de tudo que você cadastrou (jobs, financeiro, roteiros, planner...) pra guardar no seu computador. Se algo der errado, você pode restaurar a partir desse arquivo.
        </p>
        <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
          <button className="btn btn-primary" onClick={exportarBackup}><Icon name="download" size={16}/>Baixar backup</button>
          <button className="btn btn-ghost" onClick={()=>fileInputRef.current.click()}><Icon name="upload" size={16}/>Restaurar backup</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{display:"none"}} onChange={importarBackup}/>
        </div>
        {importStatus==="ok" && <p style={{fontSize:13, color:"var(--moss)", marginTop:10}}><Icon name="check_circle" size={14}/> Backup restaurado com sucesso.</p>}
        {importStatus==="fail" && <p style={{fontSize:13, color:"var(--wine)", marginTop:10}}><Icon name="error" size={14}/> Não consegui ler esse arquivo. Confirme que é um backup gerado por aqui.</p>}
        <p style={{fontSize:12.5, color:"var(--graphite-soft)", marginTop:14}}>
          <Icon name="info" size={13} style={{verticalAlign:"middle"}}/> Dica: sempre acesse o app pelo mesmo link/conversa do Claude — se abrir um arquivo baixado direto no computador, ele não salva automaticamente.
        </p>
      </div>
      <div className="card" style={{maxWidth:520}}>
        <h3 style={{marginTop:0}}>Notificações</h3>
        <div className="row-item">
          <div><strong style={{fontSize:14}}>Notificações push</strong><div style={{fontSize:13.5, color:"var(--graphite-soft)"}}>Receba alertas de jobs e prazos</div></div>
          <Toggle on={prefs.push} onClick={()=>setPrefs(p=>({...p, push:!p.push}))}/>
        </div>
        <div className="row-item">
          <div><strong style={{fontSize:14}}>Push apenas em dias úteis</strong><div style={{fontSize:13.5, color:"var(--graphite-soft)"}}>Nada de notificação no sábado e domingo</div></div>
          <Toggle on={prefs.diasUteis} onClick={()=>setPrefs(p=>({...p, diasUteis:!p.diasUteis}))}/>
        </div>
      </div>
    </div>
  );
}

  ]},

  ]},

function SaveStatusIndicator({status, onRetry}){
  if(status==="idle") return null;
  const config = {
    saving: {icon:"cloud_sync", text:"Salvando alterações...", color:"var(--graphite-soft)", bg:"var(--card-bg)"},
    retrying: {icon:"cloud_sync", text:"Tentando salvar novamente...", color:"var(--butter)", bg:"var(--card-bg)"},
    saved: {icon:"cloud_done", text:"Tudo salvo", color:"var(--moss)", bg:"var(--card-bg)"},
    error: {icon:"cloud_off", text:"Sem conexão com o servidor no momento. Suas alterações estão guardadas aqui e vamos tentar salvar de novo automaticamente.", color:"var(--wine)", bg:"var(--card-bg)"},
  }[status];
  if(!config) return null;
  return (
    <div style={{
      position:"fixed", bottom:18, right:18, zIndex:200,
      display:"flex", alignItems:"center", gap:8, background:config.bg, border:"1px solid var(--line)",
      borderRadius: status==="error" ? 16 : 999, padding:"9px 16px", boxShadow:"var(--shadow-lift)", fontSize:13.5, fontWeight:600, color:config.color, maxWidth:320
    }}>
      <Icon name={config.icon} size={17} style={status==="saving"||status==="retrying" ? {animation:"spin 1s linear infinite"} : {}}/>
      <span>{config.text}</span>
      {status==="error" && onRetry && (
        <button className="btn btn-ghost btn-sm" style={{flexShrink:0}} onClick={onRetry}><Icon name="refresh" size={14}/>Tentar agora</button>
      )}
    </div>
  );
}

function LoginScreen(){
  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [err,setErr] = useState("");
  const [loading,setLoading] = useState(false);

  async function handleLogin(e){
    e.preventDefault();
    setErr(""); setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error) setErr("Email ou senha inválidos.");
    setLoading(false);
  }

  return (
    <div style={{display:"flex", alignItems:"center", justifyContent:"center", height:"100vh", background:"var(--warm-white)", padding:20}}>
      <form onSubmit={handleLogin} className="card" style={{width:"100%", maxWidth:380}}>
        <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:22}}>
          <div className="brand-mark">C</div>
          <div style={{fontFamily:"Poppins", fontSize:19, fontWeight:700}}>Mari Bonetto UGC</div>
        </div>
        <Field label="Email">
          <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com"/>
        </Field>
        <Field label="Senha">
          <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"/>
        </Field>
        {err && <p style={{color:"var(--wine)", fontSize:14, marginTop:-6}}>{err}</p>}
        <button className="btn btn-primary" type="submit" disabled={loading} style={{width:"100%", justifyContent:"center", marginTop:6}}>
          {loading ? "Entrando..." : "Entrar"}
        </button>
      </form>
    </div>
  );
}

function AuthGate({children}){
  const [session, setSession] = useState(undefined); // undefined=carregando, null=deslogado, obj=logado

  useEffect(()=>{
    supabaseClient.auth.getSession().then(({data})=>setSession(data.session));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess)=>setSession(sess));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  if(session===undefined){
    return <div style={{display:"flex", alignItems:"center", justifyContent:"center", height:"100vh", fontFamily:"Poppins", fontSize:18, fontWeight:600, color:"var(--graphite-soft)"}}>Carregando...</div>;
  }
  if(!session){
    return <LoginScreen/>;
  }
  return children(session);
}

function App({session}){
  const userId = session.user.id;
  const [state, setState] = useState(initialState);
  const [loaded, setLoaded] = useState(false);
  // Dentro do painel: ?pagina=planner&so=1 abre direto numa página, sem o menu do aplicativo
  const parametros = new URLSearchParams(location.search);
  // Páginas que viraram abas do próprio painel (somem do menu do aplicativo quando ele está dentro do painel)
  const NO_PAINEL = (()=>{ try{ return window.parent !== window && window.parent.location.origin === location.origin; }catch(e){ return false; } })();
  // Cada página do aplicativo é uma aba do painel (página do aplicativo: aba do painel)
  const ABAS_DO_PAINEL = {dashboard:"dashboard", planner:"calendario", jobs:"campanhas", trafego:"trafego", followups:"followups",
    roteiros:"quadro", prospeccao:"prospeccao", candidaturas:"candidaturas", financeiro:"financeiro",
    performance:"financeiro", tiktokshop:"tiktokshop", config:"config", financeirocpf:"financeirocpf"};
  const [page, setPage] = useState(parametros.get("pagina") || "dashboard");
  const [soUma, setSoUma] = useState(parametros.get("so") === "1");
  const [ocultar, setOcultar] = useState(window.OCULTAR_VALORES);
  window.OCULTAR_VALORES = ocultar;
  // Dentro do painel, ir para uma página que é aba do painel troca a aba do painel
  function irPara(k){
    if(NO_PAINEL && k !== page && ABAS_DO_PAINEL[k]){ window.parent.postMessage({aba:ABAS_DO_PAINEL[k]}, location.origin); return; }
    setPage(k);
  }
  useEffect(()=>{
    function ouvir(e){
      if(e.origin !== location.origin || !e.data || typeof e.data !== "object" || e.data.aba) return;
      if(e.data.pagina) setPage(e.data.pagina);
      if("ocultarValores" in e.data) setOcultar(Boolean(e.data.ocultarValores));
      if("so" in e.data) setSoUma(Boolean(e.data.so));
    }
    window.addEventListener("message", ouvir);
    return ()=>window.removeEventListener("message", ouvir);
  },[]);
  const [pendingRoteiroAI, setPendingRoteiroAI] = useState(false);
  const openRoteirosAI = () => { irPara("roteiros"); setPendingRoteiroAI(true); };
  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | retrying | saved | error
  const saveTimer = useRef(null);
  const idleTimer = useRef(null);
  const bgRetryTimer = useRef(null);
  const stateRef = useRef(state);
  useEffect(()=>{ stateRef.current = state; }, [state]);

  function handleSaveStatus(status){
    setSaveStatus(status);
    if(idleTimer.current) clearTimeout(idleTimer.current);
    if(status==="saved"){
      idleTimer.current = setTimeout(()=>setSaveStatus("idle"), 2000);
      if(bgRetryTimer.current){ clearTimeout(bgRetryTimer.current); bgRetryTimer.current = null; }
    }
    if(status==="error"){
      if(bgRetryTimer.current) clearTimeout(bgRetryTimer.current);
      bgRetryTimer.current = setTimeout(()=>{
        saveData(stateRef.current, userId, handleSaveStatus);
      }, 12000);
    }
  }
  function retryNow(){
    if(bgRetryTimer.current){ clearTimeout(bgRetryTimer.current); bgRetryTimer.current = null; }
    saveData(stateRef.current, userId, handleSaveStatus);
  }

  useEffect(()=>{
    loadData(userId).then(d=>{
      let merged = d ? {...initialState, ...d} : initialState;
      merged = processRecurringJobs(merged);
      merged = syncAllJobTransacoes(merged);
      setState(merged);
      if(d) saveData(merged, userId, handleSaveStatus);
      setLoaded(true);
    });
  },[]);

  function updateState(next){
    setState(next);
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>saveData(next, userId, handleSaveStatus), 400);
  }

  if(!loaded){
    return <div style={{display:"flex", alignItems:"center", justifyContent:"center", height:"100vh", fontFamily:"Poppins", fontSize:20, fontWeight:600, color:"var(--graphite-soft)"}}>Carregando seu estúdio...</div>;
  }

  const allItems = NAV.flatMap(s=>s.items);
  const currentLabel = (allItems.find(i=>i.key===page)||{}).label || "Dashboard";

  // olho dos valores: o mesmo do topo do painel (os dois ficam sempre iguais)
  function alternarOcultar(){
    const novo = !ocultar;
    try{ localStorage.setItem("ocultarValores", novo ? "1" : "0"); }catch(e){}
    setOcultar(novo);
    if(NO_PAINEL) window.parent.postMessage({ocultarValores: novo}, location.origin);
  }
  const abrirAba = (aba) => { if(NO_PAINEL) window.parent.postMessage({aba}, location.origin); };
  // muda o estado a partir do valor mais recente (para buscas que terminam depois, como as logos)
  function mudar(fn){ const next = fn(stateRef.current); stateRef.current = next; updateState(next); }
  window.__estadoAtual = () => stateRef.current;
  const pageProps = {state, updateState, go:irPara, ocultar, alternarOcultar, abrirAba, mudar};
  let PageComp;
  switch(page){
    case "dashboard": PageComp = <Dashboard {...pageProps} openRoteirosAI={openRoteirosAI}/>; break;
    case "planner": PageComp = <Planner {...pageProps}/>; break;
    case "jobs": PageComp = <Jobs {...pageProps}/>; break;
    case "trafego": PageComp = <TrafegoPago {...pageProps}/>; break;
    case "followups": PageComp = <FollowUps {...pageProps}/>; break;
    case "roteiros": PageComp = <Roteiros {...pageProps} pendingAI={pendingRoteiroAI} clearPendingAI={()=>setPendingRoteiroAI(false)}/>; break;
    case "prospeccao": PageComp = <Prospeccao {...pageProps}/>; break;
    case "candidaturas": PageComp = <Candidaturas {...pageProps}/>; break;
    case "portfolio": PageComp = <Portfolio {...pageProps}/>; break;
    case "financeiro": PageComp = <Financeiro {...pageProps}/>; break;
    case "financeirocpf": PageComp = <FinanceiroCPF {...pageProps}/>; break;
    case "performance": PageComp = <Performance {...pageProps}/>; break;
    case "simulador": PageComp = <Simulador/>; break;
    case "organizacao": PageComp = <Organizacao {...pageProps}/>; break;
    case "tiktokshop": PageComp = <TikTokShop {...pageProps}/>; break;
    case "config": PageComp = <Configuracoes {...pageProps}/>; break;
    default: PageComp = <Dashboard {...pageProps}/>;
  }

  return (
    <div className={"app-shell" + (soUma ? " so-uma" : "") + (ocultar ? " valores-ocultos" : "")}>
      {mobileOpen && <div className="scrim" onClick={()=>setMobileOpen(false)}></div>}
      <div className={"sidebar " + (collapsed?"collapsed ":"") + (mobileOpen?"mobile-open":"")}>
        <div className="brand">
          <div className="brand-mark">C</div>
          <div className="brand-name">Mari Bonetto UGC</div>
        </div>
        <div className="nav-scroll">
          {NAV.map(sec=>({...sec, items: sec.items.filter(item=>!(NO_PAINEL && ABAS_DO_PAINEL[item.key]))})).filter(sec=>sec.items.length).map(sec=>(
            <div key={sec.section}>
              <div className="nav-section-label">{sec.section}</div>
              {sec.items.map(item=>(
                <div key={item.key} className={"nav-item "+(page===item.key?"active":"")} onClick={()=>{setPage(item.key); setMobileOpen(false);}}>
                  <Icon name={item.icon}/>
                  <span className="nav-label">{item.label}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
        <div className="sidebar-foot">
          <div className={"nav-item "+(page==="config"?"active":"")} onClick={()=>{setPage("config"); setMobileOpen(false);}}>
            <Icon name="settings"/><span className="nav-label">Configurações</span>
          </div>
          <div className="nav-item" onClick={()=>supabaseClient.auth.signOut()}>
            <Icon name="logout"/><span className="nav-label">Sair</span>
          </div>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <button className="icon-btn mobile-toggle" onClick={()=>setMobileOpen(true)}><Icon name="menu"/></button>
          <button className="icon-btn" onClick={()=>setCollapsed(c=>!c)} style={{display: window.innerWidth<860 ? "none":"flex"}}><Icon name="dock_to_right"/></button>
          <strong style={{fontFamily:"Poppins", fontSize:16, fontWeight:700}}>{currentLabel}</strong>
        </div>
        <div className="content">
          {PageComp}
        </div>
      </div>
      <SaveStatusIndicator status={saveStatus} onRetry={retryNow}/>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){ super(props); this.state = {hasError:false}; }
  static getDerivedStateFromError(){ return {hasError:true}; }
  componentDidCatch(error, info){ console.error("App error:", error, info); }
  render(){
    if(this.state.hasError){
      return (
        <div style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100vh", padding:20, textAlign:"center", fontFamily:"Poppins"}}>
          <span className="material-symbols-outlined" style={{fontSize:40, color:"var(--wine)"}}>error</span>
          <h2 style={{fontFamily:"Poppins", fontWeight:700, margin:"14px 0 6px"}}>Algo deu errado</h2>
          <p style={{color:"var(--graphite-soft)", fontSize:14, maxWidth:360}}>Ocorreu um erro inesperado nesta tela. Seus dados estão salvos. Recarregue a página para continuar.</p>
          <button className="btn btn-primary" style={{marginTop:16}} onClick={()=>window.location.reload()}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <AuthGate>{(session)=> <App session={session}/>}</AuthGate>
  </ErrorBoundary>
);
</script>
