<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestão UGC | Painel Mari Bonetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // O aplicativo só roda dentro do painel (cada página é uma aba). Aberto sozinho, volta para o painel.
  if (window.top === window.self) location.replace("../#dashboard");
</script>
<script src="../../js/banco.js?v=202610081907"></script>
<script>
  // Usa o mesmo banco e o mesmo login do painel (projeto Admin UGC)
  window.APP_CONFIG = { SUPABASE_URL: window.BANCO_URL, SUPABASE_ANON_KEY: window.BANCO_CHAVE };
</script>
<script>
  // Silencia o aviso informativo do Babel in-browser (apenas cosmético, não afeta funcionamento)
  (function(){
    const originalWarn = console.warn;
    console.warn = function(...args){
      if(args[0] && String(args[0]).includes("in-browser Babel")) return;
      originalWarn.apply(console, args);
    };
  })();
</script>
<style>
  :root{
    --graphite:#3d2b20;
    --graphite-soft:#6e5646;
    --butter:#a87058;
    --butter-soft:#ecd9c6;
    --sand:#efe5d8;
    --warm-white:#f6efe6;
    --wine:#6b4a35;
    --moss:#4f7a54;
    --line:rgba(107,74,53,.16);
    --card-bg:#fffdf9;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 2px 14px rgba(43,27,20,0.06);
    --shadow-lift:0 10px 30px rgba(43,27,20,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    font-weight:400;
    background:var(--warm-white);
    color:var(--graphite);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Poppins',sans-serif; font-weight:600; font-size:17px; }
  .material-symbols-outlined{
    font-variation-settings: 'FILL' 0, 'wght' 250, 'GRAD' -25, 'opsz' 22;
    font-weight:300;
  }
  #root{min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .app-shell{ display:flex; min-height:100vh; }

  /* SIDEBAR */
  .sidebar{
    width:250px; flex-shrink:0; background:var(--sand); color:var(--graphite); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
    transition:width .2s ease, padding .2s ease;
  }
  .sidebar.collapsed{ width:74px; padding:22px 10px; }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 8px 22px 8px; }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--butter),var(--wine));
    display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;color:#fff;flex-shrink:0;
  }
  .brand-name{ font-family:'Poppins',sans-serif; font-size:19px; font-weight:700; white-space:nowrap; overflow:hidden; }
  .sidebar.collapsed .brand-name, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-section-label{ display:none; }

  .nav-scroll{ flex:1; overflow-y:auto; margin:0 -4px; padding:0 4px;}
  .nav-section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:#a89890; margin:16px 10px 6px; }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:11px; cursor:pointer;
    color:var(--graphite-soft); font-size:14.5px; font-weight:500; margin-bottom:2px; white-space:nowrap; overflow:hidden;
    transition:background .15s, color .15s;
  }
  .nav-item:hover{ background:rgba(107,74,53,0.08); color:var(--graphite); }
  .nav-item.active{ background:var(--butter); color:#fff; font-weight:600; }
  .nav-item .material-symbols-outlined{ font-size:20px; flex-shrink:0; }
  .sidebar-foot{ border-top:1px solid var(--line); padding-top:12px; margin-top:10px; }

  /* MAIN */
  .main{ flex:1; min-width:0; }
  .so-uma .sidebar, .so-uma .topbar, .so-uma .scrim{ display:none !important; }
  .so-uma .content{ max-width:none; }
  /* ===== DASHBOARD (board novo) =====
     Mesmo jeito das outras telas do painel: Poppins 13px, linhas finas,
     e só as cores do portfólio (creme, papel, café, café claro, verde, vermelho). */
  .db{ --db-creme:#f6efe6; --db-papel:#fffdf9; --db-bege:#efe5d8; --db-cafe:#6b4a35; --db-cafe2:#8a634b; --db-verde:#4f7a54; --db-vermelho:#c5533f;
    --db-texto:#3d2b20; --db-suave:#6e5646; --db-linha:rgba(107,74,53,.14); --db-linha2:rgba(107,74,53,.24);
    display:flex; flex-direction:column; gap:16px; color:var(--db-texto); font-size:13px; line-height:1.5; }
  .db button{ font-family:inherit; color:inherit; font-size:inherit; }
  .db .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20; }
  .db h2{ display:flex; align-items:center; gap:8px; margin:0; font-size:14px; font-weight:600; }
  .db h2 small{ font-size:12px; font-weight:400; color:var(--db-suave); margin-left:2px; }
  .db-bloco{ background:var(--db-papel); border:1px solid var(--db-linha); border-radius:14px; padding:16px; min-width:0; }
  .db-bloco-topo{ display:flex; align-items:center; justify-content:space-between; gap:6px 10px; flex-wrap:wrap; margin-bottom:12px; }
  .db-link{ display:inline-flex; align-items:center; gap:3px; border:0; background:none; cursor:pointer; font-size:12px !important; color:var(--db-suave) !important; padding:0; }
  .db-link:hover{ color:var(--db-cafe) !important; }
  .db-link .material-symbols-outlined{ font-size:15px !important; }
  .db-link:disabled{ opacity:.55; cursor:default; }
  .db-vazio{ color:var(--db-suave); font-size:12.5px; margin:4px 0; }
  .db-dica{ font-size:12px; color:var(--db-suave); margin:0 0 10px; line-height:1.5; }
  .db-dica .db-link{ text-decoration:underline; text-underline-offset:2px; }
  .db-dica-erro{ color:var(--db-vermelho); }

  /* ícones finos */
  .db-ic{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; color:var(--db-suave); }

  /* cabeçalho */
  .db-cabeca{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .db-ola h1{ font-size:18px; font-weight:600; margin:0; line-height:1.3; }
  .db-ola p{ margin:1px 0 0; color:var(--db-suave); font-size:12.5px; }
  .db-acoes{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .db-busca{ position:relative; display:flex; align-items:center; gap:6px; width:260px; max-width:100%; height:34px; padding:0 12px; border-radius:999px; background:var(--db-papel); border:1px solid var(--db-linha2); color:var(--db-suave); }
  .db-busca .material-symbols-outlined{ font-size:17px !important; }
  .db-busca input{ flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:12.5px; color:var(--db-texto); }
  .db-redondo{ position:relative; width:34px; height:34px; border-radius:50%; border:1px solid var(--db-linha2); background:var(--db-papel); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--db-suave) !important; }
  .db-redondo .material-symbols-outlined{ font-size:18px !important; }
  .db-redondo:hover{ background:var(--db-bege); }
  .db-ponto{ position:absolute; top:7px; right:8px; width:6px; height:6px; border-radius:50%; background:var(--db-vermelho); }
  .db-btn-escuro{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 16px; border-radius:999px; border:1px solid var(--db-cafe); background:var(--db-cafe); color:#fffdf9 !important; font-size:12.5px !important; font-weight:500; cursor:pointer; white-space:nowrap; }
  .db-btn-escuro:hover{ background:var(--db-cafe2); border-color:var(--db-cafe2); }
  .db-btn-escuro .material-symbols-outlined{ font-size:17px !important; }
  .db-sino-caixa{ position:relative; }
  .db-pop{ position:absolute; z-index:20; top:calc(100% + 6px); right:0; width:280px; max-width:86vw; background:var(--db-papel); border:1px solid var(--db-linha); border-radius:12px; box-shadow:0 10px 26px rgba(61,43,32,.10); padding:6px; }
  .db-pop-busca{ left:0; right:auto; width:100%; min-width:240px; }
  .db-pop button{ display:block; width:100%; text-align:left; border:0; background:none; padding:7px 9px; border-radius:8px; cursor:pointer; }
  .db-pop button:hover{ background:var(--db-creme); }
  .db-pop b{ display:block; font-size:12.5px; font-weight:500; }
  .db-pop small{ display:block; font-size:11.5px; color:var(--db-suave); }
  .db-pop-titulo{ padding:4px 9px; font-weight:600; }

  /* números (uma faixa só, igual à aba Portfólio) */
  .db-cartoes{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--db-papel); border:1px solid var(--db-linha); border-radius:14px; overflow:hidden; }
  .db-cartao{ display:block; text-align:left; background:none; border:0; border-left:1px solid var(--db-linha); padding:14px 16px; cursor:pointer; min-width:0; }
  .db-cartao:first-child{ border-left:0; }
  .db-cartao:hover{ background:#fbf6ef; }
  .db-cartao-txt{ display:flex; flex-direction:column; }
  .db-cartao-txt span{ order:1; font-size:12px; color:var(--db-suave); }
  .db-cartao-txt b{ order:2; font-size:18px; font-weight:600; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .db-cartao-txt small{ order:3; font-size:11.5px; color:var(--db-suave); margin-top:4px; }

  /* linhas */
  .db-linha{ display:grid; gap:16px; }
  .db-linha-1{ grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); }
  .db-linha-2{ grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); }
  .db-linha-3{ grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); }

  /* minha prioridade */
  .db-prioridade h2{ margin-bottom:14px; }
  .db-prio-corpo{ display:flex; gap:18px; align-items:stretch; flex-wrap:wrap; }
  .db-prio-info{ flex:1; min-width:180px; display:flex; flex-direction:column; gap:9px; }
  .db-prio-nome{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:2px; }
  .db-prio-nome b{ font-size:15px; font-weight:600; }
  .db-selo{ background:var(--db-bege); color:var(--db-cafe); font-size:11px; font-weight:500; padding:2px 9px; border-radius:999px; }
  .db-check{ display:flex; align-items:center; gap:10px; cursor:pointer; font-size:13px; min-width:0; }
  .db-check input{ position:absolute; opacity:0; width:1px; height:1px; }
  .db-caixinha{ width:16px; height:16px; border-radius:4px; border:1.4px solid var(--db-linha2); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--db-papel); }
  .db-caixinha .material-symbols-outlined{ font-size:13px !important; opacity:0; color:#fffdf9; font-variation-settings:'wght' 600 !important; }
  .db-check.ok .db-caixinha, .db-tarefa.ok .db-caixinha{ background:var(--db-cafe); border-color:var(--db-cafe); }
  .db-check.ok .db-caixinha .material-symbols-outlined, .db-tarefa.ok .db-caixinha .material-symbols-outlined{ opacity:1; }
  .db-check.ok{ color:var(--db-suave); }
  .db-check input:focus-visible + .db-caixinha{ outline:2px solid var(--db-cafe2); outline-offset:2px; }
  .db-prio-prazo{ display:flex; flex-direction:column; gap:3px; padding-left:18px; border-left:1px solid var(--db-linha); min-width:170px; }
  .db-prio-prazo small{ font-size:12px; color:var(--db-suave); }
  .db-prio-prazo b{ display:flex; align-items:center; gap:6px; font-size:15px; font-weight:600; }
  .db-prio-prazo b .material-symbols-outlined{ font-size:17px !important; color:var(--db-suave); }
  .db-prio-prazo > span{ font-size:12px; color:var(--db-suave); }
  .db-prio-prazo .db-btn-escuro{ margin-top:auto; align-self:flex-start; }

  /* logos das marcas */
  .db-logo{ width:34px; height:34px; border-radius:9px; background:#fff; border:1px solid var(--db-linha); display:inline-flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
  .db-logo img{ width:70%; height:70%; object-fit:contain; }
  .db-logo-vazio{ background:var(--db-creme); }
  .db-logo-vazio .db-ic{ width:15px; height:15px; }

  /* hoje */
  .db-tarefa{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--db-linha); }
  .db-tarefa:first-of-type{ border-top:0; padding-top:2px; }
  .db-tarefa .db-check{ flex:1; }
  .db-tarefa-txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .db-tarefa.ok .db-tarefa-txt{ text-decoration:line-through; }
  .db-seta{ border:0; background:none; cursor:pointer; padding:0; display:inline-flex; color:var(--db-suave) !important; }
  .db-seta .material-symbols-outlined{ font-size:18px !important; }
  .db-tag{ font-size:11px; padding:2px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
  .db-tag-amarelo{ background:rgba(168,112,88,.13); color:var(--db-cafe); }
  .db-tag-vermelho{ background:#f6e0dc; color:var(--db-vermelho); }
  .db-tag-verde{ background:#e4eee2; color:var(--db-verde); }
  .db-tag-cinza{ background:var(--db-bege); color:var(--db-suave); }

  /* meus jobs */
  .db-abas{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .db-abas button{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--db-linha); background:var(--db-papel); padding:4px 12px; border-radius:999px; cursor:pointer; font-size:12px !important; color:var(--db-suave) !important; }
  .db-abas button span{ font-size:11px; color:var(--db-suave); }
  .db-abas button.ativa{ background:var(--db-cafe); border-color:var(--db-cafe); color:#fffdf9 !important; }
  .db-abas button.ativa span{ color:rgba(255,253,249,.75); }
  .db-job{ width:100%; display:grid; grid-template-columns:auto minmax(90px,.8fr) minmax(270px,2.2fr) auto; align-items:center; gap:14px; text-align:left; border:0; border-top:1px solid var(--db-linha); background:none; padding:12px 2px; cursor:pointer; }
  .db-job:first-of-type{ border-top:0; }
  .db-job:hover{ background:#fbf6ef; }
  .db-job-nome{ display:flex; flex-direction:column; min-width:0; }
  .db-job-nome b{ font-size:13px; font-weight:500; line-height:1.3; overflow-wrap:anywhere; }
  .db-job-nome small{ font-size:11.5px; color:var(--db-suave); }
  .db-etapas{ display:grid; grid-template-columns:repeat(5,1fr); }
  .db-etapa{ position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .db-etapa::before{ content:""; position:absolute; top:4px; left:-50%; width:100%; height:1px; background:var(--db-linha2); }
  .db-etapa:first-child::before{ display:none; }
  .db-etapa.feita::before{ background:var(--db-cafe); }
  .db-etapa i{ position:relative; z-index:1; width:9px; height:9px; border-radius:50%; border:1px solid var(--db-linha2); background:var(--db-papel); }
  .db-etapa.feita i{ border-color:var(--db-cafe); background:var(--db-cafe); }
  .db-etapa.atual i{ box-shadow:0 0 0 3px rgba(107,74,53,.15); }
  .db-etapa small{ font-size:10.5px; color:var(--db-suave); white-space:nowrap; }
  .db-job-prazo{ display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:92px; }
  .db-job-prazo small{ font-size:11px; color:var(--db-suave); }
  .db-job-prazo b{ font-size:13px; font-weight:500; }
  .db-pilula{ margin-top:3px; background:var(--db-bege); color:var(--db-suave); font-size:11px; padding:1px 8px; border-radius:999px; }

  /* calendário da semana */
  .db-semana{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; border-bottom:1px solid var(--db-linha); padding-bottom:8px; }
  .db-semana button{ position:relative; border:0; background:none; border-radius:10px; padding:6px 0 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .db-semana small{ font-size:10.5px; color:var(--db-suave); letter-spacing:.04em; }
  .db-semana b{ font-size:14px; font-weight:400; }
  .db-semana button:hover{ background:var(--db-creme); }
  .db-semana button.sel{ background:var(--db-bege); }
  .db-semana button.hoje b{ font-weight:600; color:var(--db-cafe); }
  .db-semana button i{ position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:var(--db-cafe2); }
  .db-agenda{ margin-top:4px; }
  .db-agenda-item{ width:100%; display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:10px; border:0; border-bottom:1px solid var(--db-linha); background:none; padding:9px 0; text-align:left; cursor:pointer; }
  .db-agenda-item:last-child{ border-bottom:0; }
  .db-agenda-quando{ font-size:11.5px; color:var(--db-suave); }
  .db-agenda-txt{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ideias rápidas */
  .db-topo-acoes{ display:inline-flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .db-ideias{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .db-ideias.carregando{ opacity:.55; pointer-events:none; }
  .db-ideia{ display:flex; gap:10px; align-items:stretch; border:1px solid var(--db-linha); background:var(--db-papel); border-radius:12px; padding:7px; text-align:left; cursor:pointer; min-width:0; }
  .db-ideia:hover{ background:#fbf6ef; }
  .db-ideia img{ width:54px; height:66px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .db-ideia span{ display:flex; flex-direction:column; gap:2px; min-width:0; padding:2px 0; }
  .db-ideia b{ font-size:12.5px; font-weight:500; }
  .db-ideia small{ font-size:11.5px; color:var(--db-suave); line-height:1.4; }
  .db-ideia em{ font-style:normal; font-size:11px; color:var(--db-cafe2); }
  .db-ideia .material-symbols-outlined{ display:none; }
  .db-ideia-detalhe small{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--db-suave); margin-top:12px; }
  .db-ideia-detalhe p, .db-ideia-detalhe ol{ margin:3px 0 0; font-size:13.5px; line-height:1.55; }
  .db-ideia-detalhe ol{ padding-left:18px; }
  .db-gancho{ font-style:italic; }
  .db-ideia-detalhe .db-btn-escuro{ margin-top:18px; }
  .db-ideias-lista{ display:flex; flex-direction:column; gap:6px; }
  .db-ideias-lista button{ text-align:left; border:1px solid var(--db-linha); background:var(--db-papel); border-radius:10px; padding:10px 12px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:1px; }
  .db-ideias-lista b{ font-size:13px; font-weight:500; } .db-ideias-lista small{ font-size:12px; color:var(--db-suave); } .db-ideias-lista em{ font-style:normal; font-size:11px; color:var(--db-cafe2); }
  .db-conc-form{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .db-conc-form select, .db-conc-form input{ height:34px; border-radius:10px; border:1px solid var(--db-linha2); padding:0 10px; font:inherit; font-size:13px; background:var(--db-papel); }
  .db-conc-form input{ flex:1; min-width:160px; }
  .db-conc-lista{ display:flex; flex-direction:column; margin-bottom:10px; }
  .db-conc{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--db-linha); }
  .db-conc a{ flex:1; color:inherit; font-size:13px; }
  .db-conc button{ border:0; background:none; cursor:pointer; color:var(--db-suave); display:inline-flex; }

  /* ferramentas */

const supabaseClient = window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);

async function loadData(userId){
  try{
    const { data, error } = await supabaseClient
      .from("app_state")
      .select("data")
      .eq("user_id", userId)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data) return data.data;
  }catch(e){ console.error("Erro ao carregar dados:", e); }
  return null;
}
async function saveData(data, userId, onStatus){
  const maxRetries = 7;
  for(let attempt=0; attempt<=maxRetries; attempt++){
    try{
      if(onStatus) onStatus(attempt===0 ? "saving" : "retrying");
      const { error } = await supabaseClient
        .from("app_state")
        .upsert({ user_id: userId, data, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
      if(error) throw error;
      if(onStatus) onStatus("saved");
      return true;
    }catch(e){
      console.error("Erro ao salvar (tentativa "+(attempt+1)+"):", e);
      if(attempt===maxRetries){
        if(onStatus) onStatus("error");
        return false;
      }
      await new Promise(r=>setTimeout(r, Math.min(8000, 500*Math.pow(2,attempt))));
    }
  }
}

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e2){
      return false;
    }
  }
}

function syncFollowups(followups, job){
  followups = followups || [];
  if(job.status !== "Conteúdo Entregue" && job.status !== "Finalizado") return followups;
  const exists = followups.some(f=>f.jobId===job.id);
  if(exists) return followups;
  return [...followups, {
    id:uid(), jobId:job.id, marca:job.marca, tipo:job.tipo||"",
    dataEntrega: job.dataEntregaReal || todayISO(), status:"Pendente", notas:"", criadoEm:todayISO()
  }];
}

function syncTransacaoFromJob(transacoes, job){
  transacoes = [...(transacoes||[])];
  const idx = transacoes.findIndex(t=>t.jobId===job.id && t.origem==="job");
  const semValor = job.tipoJob==="Permuta" || !job.valor || Number(job.valor)<=0;
  if(semValor || job.status==="Cancelado"){
    if(idx>=0) transacoes.splice(idx,1);
    return transacoes;
  }
  const item = {
    id: idx>=0 ? transacoes[idx].id : uid(),
    tipo:"receita",
    descricao: `${job.marca}${job.tipo ? " - "+job.tipo : ""}`,
    valor: job.valor, moeda: job.moeda||"BRL",
    data: (job.pagamento && job.pagamento.dataPagamento) || (job.pagamento && job.pagamento.dataPrevista) || job.dataPagamento || job.prazoEntrega || todayISO(),
    status: (job.pagamento && job.pagamento.status==="Pago") ? "Confirmado" : "Pendente",
    jobId: job.id, origem:"job"
  };
  if(idx>=0) transacoes[idx] = item; else transacoes.push(item);
  return transacoes;
}

function syncAllJobTransacoes(state){
  let transacoes = [...state.transacoes];
  state.jobs.forEach(job=>{ transacoes = syncTransacaoFromJob(transacoes, job); });
  return {...state, transacoes};
}

function processRecurringJobs(state){
  const today = todayISO();
  let jobs = [...state.jobs];
  let transacoes = [...state.transacoes];
  let changed = false;
  const novosJobs = [];

  jobs = jobs.map(j=>{
    if(!j.recorrente || !j.recorrencia || !j.recorrencia.proximaCriacao) return j;
    if(j.recorrencia.proximaCriacao > today) return j;
    if(j.recorrencia.encerrarEm && j.recorrencia.proximaCriacao > j.recorrencia.encerrarEm) return j;
    changed = true;
    const clone = {
      ...j, id:uid(), criadoEm: today, status:"Lead",
      prazoEntrega: j.recorrencia.proximaCriacao, dataEntregaReal:"",
      entregaveis: resetEntregaveisConcluido(j.entregaveis || emptyEntregaveis()),
      pagamento: {...(j.pagamento||{}), status:"Em aberto", dataPagamento:""},
      recorrente:false
    };
    novosJobs.push(clone);
    if(j.recorrencia.gerarReceita && j.tipoJob!=="Permuta"){
      transacoes.push({id:uid(), tipo:"receita", descricao:`${j.marca} - job recorrente`, valor:j.valor, moeda:j.moeda||"BRL", data:j.recorrencia.proximaCriacao, status:"Pendente", jobId:j.id});
    }
    const proxima = new Date(j.recorrencia.proximaCriacao+"T00:00:00");
    proxima.setDate(proxima.getDate() + Number(j.recorrencia.intervaloDias||30));
    const proximaISO = proxima.toISOString().slice(0,10);
    const aindaAtivo = !j.recorrencia.encerrarEm || proximaISO <= j.recorrencia.encerrarEm;
    return {...j, recorrencia:{...j.recorrencia, proximaCriacao: aindaAtivo ? proximaISO : ""}, recorrente: aindaAtivo};
  });

  if(!changed) return state;
  return {...state, jobs:[...jobs, ...novosJobs], transacoes};
}

function DonutChart({data, size}){
  size = size || 120;
  const total = data.reduce((a,b)=>a+b.value,0);
  const r = size/2 - 10;
  const cx = size/2, cy = size/2;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {total===0 ? (
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--line)" strokeWidth="14"/>
      ) : data.map((d,i)=>{
        const frac = d.value/total;
        const dash = frac*circumference;
        const el = (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth="14"
            strokeDasharray={`${dash} ${circumference-dash}`} strokeDashoffset={-offset}
            transform={`rotate(-90 ${cx} ${cy})`} strokeLinecap="butt"/>
        );
        offset += dash;
        return el;
      })}
    </svg>
  );
}

function LineChart({data, width, height}){
  width = width || 400; height = height || 220;
  const padL = 34, padR = 14, padT = 14, padB = 26;
  const w = width - padL - padR, h = height - padT - padB;
  const maxRaw = Math.max(...data.map(d=>d.value), 1);
  const niceMax = maxRaw<=3 ? Math.max(3, Math.ceil(maxRaw)) : Math.ceil(maxRaw*1.15);
  const ticks = [0, niceMax*0.25, niceMax*0.5, niceMax*0.75, niceMax];
  const n = data.length;
  const stepX = n>1 ? w/(n-1) : 0;
  const pts = data.map((d,i)=>({
    x: padL + i*stepX,
    y: padT + h - (d.value/niceMax)*h
  }));
  function smoothPath(points){
    if(points.length<2) return "";
    let d = `M ${points[0].x} ${points[0].y}`;
    for(let i=0;i<points.length-1;i++){
      const p0 = points[i], p1 = points[i+1];
      const midX = (p0.x+p1.x)/2;
      d += ` C ${midX} ${p0.y}, ${midX} ${p1.y}, ${p1.x} ${p1.y}`;
    }
    return d;
  }
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{overflow:"visible"}}>
      {ticks.map((t,i)=>{
        const y = padT + h - (t/niceMax)*h;
        return (
          <g key={i}>
            <line x1={padL} y1={y} x2={width-padR} y2={y} stroke="var(--line)" strokeDasharray="3 4" strokeWidth="1"/>
            <text x={padL-8} y={y+4} fontSize="10.5" textAnchor="end" fill="var(--graphite-soft)">{Number.isInteger(t) ? t : t.toFixed(2)}</text>
          </g>
        );
      })}
      <path d={smoothPath(pts)} fill="none" stroke="var(--wine)" strokeWidth="2.5"/>
      {pts.map((p,i)=>(
        <circle key={i} cx={p.x} cy={p.y} r="4" fill="var(--card-bg)" stroke="var(--wine)" strokeWidth="2"/>
      ))}
      {data.map((d,i)=>(
        <text key={i} x={padL+i*stepX} y={height-6} fontSize="10.5" textAnchor="middle" fill="var(--graphite-soft)">{d.label}</text>
      ))}
    </svg>
  );
}

  const ativos = jobs.filter(j=>!JOB_FINISHED.includes(j.status));

  // ----- cartões do topo -----
  const andamento = ativos.filter(j=>!["Aguardando Aprovação","Conteúdo Entregue"].includes(j.status));
  const precisaAtencao = ativos.filter(j=>!j.prazoEntrega || diasAte(j.prazoEntrega)<=3 || (j.dataPagamento && diasAte(j.dataPagamento)<0 && (!j.pagamento || j.pagamento.status!=="Pago"))).length;
  const inicioSemana = new Date(hojeD); inicioSemana.setDate(hojeD.getDate() - ((hojeD.getDay()+6)%7));
  const diasDaSemana = Array.from({length:7}, (_,i)=>{ const d = new Date(inicioSemana); d.setDate(inicioSemana.getDate()+i); return d; });
  const fimSemanaIso = isoLocal(diasDaSemana[6]), inicioSemanaIso = isoLocal(diasDaSemana[0]);
  const entregasSemana = ativos.filter(j=>j.prazoEntrega && j.prazoEntrega>=inicioSemanaIso && j.prazoEntrega<=fimSemanaIso);
  const aReceberLista = (state.transacoes||[]).filter(t=>t.tipo==="receita" && t.status!=="Confirmado" && (t.moeda||"BRL")==="BRL");
  const aReceber = aReceberLista.reduce((a,t)=>a+Number(t.valor||0),0);
  const proximos = ativos.filter(j=>j.prazoEntrega && diasAte(j.prazoEntrega)>=0).sort((a,b)=>a.prazoEntrega.localeCompare(b.prazoEntrega));
  const proximoPrazo = proximos[0];

  // ----- minha prioridade -----
  const prioridade = proximos[0] || andamento[0] || ativos[0] || null;
  const PASSOS = [["gravar","Gravar vídeos"],["editar","Editar"],["enviar","Enviar para aprovação"]];
  function marcarPasso(job, chave){
    const passos = {...(job.passosDashboard||{}), [chave]: !(job.passosDashboard||{})[chave]};
    updateState({...state, jobs: jobs.map(j=>j.id===job.id ? {...j, passosDashboard: passos} : j)});
  }

  // ----- hoje -----
  const itensDoDia = (iso) => {
    const lista = [];
    planner.filter(p=>p.data===iso).forEach(p=>lista.push({id:"p-"+p.id, texto:p.titulo||"Conteúdo", sub:p.formato||p.plataforma||"", tag: p.status==="Planejado" ? "Planejamento" : p.status==="Gravado" ? "Edição" : (p.status||"Geral"), pagina:"planner"}));
    ativos.filter(j=>j.prazoEntrega===iso).forEach(j=>lista.push({id:"e-"+j.id, texto:`Entregar conteúdo de ${j.marca}`, sub:"Prazo", tag: iso===hoje ? "Urgente" : "Entrega", pagina:"jobs"}));
    jobs.filter(j=>j.dataPagamento===iso && j.status!=="Cancelado" && (!j.pagamento || j.pagamento.status!=="Pago")).forEach(j=>lista.push({id:"g-"+j.id, texto:`Conferir pagamento ${j.marca}`, sub:"Pagto", tag:"Financeiro", pagina:"financeiro"}));
    return lista;
  };
  const tarefasHoje = [
    ...itensDoDia(hoje),
    ...followups.filter(f=>f.status==="Pendente" && f.dataEntrega && f.dataEntrega<=hoje).map(f=>({id:"f-"+f.id, texto:`Fazer follow-up com ${f.marca}`, tag:"Comunicação", pagina:"followups"})),
  ];
  const feitos = state.dashFeitos || {};
  function marcarTarefa(id){
    const chave = hoje+"|"+id;
    const novo = {};
    Object.keys(feitos).forEach(k=>{ if(k.startsWith(hoje+"|")) novo[k] = feitos[k]; }); // só guarda o dia de hoje
    novo[chave] = !feitos[chave];
    updateState({...state, dashFeitos: novo});
  }

  // ----- meus jobs -----
  const [abaJobs,setAbaJobs] = useState("andamento");
  const gruposJobs = {
    andamento: andamento,
    aguardando: jobs.filter(j=>j.status==="Aguardando Aprovação"),
    concluidos: jobs.filter(j=>["Conteúdo Entregue","Finalizado"].includes(j.status)),
  };
  const listaJobs = [...gruposJobs[abaJobs]].sort((a,b)=>(a.prazoEntrega||"9999").localeCompare(b.prazoEntrega||"9999")).slice(0,3);
  const descricaoJob = (j) => {
    const e = j.entregaveis || {};
    const partes = [];
    const nv = (e.videos||[]).length, nf = (e.fotos||[]).length, ns = (e.stories||[]).length;
    if(nv) partes.push(`${nv} vídeo${nv>1?"s":""}`);
    if(nf) partes.push(`${nf} foto${nf>1?"s":""}`);
    if(ns) partes.push(`${ns} stories`);
    if(j.tipo) partes.push(j.tipo);
    return partes.join(" • ") || (j.categoria || "Job");
  };

  // ----- calendário da semana -----
  const [diaSel,setDiaSel] = useState(hoje);
  const itensDiaSel = itensDoDia(diaSel);

  // ----- busca e alertas -----
  const [busca,setBusca] = useState("");
  const [sinoAberto,setSinoAberto] = useState(false);
  const termo = busca.trim().toLowerCase();
  const resultados = !termo ? [] : [
    ...jobs.filter(j=>(j.marca||"").toLowerCase().includes(termo)).map(j=>({id:"j"+j.id, texto:j.marca, sub:"Job • "+j.status, pagina:"jobs"})),
    ...planner.filter(p=>(p.titulo||"").toLowerCase().includes(termo) || (p.marca||"").toLowerCase().includes(termo)).map(p=>({id:"p"+p.id, texto:p.titulo, sub:"Planner • "+dataBR(p.data), pagina:"planner"})),
    ...(state.prospeccoes||[]).filter(p=>(p.marca||"").toLowerCase().includes(termo)).map(p=>({id:"r"+p.id, texto:p.marca, sub:"Prospecção • "+(p.status||""), pagina:"prospeccao"})),
  ].slice(0,7);
  const alertas = [];
  proximos.filter(j=>diasAte(j.prazoEntrega)<=3).forEach(j=>alertas.push({titulo:"Prazo chegando", texto:`${j.marca} vence ${diasAte(j.prazoEntrega)===0?"hoje":"em "+diasAte(j.prazoEntrega)+" dia(s)"}.`, pagina:"jobs"}));
  jobs.filter(j=>j.dataPagamento && diasAte(j.dataPagamento)<0 && j.status!=="Cancelado" && (!j.pagamento || j.pagamento.status!=="Pago")).forEach(j=>alertas.push({titulo:"Pagamento atrasado", texto:`${j.marca} (${fmtMoneyCur(j.valor,j.moeda)})`, pagina:"financeiro"}));
  const semPrazo = ativos.filter(j=>!j.prazoEntrega).length;
  if(semPrazo) alertas.push({titulo:"Prazo indefinido", texto:`${semPrazo} job(s) sem prazo de entrega.`, pagina:"jobs"});

  function novaCampanha(){ window.__abrirNovoJob = true; go("jobs"); }

  // ----- logos das marcas: descobre sozinho pelo nome (uma vez por marca) -----
  const logos = state.logosMarcas || {};
  useEffect(()=>{
    const semanaAtras = Date.now() - 7*86400000;
    const faltando = [...new Set(jobs.filter(j=>j.status!=="Cancelado" && j.marca).map(j=>chaveMarca(j.marca)))]
      .filter(k=>{ const i = logos[k]; return !i || i.v!==2 || (!i.logo && (i.tentadoEm||0) < semanaAtras); }).slice(0,5);
    if(!faltando.length || !mudar) return;
    let parar = false;
    (async ()=>{
      for(const k of faltando){
        if(parar) return;
        const marca = (jobs.find(j=>chaveMarca(j.marca)===k)||{}).marca || k;
        let info = null;
        try{
          const { data, error } = await supabaseClient.functions.invoke("assistente-ugc", {body:{acao:"logo", marca}});
          if(!error && data && !data.erro) info = {logo:data.logo||null, dominio:data.dominio||null, tentadoEm:Date.now(), v:2};
        }catch(e){ /* erro do servidor: tenta de novo na próxima vez que abrir */ }
        if(info) mudar(s=>({...s, logosMarcas:{...(s.logosMarcas||{}), [k]:info}}));
      }
    })();
    return ()=>{ parar = true; };
  }, [jobs.map(j=>j.marca).join("|")]);

  // ----- ideias rápidas a partir dos concorrentes -----
  const concorrentes = state.concorrentes || [];
  const ideiasSalvas = state.ideiasRapidas || null;
  const [gerandoIdeias,setGerandoIdeias] = useState(false);
  const [erroIdeias,setErroIdeias] = useState("");
  const [ideiaAberta,setIdeiaAberta] = useState(null);
  const [verTodasIdeias,setVerTodasIdeias] = useState(false);
  const [editandoConc,setEditandoConc] = useState(false);
  async function gerarIdeias(){
    if(gerandoIdeias) return;
    setGerandoIdeias(true); setErroIdeias("");
    try{
      const nichos = [...new Set(jobs.map(j=>j.nicho).filter(Boolean))];
      const { data, error } = await supabaseClient.functions.invoke("assistente-ugc", {body:{acao:"ideias", concorrentes: (stateAtual().concorrentes||[]), nichos}});
      if(error || !data || !Array.isArray(data.ideias) || !data.ideias.length) throw new Error((data && data.erro) || "sem ideias");
      mudar(s=>({...s, ideiasRapidas:{geradoEm:Date.now(), itens:data.ideias, referencias:data.referencias||0}}));
    }catch(e){ setErroIdeias("Não consegui buscar ideias agora. Tente de novo em instantes."); }
    setGerandoIdeias(false);
  }
  const stateAtual = () => window.__estadoAtual ? window.__estadoAtual() : state;
  useEffect(()=>{
    const velhas = !ideiasSalvas || (Date.now() - (ideiasSalvas.geradoEm||0)) > 3*86400000;
    if(concorrentes.length && velhas) gerarIdeias();
  }, [concorrentes.length]);
  const ideias = (ideiasSalvas && ideiasSalvas.itens && ideiasSalvas.itens.length)
    ? ideiasSalvas.itens
    : IDEIAS_RAPIDAS.map(i=>({titulo:i.titulo, descricao:i.texto, gancho:"", passos:[], formato:"", inspirado_em:"", link:""}));
  function criarRoteiro(ideia){
    const conteudo = [
      ideia.gancho ? "GANCHO:\n" + ideia.gancho : "",
      ideia.passos && ideia.passos.length ? "DESENVOLVIMENTO:\n" + ideia.passos.map(p=>"- "+p).join("\n") : "",
      ideia.inspirado_em ? "INSPIRAÇÃO: " + ideia.inspirado_em + (ideia.link ? " (" + ideia.link + ")" : "") : "",
    ].filter(Boolean).join("\n\n");
    mudar(s=>({...s, roteiros:[{id:uid(), titulo:ideia.titulo, plataforma:"Instagram", status:"Em aberto", finalidade:"Conteúdos", etapa:"Ideias", dataPublicacao:"", conteudo}, ...(s.roteiros||[])]}));
    setIdeiaAberta(null); setVerTodasIdeias(false);
    go("roteiros");
  }
  function salvarConcorrentes(lista){ mudar(s=>({...s, concorrentes:lista})); }

  const FERRAMENTAS = [
    {icone:"auto_awesome", texto:"Gerar roteiro com IA", acao:()=>openRoteirosAI && openRoteirosAI()},
    {icone:"fact_check", texto:"Checklist de gravação", acao:()=>abrirAba && abrirAba("checklist")},
    {icone:"subject", texto:"Templates de legendas", acao:()=>go("roteiros")},
    {icone:"bolt", texto:"Ideias de hooks", acao:()=>go("roteiros")},
    {icone:"music_note", texto:"Banco de sons (Trending)", acao:()=>window.open("https://ads.tiktok.com/business/creativecenter/inspiration/popular/music/pc/pt", "_blank", "noopener")},
    {icone:"description", texto:"Modelos de propostas", acao:()=>go("prospeccao")},
  ];

  return (
    <div className="db">
      {/* cabeçalho */}
      <div className="db-cabeca">
        <div className="db-ola">
          <div>
            <h1>{saudacao}, {nome}!</h1>
            <p>Vamos criar conteúdos incríveis hoje?</p>
          </div>
        </div>
        <div className="db-acoes">
          <div className="db-busca">
            <Icon name="search" size={19}/>
            <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar campanha, marca ou conteúdo..." aria-label="Buscar"/>
            {termo && <div className="db-pop db-pop-busca">
              {resultados.length ? resultados.map(r=><button key={r.id} onClick={()=>{setBusca(""); go(r.pagina);}}><b>{r.texto}</b><small>{r.sub}</small></button>)
                : <p className="db-vazio">Nada encontrado.</p>}
            </div>}
          </div>
          {alternarOcultar && <button className="db-redondo" onClick={alternarOcultar} aria-pressed={ocultar} title={ocultar ? "Mostrar valores" : "Ocultar valores"} aria-label={ocultar ? "Mostrar valores" : "Ocultar valores"}><Icon name={ocultar ? "visibility_off" : "visibility"} size={20}/></button>}
          <div className="db-sino-caixa">
            <button className="db-redondo" onClick={()=>setSinoAberto(a=>!a)} aria-label="Alertas"><Icon name="notifications" size={20}/>{alertas.length>0 && <span className="db-ponto"/>}</button>
            {sinoAberto && <div className="db-pop db-pop-sino">
              <b className="db-pop-titulo">Alertas</b>
              {alertas.length ? alertas.map((a,i)=><button key={i} onClick={()=>{setSinoAberto(false); go(a.pagina);}}><b>{a.titulo}</b><small>{a.texto}</small></button>)
                : <p className="db-vazio">Tudo em ordem por aqui!</p>}
            </div>}
          </div>
          <button className="db-btn-escuro" onClick={novaCampanha}><Icon name="add" size={20}/>Nova campanha</button>
        </div>
      </div>

      {/* cartões */}
      <div className="db-cartoes">
        <button className="db-cartao" onClick={()=>go("jobs")}>
          <span className="db-cartao-txt"><b>{andamento.length}</b><span>Jobs em andamento</span><small>{precisaAtencao ? `${precisaAtencao} precisa${precisaAtencao>1?"m":""} de atenção` : "Tudo em dia"}</small></span>
        </button>
        <button className="db-cartao" onClick={()=>go("planner")}>
          <span className="db-cartao-txt"><b>{entregasSemana.length}</b><span>Entregas esta semana</span><small>Ver entregas</small></span>
        </button>
        <button className="db-cartao" onClick={()=>go("financeiro")}>
          <span className="db-cartao-txt"><b>{fmtMoney(aReceber)}</b><span>A receber</span><small>{aReceberLista.length} pagamento{aReceberLista.length===1?"":"s"}</small></span>
        </button>
        <button className="db-cartao" onClick={()=>go("jobs")}>
          <span className="db-cartao-txt"><b>{proximos.length}</b><span>{proximos.length===1 ? "Próximo prazo" : "Próximos prazos"}</span><small>{proximoPrazo ? (diasAte(proximoPrazo.prazoEntrega)===0 ? "hoje" : `em ${diasAte(proximoPrazo.prazoEntrega)} dia${diasAte(proximoPrazo.prazoEntrega)>1?"s":""}`) : "sem prazos marcados"}</small></span>
        </button>
      </div>

      {/* prioridade + hoje */}
      <div className="db-linha db-linha-1">
        <section className="db-bloco db-prioridade">
          <h2><DbIcone tipo="bandeira"/>Minha prioridade</h2>
          {prioridade ? (
            <div className="db-prio-corpo">
              <div className="db-prio-info">
                <div className="db-prio-nome"><DbLogo marca={prioridade.marca} logos={logos} tamanho={34}/><b>{prioridade.marca}</b><span className="db-selo">{prioridade.status}</span></div>
                {PASSOS.map(([chave,texto])=>{
                  const ok = !!(prioridade.passosDashboard||{})[chave];
                  return <label key={chave} className={"db-check"+(ok?" ok":"")}><input type="checkbox" checked={ok} onChange={()=>marcarPasso(prioridade, chave)}/><span className="db-caixinha"><Icon name="check" size={16}/></span>{texto}</label>;
                })}
              </div>
              <div className="db-prio-prazo">
                <small>Prazo de entrega</small>
                {prioridade.prazoEntrega ? <>
                  <b><Icon name="calendar_month" size={20}/>{dataBR(prioridade.prazoEntrega)}</b>
                  <span>{diasAte(prioridade.prazoEntrega)===0 ? "é hoje" : diasAte(prioridade.prazoEntrega)<0 ? `${-diasAte(prioridade.prazoEntrega)} dias atrasado` : `${diasAte(prioridade.prazoEntrega)} dias`}</span>
                </> : <span>Sem prazo definido</span>}
                <button className="db-btn-escuro" onClick={()=>go("jobs")}>Continuar<Icon name="arrow_forward" size={20}/></button>
              </div>
            </div>
          ) : <p className="db-vazio">Nenhum job ativo agora. Que tal criar uma nova campanha?</p>}
        </section>

        <section className="db-bloco db-hoje">
          <div className="db-bloco-topo">
            <h2><DbIcone tipo="circulo"/>Hoje <small>{hojeD.getDate()} de {MESES_EXT[hojeD.getMonth()]}</small></h2>
            <button className="db-link" onClick={()=>go("planner")}>Ver todas<Icon name="arrow_forward" size={16}/></button>
          </div>
          {tarefasHoje.length ? tarefasHoje.slice(0,6).map(t=>{
            const ok = !!feitos[hoje+"|"+t.id];
            return (
              <div key={t.id} className={"db-tarefa"+(ok?" ok":"")}>
                <label className="db-check"><input type="checkbox" checked={ok} onChange={()=>marcarTarefa(t.id)}/><span className="db-caixinha"><Icon name="check" size={16}/></span><span className="db-tarefa-txt">{t.texto}</span></label>
                <DbTag texto={t.tag}/>
                <button className="db-seta" onClick={()=>go(t.pagina)} aria-label="Abrir"><Icon name="chevron_right" size={20}/></button>
              </div>
            );
          }) : <p className="db-vazio">Nada marcado para hoje. Agende no Planner!</p>}
        </section>
      </div>

      {/* meus jobs + calendário */}
      <div className="db-linha db-linha-2">
        <section className="db-bloco">
          <div className="db-bloco-topo">
            <h2><DbIcone tipo="maleta"/>Meus jobs</h2>
            <button className="db-link" onClick={()=>go("jobs")}>Ver todos<Icon name="arrow_forward" size={16}/></button>
          </div>
          <div className="db-abas">
            {[["andamento","Em andamento"],["aguardando","Aguardando aprovação"],["concluidos","Concluídos"]].map(([k,t])=>
              <button key={k} className={abaJobs===k?"ativa":""} onClick={()=>setAbaJobs(k)}>{t}<span>{gruposJobs[k].length}</span></button>)}
          </div>
          {listaJobs.length ? listaJobs.map(j=>{
            const etapa = etapaDoJob(j.status);
            const d = j.prazoEntrega ? diasAte(j.prazoEntrega) : null;
            return (
              <button key={j.id} className="db-job" onClick={()=>go("jobs")}>
                <DbLogo marca={j.marca} logos={logos}/>
                <span className="db-job-nome"><b>{j.marca}</b><small>{descricaoJob(j)}</small></span>
                <span className="db-etapas">
                  {ETAPAS_JOB.map((e,i)=><span key={e} className={"db-etapa"+(i<=etapa?" feita":"")+(i===etapa?" atual":"")}><i/><small>{e}</small></span>)}
                </span>
                <span className="db-job-prazo"><small>Prazo</small><b>{j.prazoEntrega ? dataBR(j.prazoEntrega) : "Sem prazo"}</b>{d!==null && <span className="db-pilula">{d===0 ? "hoje" : d<0 ? `${-d} dias atrás` : `${d} dias`}</span>}</span>
              </button>
            );
          }) : <p className="db-vazio">Nenhum job aqui.</p>}
        </section>

        <section className="db-bloco">
          <div className="db-bloco-topo">
            <h2><DbIcone tipo="calendario"/>Calendário da semana</h2>
            <button className="db-link" onClick={()=>go("planner")}>Ver calendário<Icon name="arrow_forward" size={16}/></button>
          </div>
          <div className="db-semana">
            {diasDaSemana.map((d,i)=>{
              const iso = isoLocal(d);
              const tem = itensDoDia(iso).length>0;
              return <button key={iso} className={(iso===diaSel?"sel ":"")+(iso===hoje?"hoje":"")} onClick={()=>setDiaSel(iso)}><small>{DIAS_SEMANA[i]}</small><b>{String(d.getDate()).padStart(2,"0")}</b>{tem && <i/>}</button>;
            })}
          </div>
          <div className="db-agenda">
            {itensDiaSel.length ? itensDiaSel.map(t=>(
              <button key={t.id} className="db-agenda-item" onClick={()=>go(t.pagina)}>
                <span className="db-agenda-quando">{t.sub || "Dia"}</span>
                <span className="db-agenda-txt">{t.texto}</span>
                <DbTag texto={t.tag}/>
              </button>
            )) : <p className="db-vazio">Nada agendado neste dia.</p>}
          </div>
        </section>
      </div>

      {ideiaAberta && <Modal title={ideiaAberta.titulo} onClose={()=>setIdeiaAberta(null)}>
        <div className="db-ideia-detalhe">
          {ideiaAberta.descricao && <p>{ideiaAberta.descricao}</p>}
          {ideiaAberta.gancho && <><small>Gancho</small><p className="db-gancho">“{ideiaAberta.gancho}”</p></>}
          {ideiaAberta.formato && <><small>Formato</small><p>{ideiaAberta.formato}</p></>}
          {ideiaAberta.passos && ideiaAberta.passos.length>0 && <><small>Como fazer</small><ol>{ideiaAberta.passos.map((p,k)=><li key={k}>{p}</li>)}</ol></>}
          {ideiaAberta.inspirado_em && <><small>Inspiração</small><p>{ideiaAberta.inspirado_em}{ideiaAberta.link && <> · <a href={ideiaAberta.link} target="_blank" rel="noopener">ver o vídeo de referência</a></>}</p></>}
          <button className="db-btn-escuro" onClick={()=>criarRoteiro(ideiaAberta)}>Criar roteiro no quadro<Icon name="arrow_forward" size={20}/></button>
        </div>
      </Modal>}
      {verTodasIdeias && <Modal title="Ideias rápidas" onClose={()=>setVerTodasIdeias(false)}>
        <div className="db-ideias-lista">
          {ideias.map((i,n)=><button key={i.titulo+n} onClick={()=>{setVerTodasIdeias(false); setIdeiaAberta(i);}}><b>{i.titulo}</b><small>{i.descricao}</small>{i.inspirado_em && <em>inspirado em {i.inspirado_em}</em>}</button>)}
          {ideiasSalvas && ideiasSalvas.geradoEm && <p className="db-dica">Ideias de {new Date(ideiasSalvas.geradoEm).toLocaleDateString("pt-BR")}, com base em {concorrentes.length} concorrente(s) e {ideiasSalvas.referencias||0} vídeo(s) que você transcreveu na aba Roteiros.</p>}
        </div>
      </Modal>}
      {editandoConc && <DbConcorrentes lista={concorrentes} onSalvar={salvarConcorrentes} onFechar={()=>setEditandoConc(false)} abrirAba={abrirAba}/>}

      {/* ideias + ferramentas */}
      <div className="db-linha db-linha-3">
        <section className="db-bloco">
          <div className="db-bloco-topo">
            <h2><DbIcone tipo="brilho"/>Ideias rápidas</h2>
            <span className="db-topo-acoes">

const PLATFORM_TONE = {Instagram:"wine",TikTok:"gray",YouTube:"blue",Kwai:"green",Outra:"yellow"};

const STATUS_DOT = {Planejado:"var(--butter)", Gravado:"var(--wine)", Entregue:"var(--moss)"};

function MiniCalendar({cursor, setCursor, todayStr, itemsByDate, onPickDay}){
  const first = new Date(cursor.y, cursor.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(cursor.y, cursor.m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const isoOf = (d) => `${cursor.y}-${String(cursor.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  return (
    <div className="card" style={{padding:16}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
        <strong style={{fontSize:14}}>{monthNames[cursor.m]} {cursor.y}</strong>
        <div style={{display:"flex", gap:4}}>
          <button className="icon-btn" style={{width:26,height:26}} onClick={()=>setCursor(c=>{ const m=c.m-1; return m<0?{y:c.y-1,m:11}:{y:c.y,m}; })}><Icon name="chevron_left" size={16}/></button>
          <button className="icon-btn" style={{width:26,height:26}} onClick={()=>setCursor(c=>{ const m=c.m+1; return m>11?{y:c.y+1,m:0}:{y:c.y,m}; })}><Icon name="chevron_right" size={16}/></button>
        </div>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, textAlign:"center"}}>
        {dowShort.map(d=><div key={d} style={{fontSize:10, fontWeight:700, color:"var(--graphite-soft)", padding:"2px 0"}}>{d[0]}</div>)}
        {cells.map((d,idx)=>{
          if(d===null) return <div key={"e"+idx}></div>;
          const iso = isoOf(d);
          const hasItems = (itemsByDate[iso]||[]).length>0;
          const isToday = iso===todayStr;
          return (
            <div key={iso} onClick={()=>onPickDay(iso)} style={{
              width:26,height:26, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:12.5, cursor:"pointer", margin:"1px auto", position:"relative",
              background: isToday ? "var(--graphite)" : "transparent", color: isToday ? "#fff" : "var(--graphite)"
            }}>
              {d}
              {hasItems && !isToday && <span style={{position:"absolute", bottom:1, width:4,height:4, borderRadius:"50%", background:"var(--butter)"}}></span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PlannerLegend({state, monthItems}){
  const counts = {Planejado:0, Gravado:0, Entregue:0};
  monthItems.forEach(i=>{ if(counts[i.status]!==undefined) counts[i.status]++; });
  const finalidadeCounts = {};
  FINALIDADES.forEach(f=>{ finalidadeCounts[f] = monthItems.filter(i=>(i.categoria||"Conteúdos")===f).length; });
  return (
    <div className="card" style={{padding:16, marginTop:16}}>
      <div style={{fontSize:13, fontWeight:700, textTransform:"uppercase", letterSpacing:".06em", color:"var(--graphite-soft)", marginBottom:8}}>Finalidade</div>
      {FINALIDADES.map(f=>(
        <div key={f} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0", fontSize:14.5}}>
          <span style={{display:"flex", alignItems:"center", gap:8}}><span style={{width:8,height:8,borderRadius:"50%", background:FINALIDADE_COLOR[f], display:"inline-block"}}></span>{f}</span>
          <span style={{color:"var(--graphite-soft)"}}>{finalidadeCounts[f]}</span>
        </div>
      ))}
      <div style={{fontSize:13, fontWeight:700, textTransform:"uppercase", letterSpacing:".06em", color:"var(--graphite-soft)", margin:"14px 0 8px"}}>Status</div>
      {["Planejado","Gravado","Entregue"].map(s=>(
        <div key={s} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0", fontSize:14.5}}>
          <span style={{display:"flex", alignItems:"center", gap:8}}><span style={{width:8,height:8,borderRadius:"50%", background:STATUS_DOT[s], display:"inline-block"}}></span>{s}</span>
          <span style={{color:"var(--graphite-soft)"}}>{counts[s]}</span>

function DayModal({iso, items, onClose, onAdd, onEdit, onDelete}){
  const d = new Date(iso+"T00:00:00");
  const dateLabel = d.toLocaleDateString('pt-BR', {day:"numeric", month:"long", year:"numeric"});
  return (
    <Modal title={dateLabel} onClose={onClose}>
      <div style={{display:"flex", alignItems:"center", gap:6, fontSize:13.5, fontWeight:600, color:"var(--graphite-soft)", marginBottom:10}}>
        <Icon name="videocam" size={16}/>Agendados neste dia ({items.length})
      </div>
      {items.length===0 && <p style={{fontSize:15, color:"var(--graphite-soft)", marginBottom:14}}>Nada agendado ainda para esse dia.</p>}
      {items.map(it=>(
        <div className="row-item" key={it.id}>
          <div style={{flex:1}}>
            <strong style={{fontSize:14}}>{it.titulo}</strong>
            <div style={{display:"flex", gap:6, marginTop:6}}>
              <Badge tone={FINALIDADE_TONE[it.categoria]||"gray"}>{it.categoria||"Conteúdos"}</Badge>
              <Badge tone={PLATFORM_TONE[it.plataforma]||"gray"}>{it.plataforma}</Badge>

function Planner({state, updateState}){
  const [cursor,setCursor] = useState(()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; });
  const [modal,setModal] = useState(null); // {defaultDate}
  const [editing,setEditing] = useState(null);
  const [dayModal,setDayModal] = useState(null); // iso string
  const [monthFilter,setMonthFilter] = useState("Todos");

  const first = new Date(cursor.y, cursor.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(cursor.y, cursor.m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const isoOf = (d) => `${cursor.y}-${String(cursor.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const itemsByDate = useMemo(()=>{
    const map = {};
    state.planner.forEach(it=>{ (map[it.data] = map[it.data]||[]).push(it); });
    return map;
  },[state.planner]);

  const todayStr = todayISO();

  function saveItem(item){
    const exists = state.planner.some(p=>p.id===item.id);
    const list = exists ? state.planner.map(p=>p.id===item.id?item:p) : [...state.planner, item];
    updateState({...state, planner:list});
    setModal(null); setEditing(null);
  }
  function removeItem(id){
    updateState({...state, planner: state.planner.filter(p=>p.id!==id)});
  }

  const monthItems = state.planner.filter(p=>p.data && p.data.startsWith(`${cursor.y}-${String(cursor.m+1).padStart(2,"0")}`));
  const counts = {Planejado:0, Gravado:0, Entregue:0};
  monthItems.forEach(i=>{ if(counts[i.status]!==undefined) counts[i.status]++; });
  const filteredMonthItems = monthFilter==="Todos" ? monthItems : monthItems.filter(i=>i.status===monthFilter);

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">Planner de conteúdo</h1>
          <p className="page-sub">Organize seu calendário de publicações</p>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal({defaultDate:todayStr})}><Icon name="add" size={17}/>Agendar</button>
      </div>

      <div className="planner-grid" style={{display:"grid", gridTemplateColumns:"250px 1fr", gap:16, alignItems:"start"}}>
        <div>
          <MiniCalendar cursor={cursor} setCursor={setCursor} todayStr={todayStr} itemsByDate={itemsByDate} onPickDay={(iso)=>setDayModal(iso)}/>
          <PlannerLegend state={state} monthItems={monthItems}/>
        </div>

        <div>
          <div className="card" style={{marginBottom:18}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
              <h3 style={{margin:0, fontSize:31, fontWeight:700}}>{monthNames[cursor.m]} {cursor.y}</h3>
              <div style={{display:"flex", gap:8}}>
                <button className="icon-btn" onClick={()=>setCursor(c=>{ const m=c.m-1; return m<0?{y:c.y-1,m:11}:{y:c.y,m}; })}><Icon name="chevron_left"/></button>
                <button className="btn btn-ghost btn-sm" onClick={()=>{const d=new Date(); setCursor({y:d.getFullYear(),m:d.getMonth()});}}>Hoje</button>
                <button className="icon-btn" onClick={()=>setCursor(c=>{ const m=c.m+1; return m>11?{y:c.y+1,m:0}:{y:c.y,m}; })}><Icon name="chevron_right"/></button>
              </div>
            </div>
            <div className="cal-grid">
              {dowShort.map(d=><div className="cal-dow" key={d}>{d}</div>)}
              {cells.map((d,idx)=>{
                if(d===null) return <div className="cal-cell empty-cell" key={"e"+idx}></div>;
                const iso = isoOf(d);
                const items = itemsByDate[iso]||[];
                return (
                  <div className={"cal-cell " + (iso===todayStr?"today":"")} key={iso} onClick={()=>setDayModal(iso)} style={{cursor:"pointer"}}>
                    <div className="cal-daynum">{d}</div>
                    {items.slice(0,3).map(it=>(
                      <div key={it.id} className="cal-chip" style={{background: FINALIDADE_COLOR[it.categoria]||"var(--line)", color:"#fff", display:"flex", alignItems:"flex-start", gap:4}}>
                        <span style={{width:5,height:5,borderRadius:"50%", background:"#fff", flexShrink:0, marginTop:4, opacity: it.status==="Entregue"?1:0.4}}></span>
                        <span className="cal-chip-text" style={{flex:1, minWidth:0}}>{it.titulo}</span>
                      </div>
                    ))}
                    {items.length>3 && <div style={{fontSize:10.5, color:"var(--graphite-soft)"}}>+{items.length-3} mais</div>}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="card">
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10}}>
              <h3 style={{margin:0}}>Este mês</h3>
              <select value={monthFilter} onChange={e=>setMonthFilter(e.target.value)} style={{padding:"7px 12px", borderRadius:10, border:"1px solid var(--line)", fontSize:14.5}}>
                {["Todos","Planejado","Gravado","Entregue"].map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
            <div className="grid grid-3" style={{marginBottom:16}}>
              <StatCard label="Planejado" value={counts.Planejado} icon="edit_calendar"/>
              <StatCard label="Gravado" value={counts.Gravado} icon="videocam"/>
              <StatCard label="Entregue" value={counts.Entregue} icon="check_circle"/>
            </div>
            {filteredMonthItems.length===0 ? (
              <p style={{color:"var(--graphite-soft)", fontSize:14, textAlign:"center", padding:"14px 0"}}>Nenhum registro neste mês.</p>
            ) : filteredMonthItems.map(it=>(
              <div className="row-item" key={it.id}>
                <div style={{flex:1}}><strong>{it.titulo}</strong></div>
                <Badge tone={FINALIDADE_TONE[it.categoria]||"gray"}>{it.categoria||"Conteúdos"}</Badge>
                <Badge tone={PLATFORM_TONE[it.plataforma]||"gray"}>{it.plataforma}</Badge>
                <Badge tone={it.status==="Entregue"?"green":it.status==="Gravado"?"wine":"yellow"}>{it.status}</Badge>
                <div style={{fontSize:14.5, color:"var(--graphite-soft)", minWidth:50}}>{it.data.slice(8,10)}/{it.data.slice(5,7)}</div>
                <div style={{display:"flex", gap:6}}>
                  <button className="icon-btn" onClick={()=>setEditing(it)}><Icon name="edit" size={17}/></button>
                  <button className="icon-btn" onClick={()=>removeItem(it.id)}><Icon name="delete" size={17}/></button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {dayModal && (
        <DayModal
          iso={dayModal}
          items={itemsByDate[dayModal]||[]}
          onClose={()=>setDayModal(null)}
          onAdd={()=>{ setModal({defaultDate:dayModal}); setDayModal(null); }}
          onEdit={(it)=>{ setEditing(it); setDayModal(null); }}
          onDelete={(id)=>{ removeItem(id); }}
        />
      )}

      {(modal || editing) && (
        <PlannerModal
          initial={editing}
          defaultDate={modal ? modal.defaultDate : (editing && editing.data)}
          onClose={()=>{setModal(null); setEditing(null);}}
          onSave={saveItem}
        />
      )}
    </div>
  );
}

function NichoModal({state, updateState, onClose}){
  const [novo,setNovo] = useState("");
  const [editId,setEditId] = useState(null);
  const [editVal,setEditVal] = useState("");
  function add(){
    if(!novo.trim()) return;
    updateState({...state, nichos:[...state.nichos, {id:uid(), nome:novo.trim()}]});
    setNovo("");
  }
  function remove(id){ updateState({...state, nichos: state.nichos.filter(n=>n.id!==id)}); }
  function saveEdit(id){
    updateState({...state, nichos: state.nichos.map(n=>n.id===id?{...n,nome:editVal}:n)});
    setEditId(null);
  }
  return (
    <Modal title="Gerenciar nichos" onClose={onClose}>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:13.5, fontWeight:600, color:"var(--graphite-soft)", marginBottom:8}}>Nichos padrão</div>
        {NICHOS_DEFAULT.map(n=><Badge key={n} tone="gray" style={{marginRight:6, marginBottom:6, display:"inline-flex"}}>{n}</Badge>)}
      </div>
      <div style={{fontSize:13.5, fontWeight:600, color:"var(--graphite-soft)", marginBottom:8}}>Seus nichos</div>
      {state.nichos.length===0 && <p style={{fontSize:14.5, color:"var(--graphite-soft)"}}>Nenhum nicho personalizado ainda.</p>}
      {state.nichos.map(n=>(
        <div className="row-item" key={n.id}>
          {editId===n.id ? (
            <input style={{flex:1, padding:"8px 10px", border:"1px solid var(--line)", borderRadius:8}} value={editVal} onChange={e=>setEditVal(e.target.value)}/>
          ) : <span style={{flex:1}}>{n.nome}</span>}
          <div style={{display:"flex", gap:6}}>
            {editId===n.id ? (
              <button className="icon-btn" onClick={()=>saveEdit(n.id)}><Icon name="check" size={17}/></button>
            ) : (
              <button className="icon-btn" onClick={()=>{setEditId(n.id); setEditVal(n.nome);}}><Icon name="edit" size={17}/></button>
            )}
            <button className="icon-btn" onClick={()=>remove(n.id)}><Icon name="delete" size={17}/></button>
          </div>
        </div>
      ))}
      <div style={{display:"flex", gap:8, marginTop:10}}>
        <input style={{flex:1}} placeholder="Novo nicho" value={novo} onChange={e=>setNovo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") add();}}/>
        <button className="btn btn-primary btn-sm" onClick={add}>Adicionar</button>
      </div>
    </Modal>
  );
}

function EntregavelBlock({tipo, label, icon, items, onChange}){
  const concluidos = items.filter(i=>i.concluido).length;
  function addItem(){ onChange([...items, novoEntregavelItem(tipo, items.length+1)]); }
  function removeItem(id){ onChange(items.filter(i=>i.id!==id)); }
  function toggleConcluido(id){ onChange(items.map(i=>i.id===id?{...i,concluido:!i.concluido}:i)); }
  function setRoteiroStatus(id, val){ onChange(items.map(i=>i.id===id?{...i,roteiroStatus:val}:i)); }
  return (
    <div style={{marginBottom:14}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
        <span style={{fontSize:14.5, fontWeight:600, display:"flex", alignItems:"center", gap:6}}><Icon name={icon} size={16}/>{label} ({concluidos}/{items.length})</span>
        <button className="btn btn-ghost btn-sm" onClick={addItem}><Icon name="add" size={14}/>Adicionar</button>
      </div>
      {items.map(it=>(
        <div className="row-item" key={it.id} style={{padding:"8px 12px"}}>
          <div onClick={()=>toggleConcluido(it.id)} style={{cursor:"pointer", width:18,height:18, borderRadius:"50%", border:"1.5px solid "+(it.concluido?"var(--moss)":"var(--line)"), background: it.concluido?"var(--moss)":"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0}}>
            {it.concluido && <Icon name="check" size={12} style={{color:"#fff"}}/>}
          </div>
          <span style={{flex:1, fontSize:15}}>{it.label}</span>
          <select value={it.roteiroStatus} onChange={e=>setRoteiroStatus(it.id, e.target.value)} style={{fontSize:13.5, padding:"6px 8px", width:"auto"}}>
            {(STATUS_OPTIONS_BY_TIPO[tipo]||ROTEIRO_STATUS_OPTIONS).map(o=><option key={o}>{o}</option>)}
          </select>
          <button className="icon-btn" style={{width:30,height:30}} onClick={()=>removeItem(it.id)}><Icon name="delete" size={15}/></button>
        </div>
      ))}
    </div>
  );
}

  {label:"Outro", plataforma:"Outra", formato:"Feed"}
];
const TIPO_ICON = {videos:"videocam", fotos:"photo_camera", stories:"auto_stories"};
const TIPO_DEFAULT_PLATAFORMA = {videos:"Instagram Reels", fotos:"Instagram Feed", stories:"Instagram Story"};

function DistribuirPlannerModal({marca, prazoEntrega, entregaveis, onClose, onConfirm}){
  const baseItems = useMemo(()=>{
    const list = [];
    ["fotos","videos","stories"].forEach(tipo=>{
      (entregaveis[tipo]||[]).forEach(it=>{
        list.push({itemId:it.id, tipo, label:it.label, data:"", horario:"", plataformaLabel:""});
      });
    });
    return list;
  },[]);
  const [items,setItems] = useState(baseItems);

  function updateItem(itemId, k, v){
    setItems(prev=>prev.map(i=>i.itemId===itemId?{...i,[k]:v}:i));
  }
  function usarSugestao(){
    const n = items.length;
    if(n===0) return;
    const endISO = prazoEntrega || todayISO();
    const endDate = new Date(endISO+"T00:00:00");
    const horarios = ["09:00","12:00","15:00","18:00"];
    setItems(prev=>prev.map((it, idx)=>{
      const offsetDays = (n-1-idx);
      const d = new Date(endDate);
      d.setDate(d.getDate()-offsetDays);
      return {...it, data: d.toISOString().slice(0,10), horario: horarios[idx % horarios.length], plataformaLabel: TIPO_DEFAULT_PLATAFORMA[it.tipo]};
    }));
  }

  return (
    <Modal title={<span style={{display:"flex",alignItems:"center",gap:8}}><Icon name="calendar_month"/>Distribuir no Planner</span>} onClose={onClose}>
      <p style={{fontSize:14.5, color:"var(--graphite-soft)", marginTop:-6}}>Escolha uma data e horário para cada entregável. Você pode usar a sugestão automática como ponto de partida.</p>
      <div style={{display:"flex", justifyContent:"flex-end", marginBottom:14}}>
        <button type="button" className="btn btn-ghost btn-sm" onClick={usarSugestao}><Icon name="auto_awesome" size={15}/>Usar sugestão automática</button>
      </div>
      {items.length===0 && <p style={{fontSize:15, color:"var(--graphite-soft)"}}>Nenhum entregável cadastrado ainda.</p>}
      {items.map(it=>(
        <div className="card" key={it.itemId} style={{background:"var(--warm-white)", marginBottom:12, padding:14}}>
          <div style={{display:"flex", alignItems:"center", gap:6, fontWeight:600, fontSize:15, marginBottom:10}}>
            <Icon name={TIPO_ICON[it.tipo]} size={16}/>{it.label}
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1.2fr", gap:10}}>
            <Field label="Data"><input type="date" value={it.data} onChange={e=>updateItem(it.itemId,"data",e.target.value)}/></Field>
            <Field label="Horário"><input type="time" value={it.horario} onChange={e=>updateItem(it.itemId,"horario",e.target.value)}/></Field>
            <Field label="Plataforma">
              <select value={it.plataformaLabel} onChange={e=>updateItem(it.itemId,"plataformaLabel",e.target.value)}>
                <option value="">Selecione</option>
                {PLATAFORMA_FORMATO_OPTIONS.map(o=><option key={o.label}>{o.label}</option>)}
              </select>
            </Field>
          </div>
        </div>
      ))}
      <div style={{display:"flex", justifyContent:"flex-end", gap:10, marginTop:8}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={items.length===0} onClick={()=>{
          const incompleto = items.some(i=>!i.data || !i.plataformaLabel);
          if(incompleto){ alert('Preencha data e plataforma de cada item, ou clique em "Usar sugestão automática".'); return; }
          onConfirm(items);
        }}>Distribuir</button>
      </div>
    </Modal>
  );
}

function defaultJobObj(){
  return {
    id: uid(),
    marca:"", tipo:"", nicho:"", categoria:"UGC",
    entregaveis: emptyEntregaveis(),
    prazoEntrega:"", dataEntregaReal:"",
    dataPagamento:"", formaPagamento:"PIX",
    tipoJob:"Pago", valor:"", moeda:"BRL",
    tipoPagamento:"unico", divisaoParcelas:"50-50", parcelasPersonalizadas:[],
    recorrente:false,
    recorrencia:{ frequencia:"Mensal (30d)", intervaloDias:30, proximaCriacao:"", encerrarEm:"", gerarReceita:true },
    status:"Lead",
    roteiroConteudo:"", roteiroStatus:"Em criação", roteiroTemplate:"",
    nf:{ precisa:false, status:"Pendente", numero:"", dataEmissao:"", valor:"", arquivo:"" },
    pagamento:{ status:"Em aberto", forma:"PIX", dataPrevista:"", dataPagamento:"", comprovante:"" },
    trafegoPago:{ ativo:false, periodo:"6m", dataInicio:todayISO(), dataFim:calcDataFim(todayISO(),"6m"), valorAdicional:"", plataformas:[], contrato:"Nenhum", precos:{"3m":"","6m":"","12m":""}, perdido:false, perdidoEm:"" },
    observacoes:""
  };
}
function mergeJobWithDefaults(initial){
  if(!initial) return defaultJobObj();
  const d = defaultJobObj();
  return {
    ...d, ...initial,
    entregaveis: { videos:[], fotos:[], stories:[], ...(initial.entregaveis||{}) },
    recorrencia: { ...d.recorrencia, ...(initial.recorrencia||{}) },
    nf: { ...d.nf, ...(initial.nf||{}) },
    pagamento: { ...d.pagamento, ...(initial.pagamento||{}) },
    trafegoPago: { ...d.trafegoPago, ...(initial.trafegoPago||{}), plataformas: (initial.trafegoPago && initial.trafegoPago.plataformas) || [], precos: {...d.trafegoPago.precos, ...((initial.trafegoPago && initial.trafegoPago.precos) || {})} },
    parcelasPersonalizadas: initial.parcelasPersonalizadas || []
  };
}

function Collapsible({title, icon, defaultOpen, badge, children}){
  const [open,setOpen] = useState(!!defaultOpen);
  return (
    <div className="card" style={{background:"var(--warm-white)", marginBottom:14}}>
      <div onClick={()=>setOpen(o=>!o)} style={{display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer"}}>
        <strong style={{fontSize:14, display:"flex", alignItems:"center", gap:6}}>
          {icon && <Icon name={icon} size={17}/>}{title}{badge}
        </strong>
        <Icon name={open?"expand_less":"expand_more"} size={20}/>
      </div>
      {open && <div style={{marginTop:14}}>{children}</div>}
    </div>
  );
}

  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setNested=(group,k,v)=>setF(p=>({...p, [group]:{...p[group], [k]:v}}));

  useEffect(()=>{
    if(!onAutosave) return;
    if(!f.marca || !f.marca.trim()) return;
    const t = setTimeout(()=>{
      onAutosave(f);
      setSavedTick(true);
      setTimeout(()=>setSavedTick(false), 1200);
    }, 500);
    return ()=>clearTimeout(t);
  },[f]);

  const allNichos = [...NICHOS_DEFAULT, ...(state.nichos||[]).map(n=>n.nome)];
  const totalItens = f.entregaveis.videos.length + f.entregaveis.fotos.length + f.entregaveis.stories.length;
  const concluidosTotal = [...f.entregaveis.videos,...f.entregaveis.fotos,...f.entregaveis.stories].filter(i=>i.concluido).length;
  const pctCompleto = totalItens>0 ? Math.round((concluidosTotal/totalItens)*100) : 0;

  const [distribModal,setDistribModal] = useState(false);

    const novos = items.map(it=>{
      const opt = PLATAFORMA_FORMATO_OPTIONS.find(o=>o.label===it.plataformaLabel) || PLATAFORMA_FORMATO_OPTIONS[0];
      return {id:uid(), titulo:`${f.marca||"Job"} - ${it.label}`, plataforma:opt.plataforma, formato:opt.formato, status:"Planejado", data:it.data, marca:f.marca, notas:`Horário sugerido: ${it.horario}`, categoria: f.categoria || "UGC", jobId: f.id};
    });
    updateState({...state, planner:[...state.planner, ...novos]});
    setDistribModal(false);
  }

  function togglePlataforma(p){
    const list = f.trafegoPago.plataformas.includes(p) ? f.trafegoPago.plataformas.filter(x=>x!==p) : [...f.trafegoPago.plataformas, p];
    setNested("trafegoPago","plataformas",list);

  function setPeriodo(key){
    setNested("trafegoPago","periodo",key);

  }

  const orgVal = Number(f.valor||0);
  const trafVal = Number(f.trafegoPago.valorAdicional||0);

  const FREQ_DIAS = {"Semanal (7d)":7, "Quinzenal (15d)":15, "Mensal (30d)":30, "Personalizado":f.recorrencia.intervaloDias};

    setNested("recorrencia","frequencia",freq);

  function parcelasPreview(){
    if(f.tipoPagamento==="unico") return [{label:"Pagamento único", valor: orgVal}];

    return f.parcelasPersonalizadas.length>0 ? f.parcelasPersonalizadas : [{label:"Adicione parcelas personalizadas abaixo", valor:0}];

  function addParcelaPersonalizada(){
    setF(p=>({...p, parcelasPersonalizadas:[...p.parcelasPersonalizadas, {id:uid(), label:`Parcela ${p.parcelasPersonalizadas.length+1}`, valor:""}]}));

  function updateParcela(id, k, v){
    setF(p=>({...p, parcelasPersonalizadas: p.parcelasPersonalizadas.map(pc=>pc.id===id?{...pc,[k]:v}:pc)}));

      <Field label="Tipo de conteúdo">

            <Field label="Anexar NF (PDF/imagem)">
