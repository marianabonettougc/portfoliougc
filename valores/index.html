<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mari Bonetto | Portfólio UGC</title>
<style>body{margin:0;background:#f6efe6}</style>
</head>
<body>
<script>
// =====================================================================
// PÁGINA /valores: mostra o portfólio completo + a seção "Investimentos UGC".
// Os VALORES ficam só aqui (o portfólio normal, sem /valores, não tem os preços).
// Para mudar um preço, edite a lista abaixo.
// =====================================================================
window.VALORES = {
  titulo: "Investimentos UGC",
  tabelas: [
    { titulo: "Contrate 1 vez", itens: [
      ["1 vídeo", "R$257"], ["2 vídeos", "R$460"], ["3 vídeos", "R$645"], ["4 vídeos", "R$820"],
      ["8 vídeos", "R$1.560"], ["10 vídeos", "R$1.960"], ["12 vídeos", "R$2.280"] ] },
    { titulo: "Com recorrência", obs: "(mínimo 3 meses)", itens: [
      ["4 vídeos", "R$720"], ["6 vídeos", "R$1.080"], ["8 vídeos", "R$1.440"],
      ["10 vídeos", "R$1.800"], ["15 vídeos", "R$2.700"], ["20 vídeos", "R$3.600"] ] },
    { titulo: "Adicionais", itens: [
      ["Teste AB", "R$50"], ["3 fotos", "R$80"], ["+90 dias ADS", "R$77"], ["+Colab", "R$100"],
      ["3 stories", "R$165"], ["3 stories UGC", "R$130"], ["Repost TikTok", "R$100"] ] }
  ],
  pacotes: [
    { nome: "UGC 1", titulos: ["1 vídeo", "Teste A/B"], itens: ["Roteiro", "Gravação", "Edição"], uso: "Direito de uso em ADS por 06 meses", preco: "307,00", economia: "Economize R$77" },
    { nome: "UGC 2", titulos: ["3 vídeos"], itens: ["Roteiro", "Gravação", "Edição"], uso: "Direito de uso em ADS por 06 meses", preco: "660,00", economia: "Economize R$342" },
    { nome: "UGC 3", titulos: ["5 vídeos", "3 fotos"], itens: ["Roteiro", "Gravação", "Edição"], uso: "Direito de uso em ADS por 06 meses", preco: "997,00", economia: "Economize R$753", destaque: "Mais escolhido" }
  ]
};

// Carrega o portfólio da raiz do site e mostra aqui mesmo, com o endereço /valores
(function () {
  var raiz = location.pathname.replace(/valores\/?.*$/, "");     // "/" no domínio próprio
  var dados = "<script>window.VALORES=" + JSON.stringify(window.VALORES) + ";<\/script>";
  fetch(raiz + "index.html", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      html = html.replace(/<head>/i, '<head><base href="' + raiz + '">' + dados +
        '<meta name="robots" content="noindex, nofollow">');
      document.open(); document.write(html); document.close();
      // link com # (ex.: /valores#valores): rola até a parte certa depois de montar a página
      if (location.hash) setTimeout(function () {
        var alvo = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (alvo) alvo.scrollIntoView();
      }, 600);
    })
    .catch(function () { location.href = raiz; });
})();
</script>
</body>
</html>
