<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mari Bonetto | Portfólio UGC</title>
<style>body{margin:0;background:#f6efe6}</style>
<script>
// PÁGINA /valores: abre o portfólio da raiz com a seção "Investimentos UGC".
// Os preços ficam em valores/dados.js (o portfólio normal não carrega esse arquivo).
// Abre o portfólio de verdade (e não montado por cima desta página) para o celular mostrar
// o mesmo visual do computador reduzido; lá o endereço volta a aparecer como /valores.
(function () {
  var raiz = location.pathname.replace(/valores\/?.*$/, "");
  location.replace(raiz + "?valores" + location.hash);
})();
</script>
</head>

</html>
